<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KnifeCraft — Phase 2: The Feel</title>
<style>
  :root{
    /* THEME TOKENS — swap the real cookbook serif / clean sans here in Phase 3 (one-line change) */
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --cream:#F8F4EE; --walnut:#8A5A3C; --steel:#50545A; --sage:#8DAA6D; --tomato:#D94B45; --golden:#D8A03D;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--cream);overscroll-behavior:none;}
  body{position:fixed;inset:0;font-family:var(--font-sans);-webkit-user-select:none;user-select:none;}
  #game{position:absolute;inset:0;touch-action:none;display:block;}
  #hud{position:fixed;z-index:3;pointer-events:none;white-space:nowrap;}
  #hudTitle{font-family:var(--font-serif);font-weight:500;color:var(--steel);}
  /* .88 not .65: on the order paper the objective line measured 3.04:1, below AA. One alpha value (§55). */
  #hudSub{font-family:var(--font-sans);color:rgba(80,84,90,.88);}
  #debug{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 8px);right:8px;z-index:5;
    font:11px/1.6 var(--font-mono);color:var(--steel);background:rgba(248,244,238,.82);
    border:1px solid rgba(80,84,90,.15);border-radius:8px;padding:8px 10px;min-width:148px;
    box-shadow:0 2px 8px rgba(80,84,90,.08);transition:opacity 200ms ease-out;cursor:pointer;}
  #debug.hidden{opacity:0;pointer-events:none;}
  #debug b{color:#3A3D42;font-weight:600;}
  #debugTab{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 8px);right:8px;z-index:4;width:24px;height:24px;
    border-radius:50%;border:1px solid rgba(80,84,90,.2);background:rgba(248,244,238,.8);color:var(--steel);
    font:11px var(--font-mono);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #reset{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);z-index:5;
    width:56px;height:56px;border-radius:50%;border:1px solid rgba(138,90,60,.25);
    background:var(--cream);color:var(--walnut);font-size:22px;line-height:1;
    box-shadow:0 3px 12px rgba(80,84,90,.14);cursor:pointer;
    transition:transform 150ms ease-out, box-shadow 150ms ease-out;}
  #reset:active{transform:translateY(2px);box-shadow:0 1px 5px rgba(80,84,90,.14);}
  #reset.pulse{animation:pulse 1600ms ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 3px 12px rgba(80,84,90,.14);}50%{box-shadow:0 3px 18px rgba(216,160,61,.45);}100%{box-shadow:0 3px 12px rgba(80,84,90,.14);}}
  /* progress pips: wordless — marks fill as cuts land (§2). A grid technique shows one row per axis. */
  #pips{display:flex;flex-direction:column;gap:5px;margin-top:9px;}
  .pipRow{display:flex;gap:6px;}
  /* stage ticks: which ingredient of a multi-ingredient prep you are on — no words */
  #stages{display:none;gap:5px;margin-top:8px;}
  #stages i{display:block;width:15px;height:3px;border-radius:2px;background:rgba(138,90,60,.22);
    transition:background 220ms ease-out;}
  #stages i.now{background:var(--golden);}
  #stages i.done{background:var(--walnut);}
  #pips i{display:block;width:7px;height:7px;border-radius:50%;border:1px solid rgba(138,90,60,.42);
    transition:background 200ms ease-out, transform 200ms ease-out, border-color 200ms ease-out;}
  #pips i.on{background:var(--walnut);border-color:var(--walnut);transform:scale(1.18);}
  #pause{position:fixed;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid rgba(80,84,90,.16);
    background:rgba(248,244,238,.82);color:rgba(80,84,90,.8);display:flex;align-items:center;justify-content:center;
    gap:3px;cursor:pointer;padding:0;}
  #pause span{display:block;width:3px;height:11px;background:currentColor;border-radius:1px;}
  #paused{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(248,244,238,.5);backdrop-filter:blur(3px);
    font-family:var(--font-serif);font-size:24px;letter-spacing:.24em;color:var(--steel);}
  #paused.show{display:flex;}
  #game{transition:filter 300ms ease-out;}
  #game.blur{filter:blur(7px) saturate(.94);}
  /* result screen — the delta is the headline (§5) */
  #result{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;
    opacity:0;transition:opacity 300ms ease-out;font-family:var(--font-sans);padding:16px;}
  #result.show{display:flex;opacity:1;}
  #resultCard{width:min(88vw,344px);max-height:min(94vh,560px);overflow-y:auto;overflow-x:hidden;text-align:center;
    background:rgba(250,247,241,.96);border:1px solid rgba(138,90,60,.14);border-radius:20px;
    padding:22px 22px 14px;box-shadow:0 18px 52px rgba(60,40,24,.20);scrollbar-width:none;}
  #resultCard::-webkit-scrollbar{display:none;}
  #gradeWord{font-family:var(--font-serif);font-size:clamp(18px,4.4vmin,25px);letter-spacing:.26em;color:var(--steel);}
  #gradeWord.sig{color:var(--golden);letter-spacing:.13em;font-size:clamp(14px,3.4vmin,18px);line-height:1.32;
    border:2px solid rgba(216,160,61,.5);border-radius:10px;padding:8px 12px;display:inline-block;max-width:100%;}
  #stars{color:var(--golden);font-size:12px;letter-spacing:.34em;margin-top:9px;}
  #rows{margin:14px 0 2px;}
  #rows .row,#details .row{display:flex;justify-content:space-between;align-items:baseline;
    font-size:14px;color:rgba(80,84,90,.7);padding:3px 4px;}
  #rows .row b,#details .row b{font-weight:600;color:var(--steel);font-variant-numeric:tabular-nums;}
  #deltaLine{font-size:clamp(28px,6.6vmin,40px);font-weight:600;color:var(--golden);
    font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.15;}
  #firstPrep{font-family:var(--font-serif);font-size:12px;letter-spacing:.18em;color:rgba(138,90,60,.68);margin-top:8px;}
  #prepAgain{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;
    background:var(--walnut);color:#FFF9F1;font:600 17px var(--font-sans);cursor:pointer;
    box-shadow:0 6px 18px rgba(138,90,60,.26);}
  #prepAgain:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(138,90,60,.24);}
  #nextRecipe{display:block;width:100%;margin-top:8px;padding:8px;border:0;background:none;
    color:rgba(80,84,90,.62);font:500 14px var(--font-sans);cursor:pointer;}
  #detailsToggle{margin-top:4px;border:0;background:none;color:rgba(80,84,90,.5);
    font:12px var(--font-sans);letter-spacing:.04em;cursor:pointer;}
  #details{display:none;margin-top:4px;padding-top:8px;border-top:1px solid rgba(138,90,60,.13);}
  #details.open{display:block;}
  #showCuts{margin-top:10px;border:1px solid rgba(80,84,90,.18);background:none;border-radius:10px;
    padding:8px 16px;color:var(--steel);font:12px var(--font-sans);cursor:pointer;white-space:nowrap;}
  /* PANTRY — a tester's larder. Every ingredient in the game, reachable in one tap. Auto-built from the
     recipe list, so an ingredient added to CONFIG.INGREDIENTS appears here with no UI edit. */
  #pantryBtn{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);z-index:5;
    width:56px;height:56px;border-radius:50%;border:1px solid rgba(138,90,60,.25);
    background:var(--cream);box-shadow:0 3px 12px rgba(80,84,90,.14);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform 150ms ease-out, box-shadow 150ms ease-out;}
  #pantryBtn:active{transform:translateY(2px);box-shadow:0 1px 5px rgba(80,84,90,.14);}
  #pantryBtn i{display:block;width:6px;height:6px;border-radius:50%;background:var(--walnut);}
  #pantryBtn div{display:grid;grid-template-columns:repeat(2,6px);gap:4px;}
  #pantry{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
    padding:16px;background:rgba(248,244,238,.55);backdrop-filter:blur(3px);opacity:0;
    transition:opacity 220ms ease-out;font-family:var(--font-sans);}
  #pantry.show{display:flex;opacity:1;}
  #pantryCard{width:min(92vw,468px);max-height:min(92vh,660px);display:flex;flex-direction:column;
    background:rgba(250,247,241,.97);border:1px solid rgba(138,90,60,.14);border-radius:20px;
    box-shadow:0 18px 52px rgba(60,40,24,.20);overflow:hidden;}
  #pantryHead{display:flex;align-items:baseline;justify-content:space-between;
    padding:18px 20px 12px;border-bottom:1px solid rgba(138,90,60,.13);}
  #pantryHead h2{margin:0;font-family:var(--font-serif);font-weight:500;font-size:17px;
    letter-spacing:.24em;color:var(--steel);}
  #pantryHead span{font-size:12px;color:rgba(80,84,90,.88);}
  #pantryBody{overflow-y:auto;padding:14px;scrollbar-width:none;}
  #pantryBody::-webkit-scrollbar{display:none;}
  /* alphas per §55: .62 measured 2.57:1 on the card, worse than the 3.04:1 already rejected on #hudSub */
  .pGroup{font-family:var(--font-serif);font-size:11px;letter-spacing:.2em;color:var(--walnut);
    margin:6px 4px 8px;}
  .pGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-bottom:16px;}
  .pItem{display:flex;flex-direction:column;gap:7px;padding:10px;border-radius:14px;
    border:1px solid rgba(138,90,60,.16);background:rgba(255,252,246,.9);text-align:left;cursor:pointer;
    transition:border-color 160ms ease-out, box-shadow 160ms ease-out, transform 120ms ease-out;}
  .pItem:hover{border-color:rgba(138,90,60,.36);box-shadow:0 3px 10px rgba(80,84,90,.09);}
  .pItem:active{transform:translateY(1px);}
  .pItem.now{border-color:var(--golden);box-shadow:0 0 0 1px rgba(216,160,61,.45);}
  .pThumb{width:100%;height:52px;display:block;}
  .pName{font-family:var(--font-serif);font-size:14px;color:var(--steel);line-height:1.1;}
  .pTechs{display:flex;flex-wrap:wrap;gap:4px;}
  .pTech{border:1px solid rgba(80,84,90,.2);background:none;border-radius:8px;padding:3px 8px;
    font:11px var(--font-sans);color:rgba(80,84,90,.88);cursor:pointer;white-space:nowrap;
    transition:background 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out;}
  .pTech:hover{border-color:var(--walnut);color:var(--walnut);}
  .pTech.now{background:var(--walnut);border-color:var(--walnut);color:#FFF9F1;}
  #pantryClose{margin:0 14px 14px;padding:13px;border:0;border-radius:14px;background:var(--walnut);
    color:#FFF9F1;font:600 15px var(--font-sans);cursor:pointer;box-shadow:0 6px 18px rgba(138,90,60,.24);}
  #pantryClose:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(138,90,60,.22);}
  /* ================= STORY LAYER =================
     Presentation only: a DOM layer over the live kitchen. Nothing here knows about cuts, grades or
     recipes. Sizes are clamp()/vmin so the composition holds at any aspect ratio (§19). */
  body.storyOn #hud, body.storyOn #pause, body.storyOn #reset, body.storyOn #pantryBtn,
  body.storyOn #debug, body.storyOn #debugTab, body.storyOn #storyTab{opacity:0 !important;pointer-events:none !important;}
  #story{position:fixed;inset:0;z-index:9;display:none;font-family:var(--font-sans);
    -webkit-tap-highlight-color:transparent;cursor:pointer;}
  #story.on{display:block;}
  #storyScrim,#storyVeil,#storyShade,#storyFx{position:absolute;inset:0;pointer-events:none;}
  #storyScrim{transition:background-color 1200ms ease-out, backdrop-filter 1200ms ease-out,
    -webkit-backdrop-filter 1200ms ease-out;}
  #story.sFaded #storyScrim{background-color:rgba(58,44,32,.20);
    backdrop-filter:saturate(.84) brightness(.94);-webkit-backdrop-filter:saturate(.84) brightness(.94);}
  #story.sDecline #storyScrim{background-color:rgba(54,48,42,.38);
    backdrop-filter:saturate(.56) brightness(.76);-webkit-backdrop-filter:saturate(.56) brightness(.76);}
  #story.sClean #storyScrim{background-color:rgba(255,244,226,.04);
    backdrop-filter:saturate(1.02) brightness(1.03);-webkit-backdrop-filter:saturate(1.02) brightness(1.03);}
  #story.sThrive #storyScrim{background-color:rgba(216,160,61,.12);
    backdrop-filter:saturate(1.10) brightness(1.08);-webkit-backdrop-filter:saturate(1.10) brightness(1.08);}
  #storyVeil{background:rgba(30,23,17,0);transition:background 800ms ease-out;}
  #story.veil #storyVeil{background:rgba(30,23,17,.60);}
  /* the reading surface: cream type needs a ground, and a bottom wash keeps the kitchen visible above it */
  #storyShade{background:linear-gradient(to top,rgba(26,20,15,.88),rgba(26,20,15,.60) 34%,rgba(26,20,15,0) 72%);
    opacity:0;transition:opacity 700ms ease-out;}
  #story.on #storyShade{opacity:1;}
  #storyWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;padding:clamp(16px,4vmin,38px);gap:clamp(12px,3vmin,26px);}
  #storyStage{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;gap:clamp(10px,2.4vmin,20px);
    align-items:center;justify-content:center;pointer-events:none;}
  #storyStage svg{display:block;width:100%;height:auto;}
  .sArt{width:min(84vw,430px);max-height:46vh;filter:drop-shadow(0 18px 44px rgba(20,12,6,.42));}
  .sArt.sProp{width:min(44vw,214px);filter:drop-shadow(0 10px 30px rgba(20,12,6,.34));}
  .sArt svg{max-height:46vh;}
  #storyPanel{width:100%;max-width:min(92vw,560px);text-align:center;}
  .sLine{font-family:var(--font-serif);color:#FBF4E8;margin:0 auto;max-width:34ch;
    font-size:clamp(16px,3.4vmin,25px);line-height:1.46;text-wrap:pretty;
    opacity:0;animation:sUp 620ms cubic-bezier(.22,.9,.3,1) forwards;}
  .sLine + .sLine{margin-top:clamp(7px,1.5vmin,13px);}
  .sQuote{font-family:var(--font-serif);color:#F3C775;max-width:26ch;margin:clamp(12px,2.4vmin,20px) auto 0;
    font-size:clamp(21px,4.8vmin,35px);line-height:1.26;opacity:0;
    animation:sQuoteIn 900ms cubic-bezier(.2,.9,.28,1) forwards;text-shadow:0 2px 20px rgba(216,160,61,.3);}
  .sTitle{font-family:var(--font-serif);color:#FBF4E8;font-size:clamp(19px,4.4vmin,32px);
    letter-spacing:.26em;margin:0 auto clamp(9px,2vmin,15px);opacity:0;animation:sUp 700ms ease-out forwards;}
  .sKicker,.sStepLabel{font-family:var(--font-serif);letter-spacing:.3em;color:#F3C775;
    margin:0 auto clamp(8px,1.7vmin,13px);opacity:0;animation:sUp 520ms ease-out forwards;}
  .sKicker{font-size:clamp(11px,2.1vmin,13px);}
  .sStepLabel{font-size:clamp(14px,2.8vmin,18px);}
  @keyframes sUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes sQuoteIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
  .sBtn{margin:clamp(14px,2.6vmin,22px) auto 0;display:block;padding:15px clamp(20px,4vw,34px);
    border:0;border-radius:14px;background:var(--walnut);color:#FFF9F1;letter-spacing:.12em;
    font:600 clamp(14px,2.8vmin,17px) var(--font-sans);cursor:pointer;
    box-shadow:0 8px 26px rgba(26,16,8,.42);opacity:0;animation:sUp 520ms ease-out .3s forwards;}
  .sBtn:active{transform:translateY(1px);}
  #storyHint{font:10px var(--font-sans);letter-spacing:.24em;color:rgba(251,244,232,.46);
    margin-top:clamp(9px,1.8vmin,15px);opacity:0;transition:opacity 600ms ease-out;}
  #storyHint.show{opacity:1;}
  /* dialogue: one portrait, one bubble — no tree, no choices (§11) */
  .sDlg{display:flex;align-items:flex-end;gap:clamp(9px,2.2vmin,18px);justify-content:center;
    width:100%;max-width:min(92vw,540px);}
  .sDlg.you{flex-direction:row-reverse;}
  .sDlgArt{flex:0 0 auto;width:clamp(64px,14vmin,100px);height:clamp(64px,14vmin,100px);border-radius:50%;
    overflow:hidden;box-shadow:0 8px 24px rgba(20,12,6,.45);}
  .sBubble{background:rgba(250,246,238,.97);border-radius:18px;
    padding:clamp(11px,2.2vmin,16px) clamp(14px,2.8vmin,21px);box-shadow:0 12px 32px rgba(20,12,6,.38);
    opacity:0;animation:sUp 460ms ease-out forwards;text-align:left;}
  .sWho{font-family:var(--font-serif);font-size:clamp(10px,1.9vmin,12px);letter-spacing:.24em;
    color:var(--walnut);margin-bottom:5px;}
  .sSay{font-family:var(--font-serif);font-size:clamp(15px,3.1vmin,22px);line-height:1.38;
    color:var(--steel);max-width:24ch;margin:0;}
  /* the restoration cards — the real board, the real knife, the real ingredients (§8) */
  .sCards{display:flex;flex-wrap:wrap;gap:clamp(9px,2vmin,16px);justify-content:center;}
  .sCard{width:clamp(104px,23vmin,148px);background:rgba(250,246,238,.97);border-radius:16px;
    padding:clamp(9px,1.9vmin,14px);box-shadow:0 12px 30px rgba(20,12,6,.36);text-align:center;
    opacity:0;transform:translateY(16px) scale(.94);animation:sPop 560ms cubic-bezier(.2,.9,.3,1) forwards;}
  @keyframes sPop{to{opacity:1;transform:none;}}
  .sCard canvas,.sCard svg{width:100%;height:clamp(44px,8.5vmin,60px);display:block;}
  .sCardName{font-family:var(--font-serif);font-size:clamp(12px,2.2vmin,14px);color:var(--steel);
    margin-top:8px;line-height:1.2;}
  .sCardTag{font:9px var(--font-sans);letter-spacing:.2em;color:var(--walnut);margin-top:4px;}
  .sFleck{position:absolute;border-radius:50%;pointer-events:none;}
  .sDust{width:5px;height:5px;background:rgba(216,203,180,.62);animation:sDust 1700ms ease-in forwards;}
  @keyframes sDust{0%{opacity:.85;}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4);}}
  .sSpark{width:7px;height:7px;background:rgba(255,242,210,.95);
    box-shadow:0 0 11px 4px rgba(255,226,160,.55);animation:sSpark 1500ms ease-out forwards;}
  @keyframes sSpark{0%{opacity:0;transform:scale(.3);}22%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(.5) translateY(-26px);}}
  .sCoin{width:14px;height:14px;background:radial-gradient(circle at 34% 28%,#FFE9AE,#D8A03D 62%,#B27E28);
    box-shadow:0 1px 4px rgba(60,40,16,.5), 0 0 10px 2px rgba(255,214,130,.35);
    animation:sCoin 1100ms cubic-bezier(.4,.1,.25,1) forwards;}
  @keyframes sCoin{0%{opacity:0;transform:scale(.5);}16%{opacity:1;}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.45);}}
  /* milestone: a quiet card, never a modal — it never interrupts a prep (§13) */
  #storyMs{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 78px);z-index:6;
    transform:translateX(-50%) translateY(-8px);max-width:min(88vw,404px);pointer-events:none;opacity:0;
    transition:opacity 700ms ease-out, transform 700ms ease-out;}
  #storyMs.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #storyMsCard{background:rgba(250,246,238,.96);border:1px solid rgba(138,90,60,.16);border-radius:16px;
    padding:13px 18px;box-shadow:0 12px 34px rgba(60,40,24,.22);text-align:center;}
  #storyMsCard span{display:block;font:9px var(--font-sans);letter-spacing:.28em;color:var(--walnut);margin-bottom:6px;}
  #storyMsCard p{margin:0;font-family:var(--font-serif);font-size:clamp(14px,2.7vmin,17px);line-height:1.4;color:var(--steel);}
  /* chapter jumps: the prototype's way to walk the whole flow (§22) */
  #storyTab{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom, 0px) + 80px);z-index:5;height:26px;
    padding:0 11px;border-radius:13px;border:1px solid rgba(138,90,60,.25);background:var(--cream);
    color:var(--walnut);font:10px/25px var(--font-mono);letter-spacing:.16em;cursor:pointer;
    box-shadow:0 2px 8px rgba(80,84,90,.12);}
  #chapters{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(248,244,238,.55);backdrop-filter:blur(3px);font-family:var(--font-sans);}
  #chapters.show{display:flex;}
  #chaptersCard{width:min(92vw,424px);max-height:min(92vh,620px);display:flex;flex-direction:column;
    background:rgba(250,247,241,.97);border:1px solid rgba(138,90,60,.14);border-radius:20px;
    box-shadow:0 18px 52px rgba(60,40,24,.2);overflow:hidden;}
  #chaptersCard h2{margin:0;padding:18px 20px 12px;font-family:var(--font-serif);font-weight:500;
    font-size:16px;letter-spacing:.24em;color:var(--steel);border-bottom:1px solid rgba(138,90,60,.13);}
  #chaptersBody{overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px;
    scrollbar-width:none;mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);}
  #chaptersBody::-webkit-scrollbar{display:none;}

  kitchen: {

  },

    SEQ_CEILING_MS: 4200,                       // the payoff's budget. Was 3900 with 21ms of margin, and that
