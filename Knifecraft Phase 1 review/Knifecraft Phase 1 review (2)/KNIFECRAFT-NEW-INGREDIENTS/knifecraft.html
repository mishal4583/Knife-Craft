      c2.strokeStyle = 'rgba(22,48,16,0.42)'; c2.lineWidth = 1.8; c2.stroke(blade);
      c2.restore();
    }
  },
  /* PINEAPPLE — corn's capsule at a stouter aspect. The diamond lattice lives ONLY on the skin band, through
     the same even-odd annulus clip peach uses, so a diced piece's exposed flesh stays plain gold — diamonds
     are a rind feature, not a flesh feature, and the two must not merge into one wall-to-wall texture. */
  /* PINEAPPLE, PEELED — the base sprite, because a pineapple is a peelable food (see skinAlpha): the whole body
     is flesh, not flesh with a rind window, and the shell is a separate sprite on top. Pale butter yellow cut by
     the spiral furrows a knife actually leaves — parallel diagonal ridges, each lit on its upper flank and
     shadowed into the groove below — with brown eye remnants left down in the furrows and a warmer amber margin
     where the blade ran closest to the rind. */
  pineapple(c2, g){

    flg.addColorStop(0,'#FBF1C4'); flg.addColorStop(0.46,'#F2DE97'); flg.addColorStop(1,'#DBBF66');

    const R = g.rx + g.ry, S = 30;

    c2.restore();

      c2.beginPath();
      c2.ellipse(g.cx+Math.cos(a)*g.rx*0.92*r, g.cy+Math.sin(a)*g.ry*0.90*r, 2.6, 1.5, a, 0, Math.PI*2);

    const inner = innerGeom(g, 16);                                // amber margin: where the blade ran near the rind
    const rim = new Path2D(); rim.addPath(silPath(g, 0)); rim.addPath(silPath(inner, 0));
    c2.save(); c2.clip(rim, 'evenodd');
    c2.fillStyle = 'rgba(188,140,44,0.42)'; c2.fill(silPath(g, 0));
    c2.restore();
    c2.restore();
    c2.strokeStyle = 'rgba(150,112,34,0.42)'; c2.lineWidth = 2; c2.stroke(silPath(g, 0));
  },
  /* ASPARAGUS — flesh painted FIRST (pale, the whole body), then skin as a dark annulus ring on top (peach's
     technique), so a cut face is automatically the lighter tone underneath, never a re-derived colour. Tip
     scales and ridges are drawn last, over both, because they are exterior features visible whether or not the
     piece has been cut. */
  /* ASPARAGUS, rebuilt. Two real bugs, caught at true scale, not by eye on the whole-batch thumbnail:
     (1) the flesh fill targeted `silPath(g,0)` — the FULL body — instead of `silPath(flesh,0)`, so pale
     flooded the entire spear and the skin annulus painted on top of it read as a hairline, not a body colour.
     (2) peach's evenodd ring trick was the wrong tool here: it exists to let skin FEATURES (blush, suture)
     survive on top of an opaque flesh fill. Asparagus has no such feature competing with the flesh, so it
     only needs the plain order every taper food already uses — skin fill first, flesh inset on top — same as
     pear. (3) the tip "scales" were straight triangles tiled in a grid, which reads as a chevron arrow lattice,
     not overlapping bracts. Rebuilt as rounded teardrop shapes, staggered and overlapping, each with its own
     size jitter and a highlight/shadow pair, which is what makes a cluster of marks read as scale layering. */
  asparagus(c2, g){
    /* NINE SPEARS, each a cluster lobe of its own — separate entities, so a chop gives nine chunks per band and
       nothing shares a body. Nothing is painted outside the lobes: the earlier one-body version filled the
       silhouette first, and that fill was the dark green slab showing between the spears. */
    const TONES = [ ['#B4D46A','#86B540','#4F7C29'], ['#A9CC5E','#7CAC38','#487423'],
                    ['#BDDA76','#8FBE49','#56842F'], ['#A2C657','#75A433','#436E20'] ];
    let i = 0;
    for(const L of g.leaves){
      const t = TONES[i++ % TONES.length], rx = L.rx, ry = L.ry;
      c2.save(); c2.translate(g.cx+L.dx, g.cy+L.dy); c2.rotate(L.rot||0);

      spear.moveTo(-rx, -ry*0.90);
      spear.bezierCurveTo(-rx*0.20, -ry*0.84, rx*0.44, -ry*0.76, rx*0.70, -ry*0.88);
      spear.bezierCurveTo(rx*0.88, -ry*0.74, rx*0.97, -ry*0.34, rx, 0);
      spear.bezierCurveTo(rx*0.97, ry*0.34, rx*0.88, ry*0.74, rx*0.70, ry*0.88);
      spear.bezierCurveTo(rx*0.44, ry*0.76, -rx*0.20, ry*0.84, -rx, ry*0.90);
      spear.closePath();
      const bg = c2.createLinearGradient(0, -ry, 0, ry);
      bg.addColorStop(0, t[0]); bg.addColorStop(0.46, t[1]); bg.addColorStop(1, t[2]);
      c2.fillStyle = bg; c2.fill(spear);
      c2.save(); c2.clip(spear);
      const pale = c2.createLinearGradient(-rx, 0, -rx*0.10, 0);      // the butt end is paler, as a real spear is
      pale.addColorStop(0,'rgba(238,246,206,0.85)'); pale.addColorStop(0.55,'rgba(226,240,186,0.35)');
      pale.addColorStop(1,'rgba(226,240,186,0)');
      c2.fillStyle = pale; c2.fill(spear);
      c2.lineCap = 'round';
      c2.strokeStyle = 'rgba(255,255,230,0.34)'; c2.lineWidth = 2.0;   // lit ridge along the top of the shaft
      c2.beginPath(); c2.moveTo(-rx*0.90, -ry*0.42);
      c2.quadraticCurveTo(0, -ry*0.46, rx*0.66, -ry*0.40); c2.stroke();
      c2.strokeStyle = 'rgba(34,56,18,0.30)'; c2.lineWidth = 1.6;      // shadow ridge along the bottom
      c2.beginPath(); c2.moveTo(-rx*0.88, ry*0.46);
      c2.quadraticCurveTo(0, ry*0.52, rx*0.64, ry*0.42); c2.stroke();
      for(let s=0;s<5;s++){                                           // small leaf scars up the shaft

        c2.fillStyle = 'rgba(196,216,140,0.42)';

      }

      for(let k=0;k<22;k++){
        const h1 = ((k*40503) % 1009)/1009, h2 = ((k*29587) % 997)/997;
        const frac = Math.pow(h1, 0.7), x = tipX0 + (rx*0.99 - tipX0)*frac;
        const rr = ry*(1 - frac*0.62), y = (h2*2-1)*rr*0.86;
        const rad = ry*(0.34 + 0.20*((k*104729)%23)/23);
        c2.save(); c2.translate(x, y); c2.rotate(((k*6151)%13-6)*0.05);
        c2.fillStyle = k%2 ? 'rgba(52,84,30,0.60)' : 'rgba(68,100,40,0.52)';
        c2.beginPath(); c2.ellipse(0, 0, rad*1.35, rad*0.86, 0, 0, Math.PI*2); c2.fill();
        c2.fillStyle = 'rgba(214,232,158,0.20)';
        c2.beginPath(); c2.ellipse(-rad*0.32, -rad*0.30, rad*0.60, rad*0.40, 0, 0, Math.PI*2); c2.fill();
        c2.restore();
      }
      const tipShade = c2.createLinearGradient(tipX0, 0, rx, 0);
      tipShade.addColorStop(0,'rgba(22,40,12,0)'); tipShade.addColorStop(1,'rgba(22,40,12,0.34)');
      c2.fillStyle = tipShade; c2.fill(spear);
      c2.restore();
      const cut = c2.createLinearGradient(-rx, -ry, -rx*0.92, ry);     // the trimmed butt: a pale cut face
      cut.addColorStop(0,'#F2F7DC'); cut.addColorStop(1,'#D6E4B0');
      c2.fillStyle = cut;
      c2.beginPath(); c2.ellipse(-rx*0.985, 0, ry*0.30, ry*0.86, 0, 0, Math.PI*2); c2.fill();
      c2.strokeStyle = 'rgba(120,148,80,0.45)'; c2.lineWidth = 1; c2.stroke();
      c2.strokeStyle = 'rgba(38,62,22,0.50)'; c2.lineWidth = 1.5; c2.stroke(spear);
      c2.restore();
    }
  },
  /* SPRING ONION — seven stalks, each its own cluster lobe (asparagus's rule). The stalk is drawn as one
     outline whose half-width is a function of length: a swollen ovoid bulb over the first fifth, a pinch at the
     neck, then a near-constant tube to the tip — the reference's silhouette exactly. Colour runs along the same
     axis in four stops (root white → bulb white → pale sheath green → deep leaf green), which is the one cue
     that says spring onion and nothing else. Sheath lines, a lit top ridge, the hollow cut tube at the tip and
     a fine root fringe off the butt finish it. */
  springonion(c2, g){
    const TONES = [ ['#EAF3C8','#9ECB55','#3F7A25'], ['#E6F0C0','#96C44C','#38701F'],
                    ['#F0F7D4','#A8D262','#47842C'], ['#E2EDBA','#8FBC44','#33691C'] ];
    let i = 0;
    for(const L of g.leaves){
      const t = TONES[i++ % TONES.length], rx = L.rx, ry = L.ry;
      c2.save(); c2.translate(g.cx+L.dx, g.cy+L.dy); c2.rotate(L.rot||0);
      /* Half-width along the stalk, u=0 at the butt. The bulb is ADDED to the tube, not max()'d over it: a max
         clamps the gaussian into a flat plateau and puts a hard corner where bulb meets neck, which is what
         made the first pass read as a polygon slab. The butt itself rounds off (a bulb is a teardrop, not a
         cut face) and the green tube holds almost full thickness to a FLAT cut end, as in the reference. */
      const hw = u => {
        /* Proportion is the whole game here: a bulb much wider than the shaft turns the stalk into a dart (the
           second pass), and a bulb the same width as the shaft is a leek. The photo runs about 1.6:1 with a LONG
           soft neck, so the gaussian is wide and its amplitude modest, and the butt end is blunt, not pointed. */
        const bulb = Math.exp(-Math.pow((u-0.115)/0.115, 2));
        const tube = 0.60 + 0.035*Math.sin(u*7.0);                     // the shaft, faintly uneven
        /* The cap has to reach ZERO or the outline's first sample is a vertical wall with square corners — the
           flat-butt defect — but on a CIRCULAR arc: sqrt and pow caps both converge to a pencil point, and an
           ellipse quadrant is the only cap that reads as the end of a bulb. */
        const butt = u < 0.075 ? Math.sqrt(Math.max(0, 1 - Math.pow(1 - u/0.075, 2))) : 1;   // circular cap, not a cone
        /* And the tip: flat-cut, but a real tube has rounded corners there. 2% of the length is enough to kill
           the right angle without the ribbon-chamfer look of an earlier pass. */
        const tip  = u > 0.98 ? Math.sqrt(Math.max(0, (1-u)/0.02))*0.35 + 0.65 : 1;
        return ry*(tube + 0.42*bulb)*butt*tip;
      };
      /* COSINE SAMPLING, not uniform. The caps occupy a few percent of the length, so 64 even samples put only
         four or five points in each one and the round cap came out as a polygonal V — the "pointy butt" that
         survived two shape fixes. Clustering the samples at both ends resolves the caps without more points. */
      const N = 72, uAt = k => 0.5 - 0.5*Math.cos(Math.PI*k/N), stalk = new Path2D();
      for(let k=0;k<=N;k++){ const u = uAt(k), x = -rx + 2*rx*u, y = -hw(u);
        k ? stalk.lineTo(x, y) : stalk.moveTo(x, y); }
      for(let k=N;k>=0;k--){ const u = uAt(k); stalk.lineTo(-rx + 2*rx*u, hw(u)); }
      stalk.closePath();
      const bg = c2.createLinearGradient(-rx, 0, rx, 0);
      bg.addColorStop(0.00,'#FCFCF4'); bg.addColorStop(0.20,'#F7F8E8');   // bulb: white, barely warm
      bg.addColorStop(0.30, t[0]); bg.addColorStop(0.58, t[1]); bg.addColorStop(0.86, t[2]); bg.addColorStop(1.00, t[2]);
      c2.fillStyle = bg; c2.fill(stalk);
      c2.save(); c2.clip(stalk);
      /* Cross-section shading AND the contact shadow in one gradient. The stalks overlap (a bound bunch), and
         with only a bottom shade the overlapping white bulbs fused into one slab; a narrow dark band along each
         stalk's own TOP edge is the shadow the stalk above casts on it, which is what separates them. */
      const shade = c2.createLinearGradient(0, -ry, 0, ry);
      shade.addColorStop(0.00,'rgba(40,58,22,0.26)');                    // shadow of the stalk lying over this one
      shade.addColorStop(0.14,'rgba(255,255,236,0.14)');
      shade.addColorStop(0.30,'rgba(255,255,236,0.30)');                 // the lit crown of the tube
      shade.addColorStop(0.56,'rgba(255,255,236,0)');
      shade.addColorStop(1.00,'rgba(26,48,14,0.32)');
      c2.fillStyle = shade; c2.fill(stalk);
      c2.lineCap = 'round';
      c2.strokeStyle = 'rgba(255,255,238,0.40)'; c2.lineWidth = 1.8;      // lit ridge down the top of the tube
      c2.beginPath(); c2.moveTo(-rx*0.66, -ry*0.30);
      c2.quadraticCurveTo(0, -ry*0.34, rx*0.92, -ry*0.26); c2.stroke();
      c2.strokeStyle = 'rgba(52,86,30,0.13)'; c2.lineWidth = 1.0;         // lengthwise leaf fibres, green half only
      for(const fy of [-0.46, -0.10, 0.28, 0.56]){
        c2.beginPath(); c2.moveTo(-rx*0.05, ry*fy*0.9);
        c2.quadraticCurveTo(rx*0.5, ry*fy, rx*0.95, ry*fy*0.8); c2.stroke();
      }
      /* SHEATH COLLARS sit where the sheaths actually part — at the white→green transition. Painted mid-bulb
         they were three crescents floating in white with nothing to attach to. */
      c2.strokeStyle = 'rgba(150,178,96,0.40)'; c2.lineWidth = 1.3;
      for(const u of [0.28, 0.32, 0.36]){
        const x0 = -rx + 2*rx*u, hy = hw(u)*0.86;
        c2.beginPath(); c2.moveTo(x0, -hy);
        c2.quadraticCurveTo(x0 + rx*0.03, 0, x0, hy); c2.stroke();
      }
      c2.restore();
      /* The cut end: a squared face of leaf wall with the hollow as a long thin slit down it — drawn short and
         round it read as a keyhole punched in the tip, which is what the ring in the second pass was. */
      c2.fillStyle = '#2C5A1E';
      c2.beginPath(); c2.ellipse(rx*0.955, 0, ry*0.085, hw(0.955)*0.90, 0, 0, Math.PI*2); c2.fill();
      c2.fillStyle = '#16380F';
      c2.beginPath(); c2.ellipse(rx*0.955, 0, ry*0.042, hw(0.955)*0.58, 0, 0, Math.PI*2); c2.fill();
      /* ROOT TUFT — splayed, not a comb: each hair gets its own length, its own fan angle off the butt and its
         own bow, so the fringe reads as the photo's dense tangle rather than a row of equal bristles. */
      c2.lineCap = 'round';
      for(let k=0;k<26;k++){
        const r1 = ((k*7919) % 101)/101, r2 = ((k*104729) % 97)/97, r3 = ((k*40503) % 89)/89;
        /* The hairs leave from the BULB TIP now that the butt converges: spread along the first few percent of
           the taper rather than along a flat end wall, so the tuft grows out of a point. */
        const u0 = 0.006 + 0.055*Math.abs((k/25)*2 - 1);
        const y0 = ((k/25)*2 - 1)*hw(u0)*0.75;
        const ln = 5 + 10*r1, ang = (y0/(ry||1))*0.75 + (r2 - 0.5)*0.9;
        const x0 = -rx + 2*rx*u0, ex = x0 - Math.cos(ang)*ln, ey = y0 + Math.sin(ang)*ln;
        c2.strokeStyle = r3 > 0.5 ? 'rgba(232,224,192,0.88)' : 'rgba(206,196,160,0.72)';
        c2.lineWidth = 0.8 + 0.7*r3;
        c2.beginPath(); c2.moveTo(x0, y0*0.8);
        c2.quadraticCurveTo(x0 - ln*0.45, y0 + (r2-0.5)*8, ex, ey); c2.stroke();
      }
      c2.strokeStyle = 'rgba(44,74,26,0.45)'; c2.lineWidth = 1.5; c2.stroke(stalk);
      c2.restore();
    }
  },
  /* RADISH — a daikon: carrot's painter in white. Body is a near-white gradient with a cool underside (a white
     root with no value range reads as paper), horizontal root scars instead of carrot's ridges, a faint fibre
     line down the shoulder, and the leaf tops painted past the crown — stalks and blades, since a daikon's tops
     are what identify it once the colour has gone. */
  radish(c2, g){
    const skin = c2.createLinearGradient(g.cx, g.cy-g.rBig, g.cx, g.cy+g.rBig);
    skin.addColorStop(0,'#F7F8EE'); skin.addColorStop(0.30,'#E6E8D8'); skin.addColorStop(0.64,'#CFD2BE');
    skin.addColorStop(1,'#B7BAA4');
    c2.fillStyle = skin; c2.fill(silPath(g, 0));
    c2.save(); c2.clip(silPath(g, 0));
    const lit = c2.createLinearGradient(g.cx-g.rx*0.5, g.cy-g.rBig, g.cx+g.rx*0.3, g.cy-g.rBig*0.1);
    lit.addColorStop(0,'rgba(255,255,255,0.42)'); lit.addColorStop(1,'rgba(255,255,255,0)');
    c2.fillStyle = lit; c2.fill(silPath(g, 0));                     // specular kept to the upper shoulder only
    for(let i=0;i<16;i++){                                          // root scars: short arcs across the body
      const t = 0.06 + i*0.058, x = g.cx - g.rx + t*g.rx*2, h = taperH(g, x);
      if(h <= 0) continue;
      c2.strokeStyle = i%2 ? 'rgba(150,152,130,0.22)' : 'rgba(120,124,100,0.16)';
      c2.lineWidth = i%3 ? 1.1 : 1.6;
      c2.beginPath();
      c2.moveTo(x, taperY(g,x) - h*0.86);
      c2.quadraticCurveTo(x + 5, taperY(g,x), x, taperY(g,x) + h*0.86);
      c2.stroke();
      if(i%4 === 1){                                                // a few root hairs off the underside
        c2.strokeStyle = 'rgba(160,162,140,0.42)'; c2.lineWidth = 1;
        c2.beginPath(); c2.moveTo(x, taperY(g,x)+h*0.80);
        c2.quadraticCurveTo(x+7, taperY(g,x)+h*1.02, x+3, taperY(g,x)+h*1.18); c2.stroke();
      }
    }
    c2.strokeStyle = 'rgba(255,255,255,0.5)'; c2.lineWidth = 2.2;    // fibre line, along the lit flank
    c2.beginPath(); c2.moveTo(g.cx-g.rx*0.86, g.cy-g.rBig*0.34);
    c2.quadraticCurveTo(g.cx, g.cy-g.rBig*0.40, g.cx+g.rx*0.90, g.cy-g.rSmall*0.30); c2.stroke();
    c2.restore();
    const flesh = innerGeom(g, 24);                                  // cut faces read clearly brighter than skin
    c2.save(); c2.clip(silPath(g, 0));
    const fg = c2.createLinearGradient(g.cx, g.cy-g.rBig, g.cx, g.cy+g.rBig);
    fg.addColorStop(0,'#FFFFFF'); fg.addColorStop(0.5,'#FCFCF7'); fg.addColorStop(1,'#F4F5EC');
    c2.fillStyle = fg; c2.fill(silPath(flesh, 0));
    c2.restore();
    /* LEAF TOPS, past the crown — paint only, never part of the silhouette, so no cut, span or piece sees them.
       Pale ribbed stalks fanning out of the shoulder, each carrying a lobed blade. */
    const bx = g.cx - g.rx*0.94, by = g.cy;
    for(const [a, len, w, dark] of [[-0.92,104,13,1],[-0.52,124,15,0],[-0.14,132,16,1],
                                    [0.26,120,15,0],[0.66,98,13,1]]){
      c2.save(); c2.translate(bx, by); c2.rotate(Math.PI + a);
      const st = c2.createLinearGradient(0,-w*0.5, len, w*0.5);
      st.addColorStop(0,'#EFF3DC'); st.addColorStop(0.5,'#CFE0A4'); st.addColorStop(1,'#9CC066');
      c2.strokeStyle = st; c2.lineWidth = w*0.42; c2.lineCap = 'round';
      c2.beginPath(); c2.moveTo(0,0); c2.quadraticCurveTo(len*0.52, -w*0.30, len*0.72, -w*0.10); c2.stroke();
      c2.save(); c2.translate(len*0.72, -w*0.10);
      const blade = new Path2D();                                   // a lobed daikon leaf, not a smooth spade
      blade.moveTo(0, 0);
      blade.bezierCurveTo(len*0.10, -w*1.5, len*0.30, -w*1.9, len*0.44, -w*0.5);
      blade.bezierCurveTo(len*0.34, -w*0.2, len*0.40, w*1.4, len*0.24, w*1.1);
      blade.bezierCurveTo(len*0.12, w*1.7, len*0.04, w*0.9, 0, 0);
      blade.closePath();
      const lg = c2.createLinearGradient(0, -w, len*0.4, w);
      if(dark){ lg.addColorStop(0,'#4E8232'); lg.addColorStop(1,'#2F5A1E'); }
      else { lg.addColorStop(0,'#65A03F'); lg.addColorStop(1,'#3E7228'); }
      c2.fillStyle = lg; c2.fill(blade);
      c2.strokeStyle = 'rgba(28,58,18,0.32)'; c2.lineWidth = 1; c2.stroke(blade);
      c2.strokeStyle = 'rgba(216,238,170,0.35)'; c2.lineWidth = 1.2;
      c2.beginPath(); c2.moveTo(len*0.02, 0); c2.quadraticCurveTo(len*0.22, w*0.1, len*0.40, -w*0.35); c2.stroke();
      c2.restore();
      c2.restore();
    }
    c2.strokeStyle = 'rgba(150,152,130,0.40)'; c2.lineWidth = 1.6; c2.stroke(silPath(g, 0));
  },
  /* GREEN CHILLI — a glossy pod. Three things carry it: the value range across the body (yellow-green lit
     flank over a deep shaded underside, which is what makes a cylinder), one long hard SPECULAR streak broken
     into segments (a chilli's skin is the shiniest thing on this board), and the crooked stalk with its
     five-pointed calyx painted past the butt. The pale inner flesh is inset so a cut face opens onto seed
     wall rather than more skin. */
  chilli(c2, g){
    const sil = silPath(g, 0);
    const sk = c2.createLinearGradient(g.cx, g.cy-g.rBig*1.1, g.cx, g.cy+g.rBig*1.3);
    sk.addColorStop(0,'#8CC62E'); sk.addColorStop(0.24,'#6FAF1E');
    sk.addColorStop(0.58,'#4E8E14'); sk.addColorStop(0.84,'#356D0E'); sk.addColorStop(1,'#234E0A');
    c2.fillStyle = sk; c2.fill(sil);
    c2.save(); c2.clip(sil);
    const along = c2.createLinearGradient(g.cx-g.rx, g.cy, g.cx+g.rx, g.cy);   // the tip darkens and dries
    along.addColorStop(0,'rgba(96,150,28,0.20)'); along.addColorStop(0.55,'rgba(255,255,255,0)');
    along.addColorStop(1,'rgba(28,58,8,0.40)');
    c2.fillStyle = along; c2.fill(sil);
    const N = 40;                                                 // the specular: segmented, along the bow
    for(let i=0;i<N;i++){
      const t = i/(N-1), x = g.cx - g.rx*0.86 + 1.68*g.rx*t*0.86;
      const hh = taperH(g, x);
      if(hh <= 0) continue;
      const y = taperY(g, x) - hh*0.46;
      // gloss, not a painted line: the streak thins toward the tip and breaks twice along the way
      const brk = Math.sin(t*7.4) > -0.55 ? 1 : 0;
      if(!brk) continue;
      const w = hh*0.30*(1 - 0.45*t);
      c2.fillStyle = 'rgba(232,250,196,' + (0.34 - 0.22*t).toFixed(3) + ')';
      c2.beginPath(); c2.ellipse(x, y, w*1.9, w*0.52, 0.06, 0, Math.PI*2); c2.fill();
    }
    for(let i=0;i<5;i++){                                         // faint length creases down the shaded flank
      const f = 0.24 + i*0.16;
      c2.strokeStyle = 'rgba(40,78,14,0.16)'; c2.lineWidth = 1.2;
      c2.beginPath();
      for(let k=0;k<=24;k++){
        const x = g.cx - g.rx*0.84 + 1.66*g.rx*(k/24)*0.84, hh = taperH(g, x);
        if(hh <= 0) continue;
        const y = taperY(g, x) + hh*f;
        k ? c2.lineTo(x, y) : c2.moveTo(x, y);
      }
      c2.stroke();
    }
    /* The flesh is a THIN inner core, not a window: a pod is 4cm thick at most, so an inset generous enough
       to read on a carrot turns the whole chilli pale and it stops being a chilli. */
    /* The flesh core is confined to the MID-BODY: run it to the tip and the fine point lights up as a pale
       bead, which is what the first pass did. A pod is thin, so the core is narrow as well as short. */
    const flesh = innerGeom(g, 30);
    const fg = c2.createLinearGradient(g.cx-g.rx, g.cy, g.cx+g.rx*0.7, g.cy);   // fades out at both ends, so
    fg.addColorStop(0,'rgba(196,222,140,0)');                                    // no hard band and no pale
    fg.addColorStop(0.30,'rgba(196,222,140,0.85)');                              // bead at the fine tip
    fg.addColorStop(0.62,'rgba(178,208,118,0.75)');
    fg.addColorStop(1,'rgba(163,193,105,0)');
    c2.fillStyle = fg; c2.fill(silPath(flesh, 0));
    c2.restore();
    /* CALYX + STALK, past the butt: paint only. A five-pointed green collar clasping the shoulder, then a
       woody stalk that kinks once and dries to straw at its cut end — the reference's most identifying part. */
    const bx = g.cx - g.rx*0.94, by = taperY(g, g.cx - g.rx*0.92);
    c2.save(); c2.translate(bx, by); c2.rotate(-2.05);   // continues the body's line, tipping up and back
    const stalk = c2.createLinearGradient(0, 0, 0, -120);
    stalk.addColorStop(0,'#41701A'); stalk.addColorStop(0.55,'#5B8A26'); stalk.addColorStop(1,'#9FAE62');
    c2.strokeStyle = stalk; c2.lineCap = 'round';
    c2.lineWidth = 17;                                            // thick where it leaves the shoulder,
    c2.beginPath(); c2.moveTo(0, 0); c2.quadraticCurveTo(-4, -34, 10, -62); c2.stroke();
    c2.lineWidth = 10;                                            // thinner and kinked past the bend
    c2.beginPath(); c2.moveTo(10, -62); c2.quadraticCurveTo(26, -88, 52, -102); c2.stroke();
    c2.strokeStyle = 'rgba(206,228,152,0.34)'; c2.lineWidth = 3;   // a lit edge up the stalk
    c2.beginPath(); c2.moveTo(-3, -6);
    c2.bezierCurveTo(-9, -46, 13, -80, 41, -100); c2.stroke();
    const cal = c2.createLinearGradient(-26, -26, 26, 26);
    cal.addColorStop(0,'#7FB030'); cal.addColorStop(0.6,'#578A1C'); cal.addColorStop(1,'#375F10');
    c2.fillStyle = cal;
    for(let i=0;i<5;i++){                                         // the collar: five short pointed lobes
      const a = -1.5 + i*0.62;
      c2.save(); c2.rotate(a);
      c2.beginPath(); c2.moveTo(0, 0);
      c2.quadraticCurveTo(15, 10, 6, 26);
      c2.quadraticCurveTo(-5, 13, 0, 0); c2.closePath(); c2.fill();
      c2.restore();
    }
    c2.fillStyle = '#568A1E';
    c2.beginPath(); c2.ellipse(0, 4, 16, 12, 0, 0, Math.PI*2); c2.fill();
    c2.strokeStyle = 'rgba(40,74,14,0.36)'; c2.lineWidth = 1.4; c2.stroke();
    c2.restore();
    c2.strokeStyle = 'rgba(26,54,8,0.46)'; c2.lineWidth = 1.8; c2.stroke(sil);
  },
  /* BEETROOT, INTERIOR — the base sprite: ringed flesh, never seen on the whole beet. A beet's skin is opaque,
     so the rings are not a feature of the uncut root; painting them into the body left a bullseye sitting on
     the outside. The dark skin is a full-body SKIN layer over this (see skinAlpha / SKIN.beetroot), kept
     permanently rather than shed, so rings reach the eye only through a cut face. */
  beetroot(c2, g){
    const fg = c2.createRadialGradient(g.cx-g.rx*0.16, g.cy-g.rBig*0.08, g.rBig*0.05,
                                       g.cx-g.rx*0.10, g.cy, g.rBig*1.2);
    fg.addColorStop(0,'#B5305F'); fg.addColorStop(0.55,'#8E1E44'); fg.addColorStop(1,'#6B1230');
    c2.fillStyle = fg; c2.fill(silPath(g, 0));
    c2.save(); c2.clip(silPath(g, 0));
    const coreX = g.cx - g.rx*0.46, coreY = g.cy - g.rBig*0.04;       // the core sits in the shoulder, not mid-body
    for(let r=5; r>=1; r--){
      const frac = r/5.3, seed = r*2.399963 + 2;
      const ring = new Path2D(); const N = 40;
      for(let k=0;k<=N;k++){
        const a = (k/N)*Math.PI*2;
        const w = 1 + 0.05*Math.sin(4*a+seed) + 0.03*Math.sin(7*a+seed*1.5);
        const x = coreX + Math.cos(a)*g.rBig*0.92*frac*w, y = coreY + Math.sin(a)*g.rBig*0.86*frac*w;
        k ? ring.lineTo(x,y) : ring.moveTo(x,y);
      }
      ring.closePath();
      c2.fillStyle = r%2 ? 'rgba(216,120,158,0.55)' : 'rgba(120,26,58,0.4)';
      c2.fill(ring);
    }
    for(let i=0;i<50;i++){ const a=i*2.399963, r=Math.sqrt((i*6151%73)/73);   // fine radiating fibre, restrained
      c2.strokeStyle = 'rgba(60,10,26,0.10)'; c2.lineWidth = 1;
      c2.beginPath(); c2.moveTo(coreX,coreY);
      c2.lineTo(coreX+Math.cos(a)*g.rBig*0.95*r, coreY+Math.sin(a)*g.rBig*0.88*r); c2.stroke(); }
    c2.restore();
    c2.strokeStyle = 'rgba(90,18,42,0.40)'; c2.lineWidth = 1.6; c2.stroke(silPath(g, 0));
  },
  /* SWEET POTATO, INTERIOR — the base sprite: bright yellow flesh, like the beet's rings, seen only through a
     cut face. The purple skin is an opaque permanent SKIN layer over it (SKIN_KEEP), because a whole purple
     sweet potato shows no flesh at all — painting a yellow window into the body made it read as a lemon wedge. */
  sweetpotato(c2, g){
    const fg = c2.createLinearGradient(g.cx, g.cy-g.rBig, g.cx, g.cy+g.rBig);
    fg.addColorStop(0,'#FDE870'); fg.addColorStop(0.5,'#F7D544'); fg.addColorStop(1,'#E4B826');
    c2.fillStyle = fg; c2.fill(silPath(g, 0));
    c2.save(); c2.clip(silPath(g, 0));
    for(let i=-1;i<=1;i++){                                            // sparse lengthwise fibre, subordinate
      const t = i/1.4;
      c2.strokeStyle = i === 0 ? 'rgba(198,150,20,0.20)' : 'rgba(255,246,190,0.20)'; c2.lineWidth = 1.6;
      c2.beginPath(); c2.moveTo(g.cx-g.rx*0.85, g.cy+t*g.rBig*0.5);

  /* POMEGRANATE, OPENED — the reference is a torn-open fruit: six lobed chambers of glossy arils packed

  pomegranate(c2, g){

  /* GREEN BEAN — plain taper order (skin, then flesh inset on top) since nothing on the skin needs to

        const sy = -bow*0.55*Math.cos((sx/rx)*1.2) + (k-0.5)*ry*0.16;

        sw.addColorStop(0,'rgba(214,236,158,0.34)'); sw.addColorStop(1,'rgba(214,236,158,0)');
        c2.fillStyle = sw;
        c2.beginPath(); c2.ellipse(sx, sy, ry*0.80, ry*0.62, 0, 0, Math.PI*2); c2.fill();
      }
      c2.lineCap = 'round';
      c2.strokeStyle = 'rgba(240,252,206,0.42)'; c2.lineWidth = ry*0.20;  // wet sheen along the lit edge
      c2.beginPath(); c2.moveTo(-rx*0.86, -ry*0.44 - bow*0.30);
      c2.quadraticCurveTo(0, -ry*0.52 - bow*0.80, rx*0.80, -ry*0.40); c2.stroke();
      c2.strokeStyle = 'rgba(28,48,16,0.26)'; c2.lineWidth = ry*0.15;     // shaded underside
      c2.beginPath(); c2.moveTo(-rx*0.84, ry*0.52 - bow*0.30);
      c2.quadraticCurveTo(0, ry*0.60 - bow*0.80, rx*0.80, ry*0.50); c2.stroke();
      c2.restore();
      c2.strokeStyle = 'rgba(30,54,18,0.44)'; c2.lineWidth = 1.4; c2.stroke(pod);
      c2.strokeStyle = 'rgba(150,124,58,0.85)'; c2.lineWidth = ry*0.22;   // dried stem nub at the butt end

      c2.quadraticCurveTo(-rx*1.05, -bow*0.10 - ry*0.30, -rx*1.10, -bow*0.10 - ry*0.75); c2.stroke();
      c2.restore();

  },
  /* GRAPES — no shared skin fill: each berry is its own small sphere (radial gradient, pale centre to deep
     rim) so a cut through any berry looks juicy without a second per-leaf geometry layer. Tones alternate
     purple/red per the brief's palette; the stem is cosmetic paint above the top two berries. */
  grapes(c2, g){
    const TONES = [ ['#E4EFA6','#B9D45E','#7C9C2E'], ['#DFEB9C','#B0CD54','#728F28'],
                    ['#EAF3B2','#C2DA6A','#87A736'], ['#D8E694','#A8C64C','#6A8623'] ];
    for(let i=0;i<g.leaves.length;i++){

      const bg = c2.createRadialGradient(bx-L.rx*0.32, by-L.ry*0.36, L.rx*0.1, bx, by, L.rx*1.05);
      bg.addColorStop(0, t[0]); bg.addColorStop(0.55, t[1]); bg.addColorStop(1, t[2]);
      c2.fillStyle = bg;
      c2.beginPath(); c2.ellipse(bx, by, L.rx, L.ry, 0, 0, Math.PI*2); c2.fill();
      const bloom = c2.createRadialGradient(bx-L.rx*0.3, by-L.ry*0.34, 1, bx-L.rx*0.3, by-L.ry*0.34, L.rx*0.5);
      bloom.addColorStop(0,'rgba(238,224,240,0.40)'); bloom.addColorStop(1,'rgba(238,224,240,0)');
      c2.fillStyle = bloom;
      c2.beginPath(); c2.ellipse(bx, by, L.rx, L.ry, 0, 0, Math.PI*2); c2.fill();
      c2.strokeStyle = 'rgba(40,14,50,0.30)'; c2.lineWidth = 1.3;
      c2.beginPath(); c2.ellipse(bx, by, L.rx, L.ry, 0, 0, Math.PI*2); c2.stroke();
    }
    const topX = g.cx + (g.leaves[0].dx+g.leaves[1].dx)/2, topY = g.cy + Math.min(g.leaves[0].dy, g.leaves[1].dy) - 8;
    c2.strokeStyle = '#6E5230'; c2.lineWidth = 5; c2.lineCap = 'round';
    c2.beginPath(); c2.moveTo(topX, topY+6); c2.quadraticCurveTo(topX-4, topY-18, topX+10, topY-30); c2.stroke();

  },
  /* COCONUT, PEELED — husk and shell are a SKIN layer now (see SKIN.coconut), so the base sprite is the
     de-husked nut of the reference: a smooth, near-white body, waxy rather than glossy, with one broad soft
     sheen and a cool shaded underside. No husk band, no black shell line, no cavity — a cut anywhere opens
     white meat, which is the whole read. */
  coconut(c2, g){
    const sil = silPath(g, 0);
    const meat = c2.createRadialGradient(g.cx-g.rx*0.30, g.cy-g.ry*0.36, g.rx*0.06,
                                         g.cx+g.rx*0.10, g.cy+g.ry*0.18, g.rx*1.24);
    meat.addColorStop(0,'#FFFFFF'); meat.addColorStop(0.40,'#FCFBF8'); meat.addColorStop(0.74,'#F1EFE9');
    meat.addColorStop(0.92,'#DEDBD1'); meat.addColorStop(1,'#C9C5B9');
    c2.fillStyle = meat; c2.fill(sil);
    c2.save(); c2.clip(sil);
    for(let i=0;i<120;i++){                                  // waxy mottle: barely there, kills the dead flat
      const a=i*2.399963, r=Math.sqrt((i*6151%89)/89);
      const x=g.cx+Math.cos(a)*g.rx*0.92*r, y=g.cy+Math.sin(a)*g.ry*0.92*r;
      c2.fillStyle = i%2 ? 'rgba(255,255,255,0.30)' : 'rgba(206,200,186,0.14)';
      c2.beginPath(); c2.ellipse(x, y, g.rx*0.055, g.ry*0.040, a, 0, Math.PI*2); c2.fill();
    }
    const sheen = c2.createRadialGradient(g.cx-g.rx*0.34, g.cy-g.ry*0.40, g.rx*0.04,
                                          g.cx-g.rx*0.20, g.cy-g.ry*0.24, g.rx*0.78);
    sheen.addColorStop(0,'rgba(255,255,255,0.85)'); sheen.addColorStop(0.55,'rgba(255,255,255,0.24)');
    sheen.addColorStop(1,'rgba(255,255,255,0)');
    c2.fillStyle = sheen; c2.fill(sil);
    const shade = c2.createLinearGradient(g.cx, g.cy+g.ry*0.20, g.cx+g.rx*0.35, g.cy+g.ry*1.05);
    shade.addColorStop(0,'rgba(176,172,158,0)'); shade.addColorStop(1,'rgba(150,146,132,0.34)');
    c2.fillStyle = shade; c2.fill(sil);

    c2.strokeStyle = 'rgba(158,152,138,0.40)'; c2.lineWidth = 1.6; c2.stroke(sil);
  },
  /* FENNEL, INTERIOR — the base sprite: layered white ribs, only ever seen on a cut face. The striped bulb and
     its stalks are a full-body SKIN layer over this (SKIN.fennel, kept permanently like mango's) — painting the
     stripes into the body put them under the flesh inset, where nothing could see them. */
  fennel(c2, g){
    const sil = silPath(g, 0);
    const fg = c2.createRadialGradient(g.cx-g.rx*0.12, g.cy-g.ry*0.14, g.rx*0.05, g.cx, g.cy, g.rx*1.0);
    fg.addColorStop(0,'#FFFFFB'); fg.addColorStop(0.52,'#F7F7ED'); fg.addColorStop(1,'#E0E2CE');
    c2.fillStyle = fg; c2.fill(sil);
    c2.save(); c2.clip(sil);
    const coreX = g.cx + g.rx*0.04, coreY = g.cy - g.ry*0.02;
    for(let r=7; r>=1; r--){                               // nested sheath sections of a cut bulb
      const frac = r/7.2, seed = r*2.399963 + 4;
      const ring = new Path2D(); const NN = 44;
      for(let k=0;k<=NN;k++){
        const a = (k/NN)*Math.PI*2;
        const w = 1 + 0.05*Math.sin(4*a+seed) + 0.03*Math.sin(7*a+seed*1.5);
        const x = coreX + Math.cos(a)*g.rx*0.92*frac*w, y = coreY + Math.sin(a)*g.ry*0.92*frac*w;
        k ? ring.lineTo(x,y) : ring.moveTo(x,y);
      }
      ring.closePath();
      c2.fillStyle = r%2 ? 'rgba(255,255,250,0.42)' : 'rgba(206,214,180,0.26)';
      c2.fill(ring);
      c2.strokeStyle = 'rgba(178,190,148,0.34)'; c2.lineWidth = 1.2; c2.stroke(ring);
    }
    const tint = c2.createRadialGradient(g.cx, g.cy, g.rx*0.55, g.cx, g.cy, g.rx*1.04);
    tint.addColorStop(0,'rgba(196,216,150,0)'); tint.addColorStop(1,'rgba(178,204,128,0.34)');
    c2.fillStyle = tint; c2.fill(sil);
    c2.restore();
    c2.strokeStyle = 'rgba(160,176,120,0.44)'; c2.lineWidth = 1.8; c2.stroke(sil);
  },
  /* ARTICHOKE — the photo's globe: BROAD overlapping bracts in staggered rows, each a wide rounded scale with
     a pale midrib and a small brown tip, the row below always in front of the row above. Rows fan out as they
     descend, so the silhouette is round and closes into a stubby cut stem. A pale heart sits behind the
     innermost rows; Halve cuts through the centre and opens it. */
  artichoke(c2, g){
    const ROWEND = [3,7,12,17,22,26,30];
    const rowOf = i => ROWEND.findIndex(e => i < e);
    c2.fillStyle = '#3C5A20';                              // seam filler only, small and dark: it must never
    c2.beginPath();                                        // show past the bracts as a green disc
    c2.ellipse(g.cx, g.cy+g.ry*0.02, g.rx*0.52, g.ry*0.56, 0, 0, Math.PI*2); c2.fill();
    const stemTop = g.cy + g.ry*0.78;
    const stem = new Path2D();
    stem.moveTo(g.cx-38, stemTop); stem.lineTo(g.cx-33, stemTop+44);
    stem.quadraticCurveTo(g.cx, stemTop+54, g.cx+33, stemTop+44);
    stem.lineTo(g.cx+38, stemTop); stem.closePath();
    const sg = c2.createLinearGradient(g.cx-38, 0, g.cx+38, 0);
    sg.addColorStop(0,'#5A7A32'); sg.addColorStop(0.34,'#8FAC5E');
    sg.addColorStop(0.72,'#7A9848'); sg.addColorStop(1,'#4E6C2A');
    c2.fillStyle = sg; c2.fill(stem);
    c2.strokeStyle = 'rgba(52,76,26,0.30)'; c2.lineWidth = 1.2; c2.stroke(stem);
    c2.strokeStyle = 'rgba(240,248,210,0.30)'; c2.lineWidth = 1.4;
    for(const k of [-0.6, 0, 0.6]){
      c2.beginPath(); c2.moveTo(g.cx+k*28, stemTop+4); c2.lineTo(g.cx+k*22, stemTop+44); c2.stroke();
    }
    const heart = new Path2D(); heart.ellipse(g.cx, g.cy-g.ry*0.10, 46, 50, 0, 0, Math.PI*2);
    const hg = c2.createRadialGradient(g.cx, g.cy-g.ry*0.10, 4, g.cx, g.cy-g.ry*0.10, 50);
    hg.addColorStop(0,'#F6F2CC'); hg.addColorStop(0.68,'#E4E0A4'); hg.addColorStop(1,'#CEC684');
    c2.fillStyle = hg; c2.fill(heart);
    /* Row tones: crown slightly greyer-green, outer rows lighter and yellower, as in the photo. */
    const TONES = [ ['#3F5F22','#5B8038','#74964F'], ['#426425','#5F853B','#789A53'],
                    ['#456828','#638A3F','#7C9E57'], ['#486C2B','#678F43','#80A25B'],
                    ['#4B702E','#6B9447','#84A65F'], ['#4E7431','#6F9A4B','#88AA63'],
                    ['#517833','#739F4F','#8CAE67'] ];
    for(let i=0;i<g.leaves.length;i++){
      const L = g.leaves[i], t = TONES[rowOf(i)], rx = L.rx, ry = L.ry;
      c2.save(); c2.translate(g.cx+L.dx, g.cy+L.dy); c2.rotate(L.rot||0);
      const br = new Path2D();                             // broad scale: wide base, blunt point at +x
      br.moveTo(-rx*0.92, -ry*0.94);
      br.bezierCurveTo(-rx*0.10, -ry*1.00, rx*0.66, -ry*0.56, rx*0.99, -ry*0.05);
      br.quadraticCurveTo(rx*1.05, 0, rx*0.99, ry*0.05);
      br.bezierCurveTo(rx*0.66, ry*0.56, -rx*0.10, ry*1.00, -rx*0.92, ry*0.94);
      br.quadraticCurveTo(-rx*1.10, 0, -rx*0.92, -ry*0.94);
      br.closePath();
      c2.fillStyle = 'rgba(44,68,22,0.20)';                // soft cast shadow onto the scale behind
      c2.save(); c2.translate(-4, 4); c2.fill(br); c2.restore();
      const bg = c2.createLinearGradient(-rx, 0, rx, 0);
      bg.addColorStop(0, t[0]); bg.addColorStop(0.48, t[1]); bg.addColorStop(1, t[2]);
      c2.fillStyle = bg; c2.fill(br);
      c2.save(); c2.clip(br);
      const seat = c2.createLinearGradient(-rx, 0, -rx*0.15, 0);
      seat.addColorStop(0,'rgba(40,62,20,0.30)'); seat.addColorStop(1,'rgba(40,62,20,0)');
      c2.fillStyle = seat; c2.fill(br);
      for(const s of [-1, 1]){                             // the scale's rolled side edges
        const eg = c2.createLinearGradient(0, s*ry, 0, s*ry*0.42);
        eg.addColorStop(0,'rgba(58,84,30,0.26)'); eg.addColorStop(1,'rgba(58,84,30,0)');
        c2.fillStyle = eg; c2.fill(br);
      }
      c2.strokeStyle = 'rgba(244,250,214,0.40)'; c2.lineWidth = 1.8;
      c2.beginPath(); c2.moveTo(-rx*0.78, 0); c2.quadraticCurveTo(rx*0.24, -ry*0.03, rx*0.90, 0); c2.stroke();
      const tip = c2.createRadialGradient(rx*0.96, 0, 1, rx*0.96, 0, rx*0.30);
      tip.addColorStop(0,'rgba(146,104,44,0.50)'); tip.addColorStop(1,'rgba(146,104,44,0)');
      c2.fillStyle = tip; c2.fill(br);
      c2.restore();
      c2.strokeStyle = 'rgba(52,78,28,0.26)'; c2.lineWidth = 1.2; c2.stroke(br);
      c2.restore();
    }
  },
  /* PEA POD, OPENED — the base sprite is the reference's split pod: a hollow inner wall, paler and cooler than
     the outside, with a row of plump round peas resting along it, each on its own little attachment stalk.
     The whole smooth pod is a permanent SKIN layer over this (SKIN.peapod), so peas appear only where a cut
     has opened the shell. */
  peapod(c2, g){
    const sil = silPath(g, 0);
    const wall = c2.createLinearGradient(g.cx, g.cy-g.rBig, g.cx, g.cy+g.rBig);
    wall.addColorStop(0,'#A8C96A'); wall.addColorStop(0.34,'#C4DE8C');
    wall.addColorStop(0.72,'#B7D67C'); wall.addColorStop(1,'#8FB755');
    c2.fillStyle = wall; c2.fill(sil);
    c2.save(); c2.clip(sil);
    const cav = c2.createLinearGradient(g.cx, g.cy-g.rBig*0.9, g.cx, g.cy+g.rBig*0.9);
    cav.addColorStop(0,'rgba(96,132,52,0.42)'); cav.addColorStop(0.30,'rgba(214,236,166,0.30)');
    cav.addColorStop(0.74,'rgba(198,226,146,0.24)'); cav.addColorStop(1,'rgba(88,124,46,0.40)');
    c2.fillStyle = cav; c2.fill(sil);
    for(let i=0;i<7;i++){                                   // the peas: plump, touching, slightly irregular
      const x = g.cx - g.rx*0.74 + i*(g.rx*1.48/6);
      const jit = ((i*7919)%13)/13 - 0.5, r = g.rBig*(0.72 + 0.07*(((i*6151)%11)/11));
      const py = g.cy + jit*g.rBig*0.10;
      c2.fillStyle = 'rgba(70,100,34,0.28)';                // seat shadow under each pea
      c2.beginPath(); c2.ellipse(x+2, py+r*0.34, r*0.94, r*0.52, 0, 0, Math.PI*2); c2.fill();
      const pg = c2.createRadialGradient(x-r*0.34, py-r*0.40, r*0.08, x+r*0.10, py+r*0.16, r*1.16);
      pg.addColorStop(0,'#E4F4B4'); pg.addColorStop(0.34,'#C6E483');
      pg.addColorStop(0.74,'#A6CC5C'); pg.addColorStop(1,'#7FA83C');
      c2.fillStyle = pg;
      c2.beginPath(); c2.ellipse(x, py, r, r*0.98, 0, 0, Math.PI*2); c2.fill();
      c2.strokeStyle = 'rgba(96,130,44,0.34)'; c2.lineWidth = 1;
      c2.beginPath(); c2.ellipse(x, py, r, r*0.98, 0, 0, Math.PI*2); c2.stroke();
      c2.fillStyle = 'rgba(255,255,232,0.55)';              // tiny specular
      c2.beginPath(); c2.ellipse(x-r*0.34, py-r*0.40, r*0.20, r*0.14, -0.5, 0, Math.PI*2); c2.fill();
      c2.strokeStyle = 'rgba(226,240,182,0.75)'; c2.lineWidth = 1.6;   // attachment stalk to the wall
      c2.beginPath(); c2.moveTo(x+r*0.5, py+r*0.72);
      c2.quadraticCurveTo(x+r*0.9, g.cy+g.rBig*0.74, x+r*1.15, g.cy+g.rBig*0.86); c2.stroke();
    }
    c2.strokeStyle = 'rgba(240,250,206,0.60)'; c2.lineWidth = 2.2;      // lit inner lip along the top edge
    c2.beginPath(); c2.moveTo(g.cx-g.rx*0.90, g.cy-g.rBig*0.72);
    c2.quadraticCurveTo(g.cx, g.cy-g.rBig*0.92, g.cx+g.rx*0.90, g.cy-g.rSmall*0.70); c2.stroke();
    c2.restore();
    c2.strokeStyle = 'rgba(62,96,30,0.46)'; c2.lineWidth = 1.6; c2.stroke(sil);
  },
  /* PUMPKIN — the reference photo's fruit, and the ONE layer it has: no flesh interior, no skin/flesh split, so
     every cut piece is the same ribbed outside and a cut never opens the fruit. Nine ribs, but
     placed by LONGITUDE (x = rx·sinφ) instead of evenly across the width, so they crowd toward the edges the way
     a sphere's meridians do; that foreshortening is what makes the body read as round rather than striped. Each
     rib is a FILLED region between two projected meridians with a dark→bright→dark cross gradient — swollen
     forms, not lines drawn on a ball — and the meridians ride the same scallop ripple as the silhouette. */
  pumpkin(c2, g){
    const sil = silPath(g, 0), N = g.lobes || 9, LAT = 26;
    const body = c2.createRadialGradient(g.cx-g.rx*0.34, g.cy-g.ry*0.54, g.rx*0.06,
                                         g.cx+g.rx*0.10, g.cy+g.ry*0.30, g.rx*1.24);
    body.addColorStop(0,'#FFC356'); body.addColorStop(0.28,'#FBA22B'); body.addColorStop(0.58,'#F3820F');
    body.addColorStop(0.84,'#E5750C'); body.addColorStop(1,'#C85E06');
    c2.fillStyle = body; c2.fill(sil);
    c2.save(); c2.clip(sil);
    const vf = u => { const uu = Math.max(-1, Math.min(1, u));
      return 1 + (g.scallop||0)*(1-0.62*uu*uu)*Math.cos(2*N*Math.asin(uu)); };
    const uAt = i => Math.sin(-Math.PI/2 + Math.PI*i/N);
    const mer = u => { const p = [];
      for(let k=0;k<=LAT;k++){ const lat = -Math.PI/2 + Math.PI*k/LAT, c = Math.cos(lat);
        p.push([g.cx + g.rx*u*c, g.cy + g.ry*Math.sin(lat)*vf(u*c)]); }
      return p; };
    const M = []; for(let i=0;i<=N;i++) M.push(mer(uAt(i)));
    for(let k=0;k<N;k++){
      const A = M[k], B = M[k+1], p = new Path2D();
      p.moveTo(A[0][0], A[0][1]);
      for(const q of A) p.lineTo(q[0], q[1]);
      for(let i=B.length-1;i>=0;i--) p.lineTo(B[i][0], B[i][1]);
      p.closePath();
      const xa = g.cx + g.rx*uAt(k), xb = g.cx + g.rx*uAt(k+1);
      const uc = (uAt(k)+uAt(k+1))/2, lit = Math.max(0, 1 - Math.abs(uc + 0.40)/1.12);
      const w = Math.max(7, xb - xa);
      const lg = c2.createLinearGradient(xa, 0, xa + w, 0);
      lg.addColorStop(0,   'rgba(152,62,4,0.34)');
      lg.addColorStop(0.16,'rgba(204,92,12,0.09)');
      lg.addColorStop(0.46,'rgba(255,'+Math.round(192+42*lit)+','+Math.round(106+62*lit)+','+(0.07+0.23*lit).toFixed(2)+')');
      lg.addColorStop(0.78,'rgba(204,92,12,0.08)');
      lg.addColorStop(1,   'rgba(152,62,4,0.36)');
      c2.fillStyle = lg; c2.fill(p);
      if(lit > 0.50){                                   // the photo's broad wet gloss: one patch per lit rib
        const gx = (xa+xb)/2, gy = g.cy - g.ry*0.32, rr = Math.max(13, w*0.60);
        const sp = c2.createRadialGradient(gx, gy, 1, gx, gy, rr);
        sp.addColorStop(0,'rgba(255,246,224,'+(0.34*lit).toFixed(2)+')');
        sp.addColorStop(1,'rgba(255,246,224,0)');
        c2.fillStyle = sp;
        c2.save(); c2.translate(gx, gy); c2.scale(1, 2.4); c2.translate(-gx, -gy);
        c2.beginPath(); c2.arc(gx, gy, rr, 0, Math.PI*2); c2.fill(); c2.restore();
      }
    }
    for(let i=1;i<N;i++){                               // seam: soft shadow, hard crease, then a lit ridge
      const A = M[i];
      const line = (off, col, wd) => { c2.strokeStyle = col; c2.lineWidth = wd; c2.beginPath();
        for(let k=0;k<A.length;k++){ const q = A[k]; k ? c2.lineTo(q[0]+off, q[1]) : c2.moveTo(q[0]+off, q[1]); }
        c2.stroke(); };
      line(0, 'rgba(150,60,4,0.12)', 13);
      line(0, 'rgba(138,54,4,0.32)', 2.8);
      if(uAt(i) < 0.36) line(-4.2, 'rgba(255,220,158,0.26)', 2.2);
    }
    const sheen = c2.createRadialGradient(g.cx-g.rx*0.32, g.cy-g.ry*0.46, 2,
                                          g.cx-g.rx*0.32, g.cy-g.ry*0.46, g.rx*0.72);
    sheen.addColorStop(0,'rgba(255,226,170,0.26)'); sheen.addColorStop(0.55,'rgba(255,226,170,0.10)');

        PAINT._taperStroke(c2, br, '253,238,228', 0.30 + 0.18*h(k+61,9), 0.9 + 1.2*h(k+67,7));

    for(let k=0;k<140;k++){                            // flecks: the fine grain of marbling, too small to be a line

      const near = Math.abs(v0 - seam(s0)) < 0.10;     // fat crowds around the seam
      const a = (near ? 0.34 : 0.22) + 0.18*h(k+79,11);
      c2.fillStyle = 'rgba(252,234,222,' + a.toFixed(3) + ')';
      const q = at(s0, v0), rr = 0.7 + 1.5*h(k+83,13);
      c2.save(); c2.translate(q[0], q[1]); c2.rotate(-0.5 + h(k+89,17));
      c2.beginPath(); c2.ellipse(0, 0, rr*(1.6 + 1.8*h(k+97,7)), rr*0.55, 0, 0, Math.PI*2); c2.fill();

       thread but nothing like the seam. They are what gives the web a hierarchy instead of one texture. */
    for(let k=0;k<9;k++){
      const s0 = 0.10 + 0.70*h(k+107,11);
      const v0 = 0.10 + (seam(s0)-0.18)*h(k+109,7);
      const dir = -0.30 + (-0.26 + 0.52*h(k+113,9));
      const pts = PAINT._thread(g, s0, v0, dir, 0.10 + 0.07*h(k+127,7), 0.14, 9);

       the first version read as a painted swoosh. Meat-toned lips on both sides seat it into the muscle. */
    const seamBand = PAINT._region(g, 0.06, 0.94,
      s => seam(s) - (0.024 + 0.014*Math.sin(11.0*s + 1.1) + 0.008*Math.sin(23.0*s)),
      s => seam(s) + (0.022 + 0.013*Math.sin(9.3*s + 2.4) + 0.008*Math.sin(19.0*s)), 72);

       steak in half and read as a painted smile. Fat seams begin and end inside the meat. */
    c2.save(); c2.clip(seamBand);
    const sg = c2.createLinearGradient(at(0.06,0.5)[0], 0, at(0.94,0.5)[0], 0);
    sg.addColorStop(0,'rgba(252,234,218,0)');    sg.addColorStop(0.22,'rgba(252,236,220,0.82)');
    sg.addColorStop(0.62,'rgba(250,232,214,0.74)'); sg.addColorStop(1,'rgba(246,226,208,0)');
    c2.fillStyle = sg; c2.fillRect(g.cx-g.rx-8, g.cy-g.ry-8, g.rx*2+16, g.ry*2+16);

      s => 0.96 - (0.038 + 0.022*Math.sin(7.7*s + 0.4) + 0.012*Math.sin(17.0*s + 1.9)),
      () => 1.0, 72);
    c2.save(); c2.clip(cap);
    const capG = c2.createLinearGradient(at(0.10,0.5)[0], 0, at(0.86,0.5)[0], 0);
    capG.addColorStop(0,'rgba(242,214,200,0)');     capG.addColorStop(0.20,'rgba(248,226,210,0.86)');
    capG.addColorStop(0.70,'rgba(240,214,198,0.80)'); capG.addColorStop(1,'rgba(236,208,192,0)');
    c2.fillStyle = capG; c2.fillRect(g.cx-g.rx-8, g.cy-g.ry-8, g.rx*2+16, g.ry*2+16);
    c2.restore();
    for(let k=0;k<14;k++){                             // ticks crossing the cap boundary, so it is not a hard line

      hg.addColorStop(0,'rgba(255,226,218,0.20)'); hg.addColorStop(0.55,'rgba(255,220,210,0.08)');

    c2.restore();

  /* SALMON FILLET — rebuilt against the reference after the first pass read as a striped balloon: twelve
     equal, equally-spaced, equally-bright bands edge to edge over one flat orange wash.
     Three things fix it, all of them true of the fish. (1) The MYOCOMMATA are not a comb: they crowd and
     steepen toward the tail, they vary in width and brightness, and many fade out before reaching the belly
     instead of crossing the whole body. (2) The flesh is not one colour: the loin is deeper, the belly paler
     and creamier, and there is fine mottle everywhere. (3) The bands are RIDGES — a shadow on one side and a
     lit crest on the other — which is what stops them reading as printed stripes. */
  salmon(c2, g){
    const sil = silPath(g, 0);
    const at = (s, v) => PAINT._railAt(g, s, v);
    const h = (i, m) => ((i*2654435761) % m)/m;
    const base = c2.createLinearGradient(g.cx-g.rx*0.55, g.cy-g.ry, g.cx+g.rx*0.72, g.cy+g.ry);
    base.addColorStop(0,'#FE8F66'); base.addColorStop(0.30,'#F8784C');
    base.addColorStop(0.66,'#EB653E'); base.addColorStop(1,'#D5522E');
    c2.fillStyle = base; c2.fill(sil);
    c2.save(); c2.clip(sil);
    /* FLESH ZONES — the loin (upper, deeper) and the belly (lower, paler and creamier). Regions off the rails,
       so the tonal break follows the body instead of sitting across it as a gradient. */
    const loin  = PAINT._region(g, 0.02, 0.99, () => 0.02, s => 0.46 + 0.10*Math.sin(2.2*s));
    const belly = PAINT._region(g, 0.02, 0.99, s => 0.62 + 0.08*Math.sin(1.9*s + 0.6), () => 0.98);
    c2.fillStyle = 'rgba(196,70,42,0.30)'; c2.fill(loin);
    c2.fillStyle = 'rgba(252,186,150,0.16)'; c2.fill(belly);

    const sh = at(0.26, 0.30), lo = at(0.72, 0.90);

    dome.addColorStop(0,'rgba(255,230,216,0.34)'); dome.addColorStop(0.52,'rgba(255,224,208,0.13)');
    dome.addColorStop(1,'rgba(255,224,208,0)');
    c2.fillStyle = dome; c2.fill(sil);
    const fall = c2.createRadialGradient(lo[0], lo[1], g.ry*0.12, lo[0], lo[1], g.ry*1.7);
    fall.addColorStop(0,'rgba(170,66,40,0.30)'); fall.addColorStop(0.60,'rgba(170,66,40,0.12)');
    fall.addColorStop(1,'rgba(170,66,40,0)');

       flat wash, which is most of why pass one looked inflatable. */

       core's envelope is what lets a band FADE OUT partway down the belly the way the reference's do. */

         A real fillet tightens toward the tail, it does not spiral. */

      const slide = 0.150 + 0.075*f;                                  // steepening with it, gently
      const bow = 0.022 + 0.018*h(k+23,7);
      const vEnd = 0.72 + 0.26*h(k+29,11);                            // some stop short of the belly edge
      const pts = (ds, dv) => { const o = [];
        for(let i=0;i<=20;i++){ const v = (i/20)*vEnd;
          o.push(at(s0 + ds + slide*(v/Math.max(vEnd,0.001))*vEnd + bow*Math.sin(Math.PI*(v/Math.max(vEnd,0.001))),

      PAINT._taperStroke(c2, pts(-0.009, -0.004), '255,250,245', 0.26, g.ry*0.018, env);
    }

       three soft slicks rather than one big one: an unbroken highlight is what makes CG food look waxy. */
    for(const [s, v, lx, ly, a, rot] of [[0.24, 0.24, 0.26, 0.13, 0.30, -0.20],
                                         [0.50, 0.38, 0.18, 0.08, 0.20, -0.16],
                                         [0.74, 0.52, 0.11, 0.06, 0.14, -0.12]]){
      const q = at(s, v);
      c2.save(); c2.translate(q[0], q[1]); c2.rotate(rot);
      const hg = c2.createRadialGradient(0, 0, 1, 0, 0, g.rx*lx);
      hg.addColorStop(0,'rgba(255,247,242,' + a + ')'); hg.addColorStop(0.55,'rgba(255,243,236,' + (a*0.40).toFixed(3) + ')');
      hg.addColorStop(1,'rgba(255,243,236,0)');
      c2.fillStyle = hg; c2.scale(1, (g.ry*ly)/(g.rx*lx));
      c2.beginPath(); c2.arc(0, 0, g.rx*lx, 0, Math.PI*2); c2.fill();
      c2.restore();
    }
    // PERIMETER — stronger than pass one, where a near-invisible rim let the fillet read as a flat sticker
    c2.strokeStyle = 'rgba(172,70,44,0.26)'; c2.lineWidth = g.ry*0.28; c2.stroke(sil);
    c2.strokeStyle = 'rgba(158,62,38,0.22)'; c2.lineWidth = g.ry*0.12; c2.stroke(sil);
    c2.restore();
    c2.strokeStyle = 'rgba(182,78,50,0.42)'; c2.lineWidth = 1.4; c2.stroke(sil);
  },
};
/* SKIN \u2014 the unpeeled shell of a peelable food, a FULL-BODY sprite drawn over the peeled base (see skinAlpha).\n   Wall-to-wall hexagonal scale plates, each with its own groove and bract chevron, plus the spiky crown past\n   the tip: before the shave there is no flesh visible anywhere, which is the whole point of a peel step. */
const SKIN = {
  /* TURNIP SKIN — the reference photo's whole root. The magenta cap is NOT a gradient stop: a single hard or
     soft stop both read as a printed band, while the photo's boundary wanders, mottles and dips lower on the
     right. So it is five nested wobbly regions filled with the same magenta at rising opacity — the stack
     ramps to near-solid at the crown and to nothing at the waist, and the wobble makes the edge organic. */
  turnip(c2, g){
    const sil = silPath(g, 0);
    const base = c2.createLinearGradient(g.cx, g.cy-g.ry, g.cx, g.cy+g.ry);
    base.addColorStop(0,'#F8F1E3'); base.addColorStop(0.52,'#F7ECDB');
    base.addColorStop(0.84,'#EFE0C6'); base.addColorStop(1,'#E2CFAE');
    c2.fillStyle = base; c2.fill(sil);
    c2.save(); c2.clip(sil);

      const p = new Path2D(), N = 48, X = g.rx + 10;
      p.moveTo(g.cx-X, g.cy-g.ry-10); p.lineTo(g.cx+X, g.cy-g.ry-10);
      for(let i=N;i>=0;i--){
        const u = -1 + 2*i/N;
        const yb = g.cy + g.ry*(k + 0.085*Math.sin(u*3.3+1.2) + 0.045*Math.sin(u*6.7+0.3) + 0.30*u);
        p.lineTo(g.cx + X*u, yb);

      const lg = c2.createLinearGradient(g.cx, g.cy-g.ry*1.02, g.cx, g.cy+g.ry*k);
      lg.addColorStop(0, 'rgba('+rgb+','+a0+')'); lg.addColorStop(0.55, 'rgba('+rgb+','+(a0*0.72).toFixed(2)+')');
      lg.addColorStop(1, 'rgba('+rgb+',0)');

    wash(0.14, '186,50,142', 0.54);
    wash(-0.08, '176,42,134', 0.46);
    wash(-0.44, '150,34,120', 0.32);
    c2.lineWidth = 1.4;                                    // fine vertical striations, both zones
    for(let i=0;i<46;i++){
      const u = -0.94 + 1.88*((i*7919)%97)/97, x = g.cx + g.rx*u;
      const hh = ((i*6151)%89)/89;

    }

    sheen.addColorStop(0,'rgba(255,244,252,0.34)'); sheen.addColorStop(0.5,'rgba(255,244,252,0.12)');
    sheen.addColorStop(1,'rgba(255,244,252,0)');
    c2.fillStyle = sheen; c2.fill(sil);
    const gl = c2.createLinearGradient(g.cx+g.rx*0.30, g.cy-g.ry*0.52, g.cx+g.rx*0.66, g.cy+g.ry*0.10);
    gl.addColorStop(0,'rgba(255,246,252,0)'); gl.addColorStop(0.5,'rgba(255,246,252,0.26)');
    gl.addColorStop(1,'rgba(255,246,252,0)');
    c2.fillStyle = gl; c2.fill(sil);
    const shade = c2.createLinearGradient(g.cx-g.rx*0.4, g.cy+g.ry*0.34, g.cx-g.rx*0.1, g.cy+g.ry*1.02);
    shade.addColorStop(0,'rgba(122,96,58,0)'); shade.addColorStop(1,'rgba(122,96,58,0.30)');

    const rP = [[g.cx-6, g.cy+g.ry*0.96], [g.cx-12, g.cy+g.ry*1.12],

      const y = u*u*u*rP[0][1] + 3*u*u*t*rP[1][1] + 3*u*t*t*rP[2][1] + t*t*t*rP[3][1];

    rg2.addColorStop(0,'#DCCDA8'); rg2.addColorStop(0.55,'#EFE3C8'); rg2.addColorStop(1,'#F7EEDA');

    c2.strokeStyle = 'rgba(168,142,100,0.42)'; c2.lineWidth = 1; c2.stroke(rt);
    c2.lineCap = 'round';
    c2.strokeStyle = 'rgba(182,158,116,0.55)'; c2.lineWidth = 0.9;   // root hairs
    for(const [k, a] of [[9,2.2],[13,2.7],[16,1.8]]){

    }
    const leaf = (x, y, ang, len, wid) => {
      const N = 30, pts = [];

      for(let i=N;i>=0;i--){ const t=i/N;
        pts.push([t*len,  prof(t)*wid*(1 + 0.15*Math.sin(t*Math.PI*5.5+2.3) + 0.07*Math.sin(t*Math.PI*9+0.4))]); }
      c2.save(); c2.translate(x, y); c2.rotate(ang);
      const p = new Path2D();
      pts.forEach((q,i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]));
      p.closePath();

      lg.addColorStop(0,'#BEDA7C'); lg.addColorStop(0.55,'#96C356'); lg.addColorStop(1,'#7CAC40');
      c2.fillStyle = lg; c2.fill(p);
      c2.strokeStyle = 'rgba(78,114,36,0.40)'; c2.lineWidth = 1.1; c2.stroke(p);
      c2.save(); c2.clip(p);
      c2.strokeStyle = 'rgba(238,248,206,0.55)'; c2.lineWidth = 1.8;
      c2.beginPath(); c2.moveTo(0,0); c2.lineTo(len,0); c2.stroke();
      c2.strokeStyle = 'rgba(112,150,58,0.38)'; c2.lineWidth = 1;
      for(let k=1;k<=5;k++){ const t=k/6, pw=prof(t)*wid*0.9;

    const stalk = (qx, qy, ex, ey, w) => {
      for(const [lw, col] of [[w+2.2,'rgba(96,126,44,0.45)'], [w,null]]){
        if(col) c2.strokeStyle = col;
        else { const sg = c2.createLinearGradient(bx, by, ex, ey);
          sg.addColorStop(0,'#DCE7AE'); sg.addColorStop(0.5,'#BAD37E'); sg.addColorStop(1,'#9CC160');
          c2.strokeStyle = sg; }

  /* COCONUT SKIN — the whole nut before de-husking: a mat of coir FIBRE, not a smooth brown shell. Hairs
     sweep around the body (following the contour near the rim, roughly level across the middle) in two tones
     so the surface reads hairy at any zoom, and three near-black eyes sit low and off-centre, as in the
     reference. Rubbed off in the peel step, revealing the white meat underneath. */
  coconut(c2, g){
    const sil = silPath(g, 0);
    const base = c2.createRadialGradient(g.cx-g.rx*0.30, g.cy-g.ry*0.38, g.rx*0.10,
                                         g.cx+g.rx*0.08, g.cy+g.ry*0.14, g.rx*1.26);
    base.addColorStop(0,'#C99659'); base.addColorStop(0.34,'#B37D43'); base.addColorStop(0.70,'#94612F');
    base.addColorStop(0.90,'#74461F'); base.addColorStop(1,'#552F11');
    c2.fillStyle = base; c2.fill(sil);
    c2.save(); c2.clip(sil);
    c2.lineCap = 'round';
    for(let i=0;i<1500;i++){
      const h1=((i*7919)%997)/997, h2=((i*6151)%991)/991, h3=((i*104729)%983)/983, h4=((i*911)%977)/977;

      c2.lineWidth = 0.7 + 1.1*h3;
      c2.beginPath(); c2.moveTo(x, y);
      c2.quadraticCurveTo((x+ex)/2 + Math.cos(ang+1.57)*bow, (y+ey)/2 + Math.sin(ang+1.57)*bow, ex, ey);

      eg.addColorStop(1,'rgba(60,36,16,0)');

                                        g.cx-g.rx*0.18, g.cy-g.ry*0.22, g.rx*0.82);

    c2.fillStyle = lit; c2.fill(sil);

    vig.addColorStop(0,'rgba(50,28,10,0)'); vig.addColorStop(1,'rgba(44,24,8,0.46)');

    const base = c2.createRadialGradient(g.cx, g.cy+g.ry*0.86, g.rx*0.06, g.cx, g.cy+g.ry*0.9, g.rx*0.7);

    const stalks = [[-0.46,-0.52,168],[-0.16,-0.24,206],[0.14,0.10,196],[0.42,0.46,160]];

          c2.fillStyle = gr; c2.fill(bl);
          c2.strokeStyle = 'rgba(18,42,12,0.34)'; c2.lineWidth = 1; c2.stroke(bl);
          c2.strokeStyle = 'rgba(216,242,172,0.28)'; c2.lineWidth = 1.2;   // the blade's lit spine
          c2.beginPath(); c2.moveTo(L*0.08, 0); c2.lineTo(L*0.90, 0); c2.stroke();
          c2.restore();
        }
      }
    }
    const rind = c2.createLinearGradient(g.cx, g.cy-g.ry, g.cx, g.cy+g.ry);
    rind.addColorStop(0,'#EDB349'); rind.addColorStop(0.44,'#D08B27'); rind.addColorStop(1,'#8E5A16');
    c2.fillStyle = rind; c2.fill(silPath(g, 0));
    c2.save(); c2.clip(silPath(g, 0));
    const COLS = 11, ROWS = 6, hw = (g.rx*2/COLS)*0.62, hh = (g.ry*2/ROWS)*0.64;
    for(let r=-1;r<=ROWS;r++){                                      // one row of bleed each way: no bald margin
      const y = g.cy-g.ry + ((r+0.5)/ROWS)*g.ry*2;
      for(let cIdx=-1;cIdx<=COLS;cIdx++){
        const x = g.cx-g.rx + ((cIdx+0.5+(r%2?0.5:0))/COLS)*g.rx*2;
        const seed = ((r+2)*131+(cIdx+2)*7919) % 97, j = 0.94 + 0.14*((seed%9)/9);
        const cell = new Path2D();                                 // a scale PLATE: hexagon, not a wire diamond
        for(let k=0;k<6;k++){
          const a = -Math.PI/2 + k*Math.PI/3;
          const px = x + Math.cos(a)*hw*j, py = y + Math.sin(a)*hh*j;
          k ? cell.lineTo(px, py) : cell.moveTo(px, py);
        }
        cell.closePath();
        const cg2 = c2.createRadialGradient(x-hw*0.26, y-hh*0.30, 1, x, y, hw*1.20);
        cg2.addColorStop(0, seed%3 ? 'rgba(252,206,116,0.50)' : 'rgba(246,188,94,0.46)');
        cg2.addColorStop(0.58,'rgba(206,134,40,0.26)'); cg2.addColorStop(1,'rgba(112,66,12,0.44)');
        c2.fillStyle = cg2; c2.fill(cell);
        c2.strokeStyle = 'rgba(96,58,10,0.60)'; c2.lineWidth = 1.7; c2.stroke(cell);
        c2.strokeStyle = 'rgba(90,54,10,0.42)'; c2.lineWidth = 1.3;                     // the bract: a small chevron
        c2.beginPath();
        c2.moveTo(x-hw*0.30, y+hh*0.16); c2.lineTo(x, y-hh*0.20); c2.lineTo(x+hw*0.30, y+hh*0.16); c2.stroke();
        c2.fillStyle = 'rgba(255,232,168,0.34)';
        c2.beginPath(); c2.arc(x, y-hh*0.06, 1.5, 0, Math.PI*2); c2.fill();
      }
    }
    const shade = c2.createRadialGradient(g.cx-g.rx*0.28, g.cy-g.ry*0.34, g.ry*0.2, g.cx, g.cy, g.rx*1.06);
    shade.addColorStop(0,'rgba(255,226,150,0.20)'); shade.addColorStop(0.62,'rgba(255,220,140,0)');
    shade.addColorStop(1,'rgba(92,54,10,0.30)');                   // the body reads round, not a flat tiled panel
    c2.fillStyle = shade; c2.fill(silPath(g, 0));
    c2.restore();
    c2.strokeStyle = 'rgba(112,70,14,0.46)'; c2.lineWidth = 2; c2.stroke(silPath(g, 0));
  },
};
function drawParticles(gnow){
  for(const p of pool){
    if(!p.on) continue;
    const el = gnow - p.born;
    if(el > p.life){ p.on = false; continue; }
    const k = el/p.life, dt = el/1000, pr = p.pr || ING.particles;
    const x = p.x + p.vx*dt;
    let y = p.y + p.vy*dt + 0.5*pr.gravity*dt*dt;
    // hard fragments hop when they meet the board; juice and wet flecks stay where they land
    if(pr.bounce && p.floor != null && y > p.floor) y = p.floor - (y-p.floor)*pr.bounce*Math.abs(Math.sin(el*0.02));
    ctx.save();
    ctx.globalAlpha = (1-k)*(p.type==='frag' ? 0.95 : 0.8*pr.wet);
    if(p.type==='frag'){
      ctx.fillStyle = pr.fragColor;
      ctx.beginPath(); ctx.ellipse(x, y, p.r, p.r*0.72, p.vx*0.01, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = pr.fragEdge; ctx.lineWidth = 0.6; ctx.stroke();
    } else {
      ctx.fillStyle = pr.wetColor;
      ctx.beginPath(); ctx.arc(x, y, p.r*(1-k*0.4), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}
function drawSparks(now){
  sparks = sparks.filter(s => now - s.born < s.life);
  for(const s of sparks){
    const el = now - s.born, k = el/s.life, dt = el/1000;
    const x = s.x + s.vx*dt, y = s.y + s.vy*dt + 100*dt*dt;
    ctx.save();
    ctx.globalAlpha = 1-k;
    ctx.strokeStyle = '#FFE9B0'; ctx.lineWidth = 1.6; ctx.lineCap='round';
    ctx.shadowColor = C.golden; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s.vx*0.04, y - s.vy*0.04); ctx.stroke();
    ctx.restore();
  }
}
/* ---------- the knife ---------- */
function drawKnifeBody(glintPhase, shineBoost){
  const K = CONFIG.knife, L = K.BLADE_LEN, H = K.BLADE_H;
  // blade: heel at HEEL_AT·L, tip at 0.68L, edge at +y
  const heel = K.HEEL_AT*L, tip = 0.68*L;
  ctx.beginPath();
  ctx.moveTo(heel, -H*0.5);
  ctx.lineTo(0.40*L, -H*0.5);
  ctx.quadraticCurveTo(0.58*L, -H*0.40, tip, H*0.30);
  ctx.quadraticCurveTo(0.28*L, H*0.58, heel, H*0.5);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, -H*0.5, 0, H*0.5);
  bg.addColorStop(0, '#9AA1AA'); bg.addColorStop(0.55, '#C9CFD6'); bg.addColorStop(1, '#EDF1F5');
  ctx.fillStyle = bg; ctx.fill();
  ctx.save(); ctx.clip();
  // moving specular glint along the blade
  const gx = heel + ((glintPhase % 1 + 1) % 1) * (tip - heel);
  const gg = ctx.createLinearGradient(gx-26, 0, gx+26, 0);
  gg.addColorStop(0, 'rgba(255,255,255,0)');
  gg.addColorStop(0.5, `rgba(255,255,255,${0.28 + shineBoost*0.5})`);
  gg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gg; ctx.fillRect(heel, -H, tip-heel, H*2);
  ctx.restore();
  // edge highlight along the cutting edge
  ctx.beginPath();
  ctx.moveTo(heel, H*0.46);
  ctx.quadraticCurveTo(0.28*L, H*0.54, tip-2, H*0.28);
  ctx.strokeStyle = `rgba(250,252,254,${0.85 + shineBoost*0.15})`; ctx.lineWidth = 1.6; ctx.lineCap='round'; ctx.stroke();
  // bolster + walnut handle
  const hb = ctx.createLinearGradient(0, -H*0.45, 0, H*0.45);
  hb.addColorStop(0, '#8A5A3C'); hb.addColorStop(1, '#6E4730');
  ctx.fillStyle = '#B9BFC7';
  ctx.fillRect(heel-7, -H*0.5, 7, H);
  ctx.fillStyle = hb;
  rr(heel - 7 - CONFIG.knife.HANDLE_LEN, -H*0.45, CONFIG.knife.HANDLE_LEN, H*0.9, H*0.42);
  ctx.fill();
  ctx.fillStyle = '#D8CCB8';
  for(const rx of [0.3, 0.7]){
    ctx.beginPath(); ctx.arc(heel - 7 - CONFIG.knife.HANDLE_LEN*rx, 0, 1.8, 0, Math.PI*2); ctx.fill();
  }
}
function drawKnife(now, gnow){
  if(!knife) return;
  const K = CONFIG.knife;
  let alpha = 1, ox = 0, oy = 0;
  if(knife.mode === 'swipe'){
    knife.rot += (knife.targetRot - knife.rot) * K.KNIFE_ROT_LERP;
    if(knife.phase === 'enter'){
      const k = clamp01((now - knife.enterT)/K.KNIFE_ENTER_MS);
      alpha = k;
      if(k >= 1) knife.phase = 'active';
    } else if(knife.phase === 'exit'){
      const k = clamp01((now - knife.exitT)/K.KNIFE_EXIT_MS);
      alpha = 1 - easeOut(k);
      oy = -K.KNIFE_LIFT_PX * easeOut(k); // lift-off (rotation levels via targetRot = 0)
      if(k >= 1){ knife = null; return; }
    }
    const f = clamp01((velEMA - K.KNIFE_BLUR_MIN)/(K.KNIFE_BLUR_MAX - K.KNIFE_BLUR_MIN));
    // motion blur: trailing ghosts at decreasing alpha
    if(f > 0.02 && knife.phase !== 'exit'){
      for(const [ago, ga] of [[33, 0.16], [66, 0.08]]){
        const tr = knife.trail.find(q => now - q.t >= ago);
        if(tr){
          ctx.save(); ctx.globalAlpha = alpha * ga * f;
          ctx.translate(tr.x, tr.y); ctx.rotate(tr.rot); ctx.scale(knife.dirSign*K.KNIFE_SCALE, K.KNIFE_SCALE);
          ctx.translate(0, -K.BLADE_H*0.5);
          drawKnifeBody(0.5, 0); ctx.restore();
        }
      }
    }
    const shine = clamp01(1 - (now - knife.shineT)/300);
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.translate(knife.x, knife.y + oy); ctx.rotate(knife.rot); ctx.scale(knife.dirSign*K.KNIFE_SCALE, K.KNIFE_SCALE);
    ctx.translate(0, -K.BLADE_H*0.5); // the cutting EDGE rides the seam, not the blade's centre
    drawKnifeBody(now/1000*K.KNIFE_GLINT_SPEED, shine);
    ctx.restore();
  } else { // tap: one short downward chop, then fade
    const el = now - knife.chopT;
    const chopK = clamp01(el/K.TAP_CHOP_MS);
    oy = -16 * (1 - easeOut(chopK));
    alpha = Math.min(1, el/40);
    if(el > K.TAP_CHOP_MS + 60){
      const k = clamp01((el - K.TAP_CHOP_MS - 60)/K.KNIFE_EXIT_MS);
      alpha = 1 - easeOut(k);
      oy -= K.KNIFE_LIFT_PX * easeOut(k); // lift-off
      if(k >= 1){ knife = null; return; }
    }
    const shine = clamp01(1 - (now - knife.shineT)/300);
    ctx.save(); ctx.globalAlpha = alpha;
    // heel anchored at the tap point: the blade lands where the finger did, then extends forward
    ctx.translate(knife.x - K.HEEL_AT*K.BLADE_LEN*K.KNIFE_SCALE, knife.y + oy); ctx.scale(K.KNIFE_SCALE, K.KNIFE_SCALE);
    ctx.translate(0, -K.BLADE_H*0.5); // edge on the cut line, same rule as the swipe
    drawKnifeBody(now/1000*K.KNIFE_GLINT_SPEED, shine);
    ctx.restore();
  }
}
let preScore = null; // live score under the blade: the food opens DURING the stroke, separation resolves at release
function computePreScore(){
  preScore = null;
  const I = CONFIG.input;
  if(!I.PRESCORE_ENABLED || !stroke || !canCut()) return;
  if(stroke.maxMove <= I.TAP_MAX_MOVE_PX || stroke.pts.length < 2) return;
  const f = fitStroke(stroke.pts);
  if(!f) return;
  const r = resolvePlacement(f.axis, f.c, f.slope); // same resolver as placement — the score is truthful
  const sp = seamSpan({ axis: f.axis, c: r.c, slope: r.slope });
  const par = q => f.axis==='h' ? (q.x - sp.x0)/((sp.x1-sp.x0) || 1) : (q.y - sp.y0)/((sp.y1-sp.y0) || 1); // RAW: lead is added before clamping, so an off-food blade cannot score
  let a = par(stroke.pts[0]), b = par(stroke.pts[stroke.pts.length-1]);
  const lead = CONFIG.input.PRESCORE_LEAD_FRAC * CONFIG.knife.BLADE_LEN * CONFIG.knife.KNIFE_SCALE / (sp.len || 1);
  b = b >= a ? b + lead : b - lead; // the cut resolves under the leading edge, ahead of the finger
  a = clamp01(a); b = clamp01(b);
  if(a > b){ const t = a; a = b; b = t; }
  if(b - a < 0.01) return;
  preScore = { axis: f.axis, sp, a, b };
}
function strokePreScore(){ // drawn inside each piece's clip, so it only ever paints on food
  if(!preScore) return;
  const R = seamTint(activeSrc), sp = preScore.sp;
  ctx.save(); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sp.x0 + (sp.x1-sp.x0)*preScore.a, sp.y0 + (sp.y1-sp.y0)*preScore.a);
  ctx.lineTo(sp.x0 + (sp.x1-sp.x0)*preScore.b, sp.y0 + (sp.y1-sp.y0)*preScore.b);
  ctx.strokeStyle = R.preScoreDark; ctx.lineWidth = 3.0; ctx.stroke();
  ctx.strokeStyle = R.preScoreFlesh; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();
}
function drawGhost(){ // truthful preview: shows the NUDGED landing, via the same resolver as placement
  if(!CONFIG.input.GHOST_LINE_ENABLED || !stroke || !stroke.pts.length) return;
  if(stroke.maxMove > CONFIG.input.TAP_MAX_MOVE_PX) return; // once swiping, the knife takes over
  if(!canCut()) return; // nothing more can be placed, so nothing to preview
  const p = stroke.pts[stroke.pts.length-1];
  if(!insideSil(p.x, p.y)) return;
  const axis0 = liveAxis(CONFIG.recipe.CUT_AXIS);
  const gd = dirSnap(axis0, 0);
  const axis = gd ? gd.axis : axis0, gslope = gd ? gd.slope : 0;
  const r = resolvePlacement(axis, gd ? interceptThrough(axis, gslope, p.x, p.y) : (axis==='h' ? p.y : p.x), gslope);
  ctx.save();
  ctx.strokeStyle = CONFIG.render.ghostColor; ctx.lineWidth = 1;
  ctx.beginPath();
  if(r.slope){ const sp = seamSpan({ axis, c: r.c, slope: r.slope }); ctx.moveTo(sp.x0, sp.y0); ctx.lineTo(sp.x1, sp.y1); }
  else {
    const gsp = spanAcross(axis, r.c), gh = (gsp.half || 30) + 8;
    if(axis==='h'){ ctx.moveTo(gsp.mid - gh, r.c); ctx.lineTo(gsp.mid + gh, r.c); }
    else { ctx.moveTo(r.c, gsp.mid - gh); ctx.lineTo(r.c, gsp.mid + gh); }
  }
  ctx.stroke(); ctx.restore();
}
function drawPips(gnow){
  pips = pips.filter(p => gnow - p.t0 < CONFIG.pip.ms);
  for(const p of pips){
    const k = (gnow - p.t0)/CONFIG.pip.ms;
    ctx.save();
    ctx.globalAlpha = (k < 0.15 ? k/0.15 : 1 - easeOut((k-0.15)/0.85)) * 0.9;
    ctx.fillStyle = C.cream;
    ctx.shadowColor = 'rgba(50,28,14,0.4)'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y - CONFIG.pip.rise * easeOut(k), CONFIG.pip.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawReplay(gnow){
  if(!replay) return;
  const R = CONFIG.replay, axis = (gradeInfo && gradeInfo.axis) || CONFIG.recipe.CUT_AXIS;
  const el = gnow - replay.t0;
  if(el < 0) return;
  let a = 1;
  if(el > R.holdMs){
    a = 1 - clamp01((el - R.holdMs)/R.fadeMs);
    if(a <= 0){ replay = null; return; }
  }
  ctx.save();
  ctx.globalAlpha = R.dim * a;
  ctx.fillStyle = C.cream;
  const B = CONFIG.board; boardFacePath(ctx, 0); ctx.fill();
  ctx.restore();
  if(replay.map){ // the pieces are plated: give the lines their context back
    ctx.save(); ctx.globalAlpha = 0.55*a;
    ctx.beginPath(); ctx.ellipse(T.cx, T.cy, T.rx, T.ry, 0, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(217,75,69,0.55)'; ctx.lineWidth = 2; ctx.setLineDash([7,6]); ctx.stroke();
    ctx.restore();
  }
  // the ideal division follows the set the player actually worked — horizontal guides over diagonal cuts teach nothing
  const gs = parallelGroups();
  const ref = gs.length ? gs.reduce((b,g) => g.cuts.length > b.cuts.length ? g : b).cuts[0] : { axis, slope: 0 };
  for(const pos of idealIntercepts(ref.axis, ref.slope)){
    ctx.save(); ctx.globalAlpha = 0.9*a;
    ctx.shadowColor = R.idealColor; ctx.shadowBlur = 12;
    ctx.strokeStyle = R.idealColor; ctx.lineWidth = 2.5; ctx.lineCap='round';
    const sp = seamSpan({ axis: ref.axis, c: pos, slope: ref.slope });
    const ex = R.overhang / (sp.len || 1);
    ctx.beginPath();
    ctx.moveTo(sp.x0 - (sp.x1-sp.x0)*ex, sp.y0 - (sp.y1-sp.y0)*ex);
    ctx.lineTo(sp.x1 + (sp.x1-sp.x0)*ex, sp.y1 + (sp.y1-sp.y0)*ex);
    ctx.stroke(); ctx.restore();
  }
  for(const c of cuts){
    ctx.save(); ctx.globalAlpha = 0.95*a;
    ctx.shadowColor = R.cutColor; ctx.shadowBlur = R.glow;
    ctx.strokeStyle = R.cutColor; ctx.lineWidth = R.width; ctx.lineCap='round';
    ctx.beginPath();
    const rsp = spanAcross(c.axis, c.c), rh = rsp.half + R.overhang;
    if(c.axis==='h'){ ctx.moveTo(rsp.mid-rh, c.c - c.slope*rh); ctx.lineTo(rsp.mid+rh, c.c + c.slope*rh); }
    else { ctx.moveTo(c.c - c.slope*rh, rsp.mid-rh); ctx.lineTo(c.c + c.slope*rh, rsp.mid+rh); }
    ctx.stroke(); ctx.restore();
  }
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---------- pantry: every ingredient, one tap away ----------
   Built from CONFIG.recipes.RECIPES rather than a hand-written list, so a new ingredient shows up here the
   moment it has a recipe — no second roster to keep in sync. Thumbnails call the ingredient's own PAINT
   through the same silPath/innerGeom the sprite cache uses, so what you see IS the food. */
function pantryModel(){
  const groups = new Map(), special = [];
  CONFIG.recipes.RECIPES.forEach((r, i) => {
    const st = r.stages;
    const single = st.length === 1 && st[0].ing && CONFIG.INGREDIENTS[st[0].ing];
    if(!single){
      const ings = st[0].rotate ? st[0].rotate.slice() : st.map(s => s.ing).filter(Boolean);
      special.push({ i, r, ings, sub: st[0].rotate ? st[0].rotate.length + ' ingredients' : st.length + ' stages' });
      return;
    }
    const k = st[0].ing;
    if(!groups.has(k)) groups.set(k, { ing: k, name: CONFIG.INGREDIENTS[k].name || k, items: [] });
    groups.get(k).items.push({ i, r });
  });
  return { groups: [...groups.values()], special };
}
function pantryThumb(cv, ings){
  const dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth || 112, h = 52;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  const list = ings.filter(id => CONFIG.INGREDIENTS[id] && PAINT[id]).slice(0, 3);
  list.forEach((id, k) => {
    const g = CONFIG.INGREDIENTS[id].geom, cw = w/list.length;
    /* Fit against the PAINTED extent, not the silhouette: an ingredient with an overhang (celery's leaf crown)
       is wider than its rx/ry, and fitting on those cropped the crown flat against the tile edge — the one thing
       this line promises not to do. The box stays centred on cx,cy, so the cost is a little air on the far side. */
    const oh = g.overhang || { x:0, y:0 };
    const s = Math.min(cw/((g.rx+oh.x)*2.3), h/((g.ry+oh.y)*2.3));   // fit, with a little air — never crop
    c.save();
    c.translate(cw*(k+0.5), h/2); c.scale(s, s); c.translate(-g.cx, -g.cy);
    PAINT[id](c, g);
    c.restore();
  });
}
function buildPantry(){
  const body = $('pantryBody'), M = pantryModel();
  body.textContent = '';
  const card = (label, sub, ings, items) => {
    const el = document.createElement('div');
    el.className = 'pItem';
    el.dataset.idx = items[0].i;
    const cv = document.createElement('canvas'); cv.className = 'pThumb';
    const nm = document.createElement('div'); nm.className = 'pName'; nm.textContent = label;
    const tc = document.createElement('div'); tc.className = 'pTechs';
    if(items.length > 1 || !sub){
      items.forEach(({ i, r }) => {
        const b = document.createElement('button');
        b.className = 'pTech'; b.dataset.idx = i; b.textContent = r.technique;
        tc.appendChild(b);
      });
    } else {
      const s = document.createElement('span');
      s.className = 'pTech'; s.style.cursor = 'default'; s.textContent = sub;
      tc.appendChild(s);
    }
    el.append(cv, nm, tc);
    return { el, cv, ings };
  };
  const section = (title, cards) => {
    const h = document.createElement('div'); h.className = 'pGroup'; h.textContent = title;
    const grid = document.createElement('div'); grid.className = 'pGrid';
    cards.forEach(c => grid.appendChild(c.el));
    body.append(h, grid);
  };
  const made = [];
  const ingCards = M.groups.map(g => { const c = card(g.name, null, [g.ing], g.items); made.push(c); return c; });
  section('INGREDIENTS \u00b7 ' + ingCards.length, ingCards);
  if(M.special.length){
    const sp = M.special.map(s => { const c = card(s.r.name, s.sub, s.ings, [s]); made.push(c); return c; });
    section('PREPS', sp);
  }
  $('pantryCount').textContent = CONFIG.recipes.RECIPES.length + ' recipes';
  requestAnimationFrame(() => made.forEach(c => pantryThumb(c.cv, c.ings)));  // after layout: clientWidth is real
}
function markPantry(){

  document.querySelectorAll('#pantryBody .pItem').forEach(el => {
    const own = [...el.querySelectorAll('.pTech[data-idx]')].map(b => +b.dataset.idx);
    const mine = own.length ? own : [+el.dataset.idx];

}
function openPantry(){
