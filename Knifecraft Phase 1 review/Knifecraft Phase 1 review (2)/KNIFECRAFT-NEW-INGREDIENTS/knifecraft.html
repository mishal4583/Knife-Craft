/* ---------- reset + test hook ---------- */
document.getElementById('reset').addEventListener('click', () => { Audio.ensure(); hideResult(); leaveBoard(); startRecipe(recipeIndex); });
function testReset(){ // deterministic reset for scripted runs: cutting live, no entry animation, no ghost hand
  hideResult(); harvest = []; stageGrades = []; handoff = null; farewell = null; resetBoard();
  ingress = null; ghostHand = null; firstCutDone = true; phase = 'cutting';
}
/* ---------- permanent regression suite ----------
   ONE call ends every phase: __kcTest.regress(). It snapshots the recipe config and the
   player's save and restores both, so measuring never costs progress. */
const _wait = ms => new Promise(r => setTimeout(r, ms));
async function regressSuite(){
  const K = window.__kcTest, rep = { fail: [] };
  const fail = n => rep.fail.push(n);
  const waitPhase = async (p, ms) => { const t0 = performance.now();
    while(performance.now() - t0 < (ms||4000)){ if(phase === p) return true; await _wait(20); }
    return false; };
  const storeKeys = ['recipesPlayed','signatures','daysPlayed','spirit','freeIng',
                     'firstRecipeDone','lastRecipeId','sessionCount','lastPlayedAt',
                     'story.introDone','story.ms','story.fin']
    .concat(CONFIG.recipes.RECIPES.map(r => 'best.'+r.id));
  const savedStore = {}; for(const k of storeKeys) savedStore[k] = Store.get(k);
  /* The story layer is MUTED for the run: a scripted suite plays dozens of plates, and a milestone or the
     level-100 finale firing mid-measurement would be the story reaching into the game. Restored below. */
  Store.set('story.introDone', true); Store.set('story.ms', 15); Store.set('story.fin', true);
  /* The suite drives every stroke itself, so it measures the game as a foreground app even when the host
     document is hidden (§18 correctly makes the payoff sequence wait for a backgrounded player). */
  const prevFg = measureFg; measureFg = true;
  rep.env = { hostHidden: !!document.hidden, measuredAsForeground: true, dpr: view.dpr,
              canvas: canvas.width + 'x' + canvas.height };
  const prev = { tol: CONFIG.perfect.PERFECT_TOL, count: CONFIG.recipe.count,
                 axis: CONFIG.recipe.CUT_AXIS, idx: recipeIndex, scripted: scriptedOnly };
  scriptedOnly = true;                       // the real pointer can never perturb a measurement
  // Sections 1–8 measure the canonical slice recipe, whatever the player (or a previous test) left loaded:
  // starting on a grid recipe made `count` per-axis and the first six-cut run never completed.
  const home = CONFIG.recipes.RECIPES[0].stages[0];
  K.play(0);
  const t00 = performance.now();
  const cutAt = (axis, verb, pos, t) => {
    if(verb === 'tap') tryTap(axis==='h' ? { x:T.cx, y:pos } : { x:pos, y:T.cy }, t);
    else if(axis === 'h') K.swipe(pos, pos, 0, 260, t);
    else K.swipeV(pos, pos, 0, 260, t);
  };
  const runEven = (axis, verb) => {           // six ideal cuts, evenly timed
    testReset();
    const ids = idealPositions(axis), t0 = performance.now();
    ids.forEach((p, i) => cutAt(axis, verb, p, t0 + i*400));
    return gradeInfo;
  };

  /* 1. metric spread: even > uneven > chaotic on BOTH axes and BOTH verbs, nothing off-axis */
  rep.metricSpread = {};
  for(const verb of ['tap','swipe']){
    const ms = K.metricSpread(verb), row = {};
    for(const ax of ['h','v']){
      const r = ms[ax];
      row[ax] = [r.even.ov, r.uneven.ov, r.chaotic.ov];
      if(!(r.even.ov > r.uneven.ov && r.uneven.ov > r.chaotic.ov)) fail(`spread.${verb}.${ax}.order`);
      for(const k of ['even','uneven','chaotic']) if(r[k].n !== 6 || r[k].offAxis) fail(`spread.${verb}.${ax}.${k}.count`);
    }
    rep.metricSpread[verb] = row;
  }

  /* 2. tap/swipe parity: identical placement AND identical score, both axes */
  CONFIG.perfect.PERFECT_TOL = 0;
  let parity = 0;
  for(const ax of ['h','v']){
    CONFIG.recipe.CUT_AXIS = ax;
    const a = runEven(ax, 'tap'), ca = cuts.map(c => c.c).sort((x,y) => x-y);
    const b = runEven(ax, 'swipe'), cb = cuts.map(c => c.c).sort((x,y) => x-y);
    if(ca.length !== cb.length){ fail('parity.'+ax+'.count'); continue; }
    for(let i=0;i<ca.length;i++) parity = Math.max(parity, Math.abs(ca[i]-cb[i]));
    if(a.overall !== b.overall) fail('parity.'+ax+'.score');
  }
  rep.parityMaxDeltaPx = +parity.toFixed(2);
  if(parity > 0.5) fail('parity.placement');

  /* 3. ghost truthfulness: the previewed landing IS the landing, nudges included */
  CONFIG.recipe.CUT_AXIS = 'h'; testReset();
  const bd = bandRange('h');
  let ghostMax = 0;
  /* Probes are FRACTIONS of the band, not px offsets: the original 40/52/58/150 px were written against a
     tomato twice this size, and after the global scale pass +150 landed off the fruit entirely — the check then
     read a legitimate "off-ingredient" as a silent reject. Same five positions, expressed so they cannot age. */
  const gspan = bd.hi - bd.lo;
  for(const probe of [bd.lo+gspan*0.17, bd.lo+gspan*0.23, bd.lo+gspan*0.25, bd.lo+gspan*0.65, bd.hi-gspan*0.13]){
    const pre = resolvePlacement('h', probe, 0), n0 = cuts.length;
    tryTap({ x:T.cx, y:probe }, performance.now());
    const placed = cuts.length > n0 ? cuts[cuts.length-1] : null;
    if(pre.ok && !placed){ fail('ghost.silentReject'); continue; }
    if(placed) ghostMax = Math.max(ghostMax, Math.abs(placed.c - pre.c));
  }
  rep.ghostMaxDeltaPx = +ghostMax.toFixed(2);
  if(ghostMax > 0.01) fail('ghost.untruthful');

  /* 4. Perfect Slice gating: never before PERFECT_MIN_CUT_INDEX, fires on it */
  CONFIG.perfect.PERFECT_TOL = prev.tol > 0 ? prev.tol : 12;
  testReset();
  const ids = idealPositions('h'), tg = performance.now();
  const gate = [];
  for(let i=0;i<CONFIG.perfect.PERFECT_MIN_CUT_INDEX;i++){
    tryTap({ x:T.cx, y:ids[i] }, tg + i*400);
    gate.push(perfectUsed);
  }
  rep.perfectGate = { atCut: gate.map(v => v?1:0).join(''), minIndex: CONFIG.perfect.PERFECT_MIN_CUT_INDEX };
  if(gate.slice(0,-1).some(v => v) || !gate[gate.length-1]) fail('perfect.gating');
  /* ACCURACY, not just the index gate. A cut placed exactly HALFWAY between two ideal points is the worst a
     player can do and must never fire the hero moment — the check the roster-wide scale pass needed: at a fixed
     12px window, halved ideal spacings made neighbouring windows overlap and every slice became "perfect".
     Measured on the tightest spacing in the game as well as the recipe under test. */
  rep.perfectAccuracy = {};
  for(const rid of ['tomato-slice-6','kiwi-slice-5','watermelon-slice-6']){
    const ri = CONFIG.recipes.RECIPES.findIndex(r => r.id === rid);
    if(ri < 0) continue;
    K.play(ri);
    if(peelPending()) K.peelSet(true);
    const ax = CONFIG.recipe.CUT_AXIS, ips = idealPositions(ax), t0 = performance.now();
    const spacing = ips.length > 1 ? Math.abs(ips[1]-ips[0]) : 0;
    for(let i=0;i<CONFIG.perfect.PERFECT_MIN_CUT_INDEX;i++){       // every cut at the worst possible offset
      const at = ips[i] + spacing/2;
      tryTap(ax === 'h' ? { x:T.cx, y:at } : { x:at, y:T.cy }, t0 + i*400);
    }
    rep.perfectAccuracy[rid] = { idealSpacingPx: +spacing.toFixed(1), tolPx: +(CONFIG.perfect.PERFECT_TOL*(T.k||1)).toFixed(1),
      firedOnWorstCut: perfectUsed };
    if(perfectUsed) fail('perfect.accuracy.'+rid);
  }
  CONFIG.recipe.CUT_AXIS = 'h'; K.play(prev.idx); CONFIG.perfect.PERFECT_TOL = prev.tol > 0 ? prev.tol : 12;
  testReset();

  /* 5. rhythm integrity: hitstop must not tax the rhythm clock */
  const rhythmRun = tol => { CONFIG.perfect.PERFECT_TOL = tol; const g = runEven('h','tap');
    return { rb: g.rhythmBonus, ov: g.overall, ps: perfectUsed }; };
  const withPS = rhythmRun(CONFIG.perfect.PERFECT_TOL), noPS = rhythmRun(0);
  rep.rhythm = { withPerfect: withPS.rb, withoutPerfect: noPS.rb, fired: withPS.ps };
  if(withPS.rb !== noPS.rb || !withPS.ps || noPS.ps) fail('rhythm.hitstopTax');

  /* 6. free-angle grading: a diagonal set scores like a horizontal one, no partial cuts */
  rep.diagonal = {};
  for(const ang of [0,28,40,60]){
    CONFIG.perfect.PERFECT_TOL = 0; CONFIG.recipe.CUT_AXIS = 'h'; testReset();
    const th = ang*Math.PI/180, half = Math.hypot(T.rx*-Math.sin(th), T.ry*Math.cos(th))*T.bandSideFrac;
    const t0 = performance.now();
    for(let i=0;i<CONFIG.recipe.count;i++){
      K.swipeAt(ang, -half + 2*half*(i+1)/(CONFIG.recipe.count+1), t0 + i*400);
    }
    rep.diagonal[ang] = { cuts: cuts.length, pieces: pieces.length, ov: gradeInfo && gradeInfo.overall };
    if(cuts.length !== CONFIG.recipe.count || pieces.length !== CONFIG.recipe.count+1) fail('diagonal.'+ang+'.pieces');
    if(!gradeInfo || gradeInfo.overall < 95) fail('diagonal.'+ang+'.score');
  }

  /* 7. one continuous recipe: no duplicate cuts → ends at count → sequence completes → retry */
  CONFIG.recipe.CUT_AXIS = home.axis; CONFIG.perfect.PERFECT_TOL = 0;
  runEven(home.axis, 'swipe');
  let mgap = Infinity;
  for(const g of parallelGroups()){
    const cs = g.cuts.filter(c => c.axis === g.cuts[0].axis).map(c => c.c).sort((x,y) => x-y);
    for(let i=1;i<cs.length;i++) mgap = Math.min(mgap, cs[i]-cs[i-1]);
  }
  rep.minGapPx = mgap === Infinity ? null : +mgap.toFixed(2);
  if(mgap < minGap() - 0.5) fail('duplicateCuts');
  const n6 = cuts.length, endPhase = phase;
  tryTap({ x:T.cx, y:T.cy }, performance.now());
  const rejected = cuts.length === n6 && /not-cutting/.test((strokeLog && strokeLog.reason) || '');
  rep.endsAtCount = { cuts: n6, phase: endPhase, seventhRejected: rejected };
  if(n6 !== CONFIG.recipe.count || endPhase !== 'sequence' || !rejected) fail('endsAtCount');
  const tSeq = performance.now();
  let info = null;
  for(let i=0;i<240 && !info;i++){ await _wait(25); if(phase === 'result') info = K.seqInfo(); }
  rep.sequence = info ? { phase: info.phase, plated: info.plated, seqTotalMs: info.seqTotalMs,
                          wallMs: Math.round(performance.now() - tSeq) }
                      : { phase, plated: !!plate, timedOut: true };
  if(!info || !info.plated) fail('sequence.incomplete');
  const retryMs = prepAgain();
  rep.retryMs = retryMs;
  if(phase !== 'cutting') fail('retry.notLive');
  if(retryMs > CONFIG.retry.RETRY_TRANSITION_MS) fail('retry.overBudget');

  /* 8. frame health. fps is reported, never asserted: a background iframe throttles frames, so the
     meaningful permanent guard is that no single frame HANGS (the device pass owns the fps number). */
  K.perfReset(); await _wait(400);
  rep.perf = K.perf();
  if(rep.perf.worst > 250) fail('perf.frameHang');

  /* 9. every recipe: a clean run must complete, grade sensibly, and plate every piece — no slivers dropped */
  const expectPieces = rec => rec.stages.reduce((s, st) =>
    s + (st.counts ? (st.counts.h+1)*(st.counts.v+1) : st.count+1), 0);
  rep.recipes = [];
  for(let i=0;i<CONFIG.recipes.RECIPES.length;i++){
    const rec = CONFIG.recipes.RECIPES[i], full = i === CONFIG.recipes.RECIPES.length-1;
    K.play(i);
    let staged = true;
    for(let s=0;s<rec.stages.length;s++){
      K.runStage('swipe');
      /* 8s, not 3s: the stage handoff is frame-gated (farewell slide → HANDOFF_MS → next ingress), so a
         throttled host spends the whole budget on a handoff that measures ~600ms when frames flow. The
         3s budget produced exactly one false `recipe.garden-prep.handoff` at 2.2fps — measurement only. */
      if(s < rec.stages.length-1 && !(await waitPhase('cutting', 8000))){ staged = false; break; }
    }
    if(!staged){ fail('recipe.'+rec.id+'.handoff'); rep.recipes.push({ id: rec.id, handoff:'stuck' }); continue; }
    if(!(await waitPhase('sequence', 2000))) fail('recipe.'+rec.id+'.noSequence');
    if(full){ Flow.set(1); K.perfReset(); await _wait(1200); rep.gardenPerf = K.perf(); } // heaviest case: 17 pieces mid-plating, full cadence, high flow, kitchen active
    K.skip(); // read the plate where the staging probe reads it: AFTER the final stage harvests. A multi-stage
              // recipe holds earlier stages in `harvest` and merges them on the last plating, so a mid-flight
              // read reports only the stage in the air (garden-prep read 7 of 17).
    const got = await waitPhase('result', full ? 8000 : 2000);
    const row = { id: rec.id, ing: rec.stages.map(s => s.ing).join('+'), technique: rec.technique,
      cuts: rec.stages.reduce((a,s) => a + (s.counts ? s.counts.h+s.counts.v : s.count), 0),
      plated: plate ? plate.order.length : 0, expect: expectPieces(rec),
      styles: [...new Set(rec.stages.map(s => s.plate))].join('+'),
      overflow: K.plateOverflow() && K.plateOverflow().worst,
      ov: gradeInfo && gradeInfo.overall, grade: gradeInfo && gradeInfo.grade, best: Save.best(rec.id) };
    rep.recipes.push(row);
    if(!got) fail('recipe.'+rec.id+'.noResult');
    if(row.plated !== row.expect) fail('recipe.'+rec.id+'.pieces');
    if(!(row.overflow <= 1)) fail('recipe.'+rec.id+'.plateOverflow'); // nothing may hang off the ceramic
    if(!(row.ov >= 90)) fail('recipe.'+rec.id+'.grade');
    if(row.best !== row.ov) fail('recipe.'+rec.id+'.best');
  }

  /* 10. julienne: ten cuts must LAND — the widened min gap is what makes fine work possible */
  {
    const ji = CONFIG.recipes.RECIPES.findIndex(r => r.technique === 'Julienne');
    K.play(ji);
    const gapUsed = minGap(), bd = bandRange(CONFIG.recipe.CUT_AXIS), n = CONFIG.recipe.count;
    let refusals = 0;
    const t0 = performance.now();
    for(let i=1;i<=n;i++){
      const before = cuts.length;
      K.swipeV(bd.lo + (bd.hi-bd.lo)*i/(n+1), bd.lo + (bd.hi-bd.lo)*i/(n+1), 0, 260, t0 + i*380);
      if(cuts.length === before) refusals++;
    }
    const even = cuts.length;
    // and again, deliberately crowded into the middle 60% of the board — fine work is not always tidy
    K.play(ji);
    let crowdRefusals = 0;
    const lo2 = bd.lo + (bd.hi-bd.lo)*0.20, hi2 = bd.lo + (bd.hi-bd.lo)*0.80;
    for(let i=0;i<n;i++){
      const before = cuts.length;
      const pos = lo2 + (hi2-lo2)*i/(n-1);
      K.swipeV(pos, pos, 0, 260, performance.now() + i*380);
      if(cuts.length === before) crowdRefusals++;
    }
    const cs = cuts.map(c => c.c).sort((a,b) => a-b);
    let mg = Infinity; for(let k=1;k<cs.length;k++) mg = Math.min(mg, cs[k]-cs[k-1]);
    rep.julienne = { minGapPx: gapUsed, globalMinGapPx: CONFIG.assist.MIN_GAP_PX, cuts: even, refusals,
      idealSpacingPx: +((bd.hi-bd.lo)/(n+1)).toFixed(1),
      crowded: { cuts: cuts.length, refusals: crowdRefusals, minGapAchievedPx: +mg.toFixed(2) },
      tol: CONFIG.recipe.tol };
    if(even !== n || refusals) fail('julienne.tenCuts');
    if(cuts.length !== n || crowdRefusals) fail('julienne.crowded');
  }

  /* 10b. julienne is FREE-ANGLE: cut 1 sets the direction, cuts 2..n snap parallel to it. Started horizontally,
     vertically and at 40°, each must land ten parallel cuts with zero refusals and grade comparably. */
  {
    const ji = CONFIG.recipes.RECIPES.findIndex(r => r.technique === 'Julienne');
    const placeAt = (dir, c, drawDeg, t) => { // draw at drawDeg, land on `dir` at intercept c
      const ad = drawDeg*Math.PI/180, sn = Math.sin(ad), cs = Math.cos(ad);
      const den = (dir.axis==='h' ? (cs + dir.slope*sn) : (sn + dir.slope*cs)) || 1;
      K.swipeAt(drawDeg, (dir.axis==='h' ? (c - T.cy) : -(c - T.cx)) / den, t);
    };
    rep.julienneDirs = {};
    for(const [name, ang] of [['horizontal',0],['vertical',90],['diagonal40',40]]){
      K.play(ji);
      const n = CONFIG.recipe.count;
      const pred = ang === 90 ? { axis:'v', slope:0 } : { axis:'h', slope: Math.tan(ang*Math.PI/180) };
      const ideals = idealIntercepts(pred.axis, pred.slope); // the game's own definition of ideal, per direction
      const t0 = performance.now();
      placeAt(pred, ideals[0], ang, t0);                 // cut 1: exactly as drawn
      const ref = cuts.length ? { axis: cuts[0].axis, slope: cuts[0].slope } : null;
      let refusals = cuts.length ? 0 : 1;
      if(ref) for(let i=1;i<n;i++){                      // the rest drawn deliberately sloppy: ±16°
        const before = cuts.length;
        placeAt(ref, ideals[i], ang + (i%2 ? 16 : -16), t0 + i*380);
        if(cuts.length === before) refusals++;
      }
      const parallel = new Set(cuts.map(c => c.axis + ':' + c.slope.toFixed(4))).size === 1;
      await waitPhase('sequence', 2000); K.skip();   // every direction must PLATE, not just grade
      const of = K.plateOverflow();
      rep.julienneDirs[name] = { cuts: cuts.length, refusals, pieces: pieces.length, parallel,
        overflow: of && of.worst, plated: of && of.n,
        idealSpacingPx: +Math.abs(ideals[1]-ideals[0]).toFixed(1), gapPx: +minGap(pred.axis, pred.slope).toFixed(1),
        axis: ref && ref.axis, slope: ref && +ref.slope.toFixed(3), angleDeg: ref && +cutAngleDeg(cuts[0]).toFixed(1),
        ov: gradeInfo && gradeInfo.overall, grade: gradeInfo && gradeInfo.grade,
        ev: gradeInfo && gradeInfo.evenness, cn: gradeInfo && gradeInfo.consistency };
      const row = rep.julienneDirs[name];
      if(row.cuts !== n || row.refusals) fail('julienneDir.'+name+'.tenCuts');
      if(!row.parallel) fail('julienneDir.'+name+'.parallel');
      if(row.pieces !== n+1) fail('julienneDir.'+name+'.pieces');
      if(!(row.overflow <= 1)) fail('julienneDir.'+name+'.plateOverflow');
      if(!(row.ov >= 85)) fail('julienneDir.'+name+'.grade');
    }
  }

  /* 11. dice: two PERPENDICULAR sets — axis-aligned, and started on a diagonal */
  {
    const di = CONFIG.recipes.RECIPES.findIndex(r => r.technique === 'Dice');
    K.play(di);
    K.runStage('swipe');
    const groups = parallelGroups().map(g => g.cuts.length).sort((a,b) => b-a);
    rep.dice = { counts: CONFIG.recipe.counts, h: axisCount('h'), v: axisCount('v'),
      pieces: pieces.length, gradedSets: groups, pipRows: K.pipRows(), ov: gradeInfo && gradeInfo.overall,
      perpSnap: CONFIG.recipe.PERP_SNAP, freeAngle: CONFIG.recipe.FREE_ANGLE };
    if(rep.dice.h !== 3 || rep.dice.v !== 3 || rep.dice.pieces !== 16) fail('dice.grid');
    if(groups.length !== 2 || groups[0] !== 3 || groups[1] !== 3) fail('dice.bothAxesGraded');
    if(K.pipRows().join('|') !== '111|111') fail('dice.pips');
    if(!CONFIG.recipe.PERP_SNAP || !CONFIG.recipe.FREE_ANGLE) fail('dice.perpSnap');
    K.skip();
    // and again on a diagonal: cut 1 at 30° sets one direction, its perpendicular becomes the second set
    K.play(di);
    const placeAt = (dir, c, drawDeg, t) => {
      const ad = drawDeg*Math.PI/180, sn = Math.sin(ad), cs = Math.cos(ad);
      const den = (dir.axis==='h' ? (cs + dir.slope*sn) : (sn + dir.slope*cs)) || 1;
      K.swipeAt(drawDeg, (dir.axis==='h' ? (c - T.cy) : -(c - T.cx)) / den, t);
    };
    const t0 = performance.now();
    const pred = { axis:'h', slope: Math.tan(30*Math.PI/180) };
    const bd1 = interceptBand(pred.axis, pred.slope);
    placeAt(pred, bd1.lo + (bd1.hi-bd1.lo)*0.25, 30, t0);
    const A = { axis: cuts[0].axis, slope: cuts[0].slope }, B = perpOf(A);
    const bA = interceptBand(A.axis, A.slope), bB = interceptBand(B.axis, B.slope);
    let refused = 0;
    for(let i=2;i<=3;i++){ const before = cuts.length;
      placeAt(A, bA.lo + (bA.hi-bA.lo)*i/4, 30 + (i%2?14:-14), t0 + i*300);
      if(cuts.length === before) refused++; }
    for(let i=1;i<=3;i++){ const before = cuts.length;
      placeAt(B, bB.lo + (bB.hi-bB.lo)*i/4, 120 + (i%2?14:-14), t0 + (3+i)*300);
      if(cuts.length === before) refused++; }
    const gs = parallelGroups();
    rep.diceDiagonal = { cuts: cuts.length, refused, pieces: pieces.length,
      setAngles: gs.map(g => +g.a.toFixed(1)).sort((a,b) => a-b), gradedSets: gs.map(g => g.cuts.length),
      apart: gs.length === 2 ? +angleApart(gs[0].a, gs[1].a).toFixed(1) : null,
      h: axisCount('h'), v: axisCount('v'), ov: gradeInfo && gradeInfo.overall, phase };
    if(cuts.length !== 6 || refused) fail('diceDiagonal.cuts');
    if(rep.diceDiagonal.pieces !== 16) fail('diceDiagonal.pieces');
    if(!(rep.diceDiagonal.apart > 88 && rep.diceDiagonal.apart <= 90)) fail('diceDiagonal.perpendicular');
    if(phase !== 'sequence') fail('diceDiagonal.completes');
    K.skip();
  }

  /* 12. staging: three ingredients, one plate */
  {
    const gi = CONFIG.recipes.RECIPES.findIndex(r => r.id === 'garden-prep');
    K.play(gi);
    const seen = [];
    for(let s=0;s<3;s++){
      seen.push({ stage: stageIndex, ing: activeSrc.ing, ticks: K.stageTicks() });
      K.runStage('swipe');
      if(s < 2) await waitPhase('cutting', 3000);
    }
    await waitPhase('sequence', 2000); K.skip();
    const kinds = new Set(plate ? plate.order.map(p => p.src.ing) : []);
    rep.staging = { stagesSeen: seen, harvested: harvest.length, plated: plate ? plate.order.length : 0,
      ingredientsOnPlate: [...kinds], styles: [...new Set(plate ? plate.order.map(p => p.plateStyle) : [])],
      gradeStages: gradeInfo && gradeInfo.stages };
    if(kinds.size !== 3) fail('staging.ingredients');
    if(rep.staging.plated !== 17) fail('staging.plated');
    if(rep.staging.gradeStages !== 3) fail('staging.combinedGrade');
  }

  /* 13. [Next Recipe] cycles, and each recipe keeps its own best */
  {
    const ids = [];
    K.play(0);
    for(let i=0;i<CONFIG.recipes.RECIPES.length;i++){ ids.push(CONFIG.recipe.id); nextRecipe(); }
    rep.cycle = { order: ids, backToStart: CONFIG.recipe.id === ids[0],
      bests: CONFIG.recipes.RECIPES.map(r => r.id + ':' + Save.best(r.id)).join(' ') };
    if(!rep.cycle.backToStart || new Set(ids).size !== CONFIG.recipes.RECIPES.length) fail('cycle.order');
  }

  /* 14. free cut: the recipe that constrains nothing — cross cuts must complete and grade, and a plain
     parallel run must score the same here as the same run in Slice ×6 (no hidden per-recipe scoring). */
  {
    const fi = CONFIG.recipes.RECIPES.findIndex(r => r.id === 'free-cut');
    const st = CONFIG.recipes.RECIPES[fi].stages[0];
    const seen = [];
    for(let k=0;k<st.rotate.length;k++){ Store.set('freeIng', k); K.play(fi); seen.push(activeSrc.ing); }
    Store.set('freeIng', st.rotate.indexOf('carrot')); K.play(fi);   // cross cuts on the carrot
    const ids = idealIntercepts('v', 0), t0 = performance.now();
    let refused = 0;
    for(let i=0;i<3;i++){ const n0 = cuts.length; K.swipeV(ids[i*2+1], ids[i*2+1], 0, 260, t0+i*350); if(cuts.length===n0) refused++; }
    const hIds = idealIntercepts('h', 0);
    for(let i=0;i<3;i++){ const n0 = cuts.length; K.swipeAt(20 + i*20, (hIds[i*2+1]-T.cy)*0.6, t0+(3+i)*350); if(cuts.length===n0) refused++; }
    const gs = parallelGroups();
    await waitPhase('sequence', 2000); K.skip();
    const of = K.plateOverflow();
    rep.freeCut = { ingredients: seen, crossCuts: cuts.length, refused, pieces: pieces.length,
      sets: gs.map(g => ({ deg: +g.a.toFixed(1), n: g.cuts.length })),
      overflow: of && of.worst, plated: of && of.n,
      ov: gradeInfo && gradeInfo.overall, grade: gradeInfo && gradeInfo.grade,
      freeAngle: CONFIG.recipe.FREE_ANGLE, parallelSnap: CONFIG.recipe.PARALLEL_SNAP,
      perpSnap: CONFIG.recipe.PERP_SNAP, singleAxis: CONFIG.recipe.SINGLE_AXIS };
    if(seen.join() !== st.rotate.join()) fail('freeCut.rotation');
    if(cuts.length !== 6 || refused) fail('freeCut.crossCuts');
    if(gs.length < 2) fail('freeCut.multipleSets');       // cross cuts must read as separate sets, not one
    if(pieces.length <= 7) fail('freeCut.partition');     // crossing sets make MORE pieces than a parallel run
    if(!(rep.freeCut.ov >= 40)) fail('freeCut.grades');
    if(!(rep.freeCut.overflow <= 1)) fail('freeCut.plateOverflow');
    if(CONFIG.recipe.PARALLEL_SNAP || CONFIG.recipe.PERP_SNAP || CONFIG.recipe.SINGLE_AXIS) fail('freeCut.unconstrained');
    // the same clean parallel six, here and in Slice ×6 — identical ingredient, identical score
    Store.set('freeIng', st.rotate.indexOf('tomato'));
    K.play(fi); K.runStage('swipe');
    const free6 = gradeInfo && gradeInfo.overall, freeEv = gradeInfo && gradeInfo.evenness;
    K.skip();
    K.play(0); K.runStage('swipe');
    const slice6 = gradeInfo && gradeInfo.overall, sliceEv = gradeInfo && gradeInfo.evenness;
    K.skip();
    rep.freeCut.parallelParity = { free: free6, slice: slice6, evFree: freeEv, evSlice: sliceEv };
    if(free6 !== slice6) fail('freeCut.parityWithSlice');
  }

  /* 15. end caps: every ingredient keeps BOTH terminal pieces. Grades, piece counts and plate containment were
     all blind to a piece being drawn short, so this measures the union of the pieces against the silhouette. */
  {
    rep.endCaps = {};
    const cover = (id, nCuts) => {
      setIngredient(id); testReset();
      if(nCuts){ const ids = idealIntercepts('v', 0).slice(0, nCuts), t0 = performance.now();
        ids.forEach((c,i) => K.swipeV(c, c, 0, 260, t0 + i*300)); }
      const g = CONFIG.INGREDIENTS[id].geom;
      let sLo=1e9, sHi=-1e9, uLo=1e9, uHi=-1e9, tot=0, out=0;
      const seen = pieces.map(() => ({ lo:1e9, hi:-1e9 }));
      for(let x=g.cx-g.rx-4; x<=g.cx+g.rx+4; x+=1)
        for(let y=g.cy-g.ry-4; y<=g.cy+g.ry+4; y+=1){
          if(!SILS[g.shape].inside(g,x,y)) continue;
          tot++;
          if(x<sLo)sLo=x; if(x>sHi)sHi=x;
          let hit = -1;
          for(let i=0;i<pieces.length;i++) if(containsPoint(pieces[i].cons,x,y)){ hit=i; break; }
          if(hit < 0){ out++; continue; }
          if(x<uLo)uLo=x; if(x>uHi)uHi=x;
          const r = seen[hit]; if(x<r.lo)r.lo=x; if(x>r.hi)r.hi=x;
        }
      const rel = v => +(v-g.cx).toFixed(1);
      const ends = seen.filter(r => r.hi >= r.lo);
      return { cuts: cuts.length, pieces: pieces.length, expect: cuts.length+1,
        sil: [rel(sLo), rel(sHi)], union: [rel(uLo), rel(uHi)],
        butt: rel(Math.min(...ends.map(r => r.lo))), tip: rel(Math.max(...ends.map(r => r.hi))),
        emptyPieces: seen.length - ends.length, uncoveredPct: +(100*out/tot).toFixed(2) };
    };
    for(const id of ['tomato','cucumber','carrot']){
      const rows = {};
      for(const n of [0,1,6,10]){
        const r = cover(id, n);
        rows['cuts'+n] = r;
        if(r.pieces !== r.expect) fail('endCaps.'+id+'.'+n+'.count');
        // the union of the pieces must reach both ends of the silhouette \u2014 a dropped cap shows up here and nowhere else
        if(Math.abs(r.union[0] - r.sil[0]) > 1.5 || Math.abs(r.union[1] - r.sil[1]) > 1.5) fail('endCaps.'+id+'.'+n+'.extent');
        if(r.emptyPieces) fail('endCaps.'+id+'.'+n+'.emptyPiece');
        if(r.uncoveredPct > 2) fail('endCaps.'+id+'.'+n+'.gaps');
      }
      rep.endCaps[id] = rows;
    }
    /* §17E PAINT SMOKE, at TRUE SCALE. §CRITICAL-TESTING-RULE in code: 17B shipped two of six foods with paint
       that only failed when rasterised at the real on-screen size, and an eyeball is not a regression test. For
       every ingredient this asserts three things a broken paint cannot satisfy: it does not throw; it actually
       COVERS its silhouette (a paint that misses is a food-shaped hole); and its INTERIOR differs measurably
       from its skin, which is what makes a cut face read as an opening rather than as more outside. */
    {
      const S = 0.562;                                   // the measured design→screen factor
      rep.paint = {};
      for(const id of Object.keys(CONFIG.INGREDIENTS)){
        if(!PAINT[id]){ fail('paint.'+id+'.missing'); continue; }
        const g = CONFIG.INGREDIENTS[id].geom;
        const w = Math.max(8, Math.ceil(g.rx*2.4*S)), hh = Math.max(8, Math.ceil(g.ry*2.4*S));
        const rasterise = fn => {                        // one painter, at true screen scale, sampled
          const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
          const c2 = cv.getContext('2d');
          c2.save(); c2.translate(w/2, hh/2); c2.scale(S, S); c2.translate(-g.cx, -g.cy);
          try { fn(c2, g); } catch(e){ return { threw: e.message }; }
          c2.restore();
          const px = c2.getImageData(0, 0, w, hh).data;
          let on = 0, tot = 0;
          for(let i=3;i<px.length;i+=4){ tot++; if(px[i] > 8) on++; }
          const at = (fx, fy) => { const x = Math.round(w*fx), y = Math.round(hh*fy), i = (y*w+x)*4;
            return [px[i], px[i+1], px[i+2], px[i+3]]; };
          // centre (interior) against a point just inside the silhouette's left flank (skin)
          return { cover: +(100*on/tot).toFixed(1), mid: at(0.5, 0.5), edge: at(0.5 - 0.5/1.2*0.92, 0.5) };
        };
        const base = rasterise(PAINT[id]);
        if(base.threw){ rep.paint[id] = { threw: base.threw }; fail('paint.'+id+'.threw'); continue; }
        const mid = base.mid, edge = base.edge;
        const dv = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]);
        const dist = dv(mid, edge);
        rep.paint[id] = { cover: base.cover, mid: mid.slice(0,3), edge: edge.slice(0,3), skinToFlesh: dist };
        /* A DIVIDED leaf legitimately fills less of its box. Flat-leaf parsley is trifid with deep sinuses and
           sharp teeth: widening the lobes until it cleared the 30% bar turned it into coriander and its chopped
           bits into square tiles, so the shape is right and the assertion needs the allowance. A beet is a bulb
           with a long fine taproot past it, which is the same structural allowance. Every solid food answers 30. */
        const floor = { parsley: 24, beetroot: 26 }[id] || 30;
        if(base.cover < floor) fail('paint.'+id+'.coverage'); // a silhouette fills well over a third of its box
        if(mid[3] < 200) fail('paint.'+id+'.hollow');    // nothing may be transparent at its own centre
        if(SKIN_WHOLE[id]){
          /* A food drawn from its OUTSIDE only (turnip) has no interior to differ from: its base sprite is a
             plain ground nothing ever sees. What must hold instead is that the permanent skin layer paints and
             genuinely covers that ground \u2014 measured the same way, against the base it sits on. */
          const skin = SKIN[id] ? rasterise(SKIN[id]) : { threw: 'no skin' };
          if(skin.threw){ fail('paint.'+id+'.skinThrew'); continue; }
          rep.paint[id].skinCover = skin.cover;
          rep.paint[id].baseToSkin = dv(skin.mid, mid);
          if(skin.cover < floor || skin.mid[3] < 200) fail('paint.'+id+'.skinCoverage');
          if(rep.paint[id].baseToSkin < 12) fail('paint.'+id+'.skinFlat');
        } else if(dist < 12) fail('paint.'+id+'.flat'); // interior indistinguishable from skin
      }
    }
    /* COLD-CACHE clip check. The bug this guards is invisible warm: silPath memoises on the geom, so once anything
       has built a shape's path the staleness disappears. Wipe every derived cache, then switch as the game does. */
    const wipe = () => { for(const k of Object.keys(CONFIG.INGREDIENTS)){ const g = CONFIG.INGREDIENTS[k].geom;
        delete g.__paths; delete g.__in; delete g.__sup; }
      delete T.__paths; delete T.__in; delete T.__sup; };
    const probe = document.createElement('canvas').getContext('2d');
    const spanOf = (path, g) => { let lo=1e9, hi=-1e9;
      for(let x=g.cx-280;x<=g.cx+280;x+=0.5) if(probe.isPointInPath(path,x,g.cy)){ if(x<lo)lo=x; if(x>hi)hi=x; }
      return lo>hi ? null : +(hi-lo).toFixed(1); };
    rep.coldClip = {};
    for(const id of ['cucumber','carrot','tomato','pear','peach','corn','celery','mozzarella','butter','tofu',
                     'lettuce','cabbage','cauliflower','spinach','pineapple',
                     'asparagus','radish','beetroot','sweetpotato','watermelon','mango','kiwi','pomegranate']){
      wipe();
      setIngredient('tomato'); silPath(T, 1.5);        // warm T on the previous shape, as a real session does
      setIngredient(id);
      const g = CONFIG.INGREDIENTS[id].geom;
      const asRendered = spanOf(silPath(T, 1.5), T), correct = spanOf(silPath(g, 1.5), g);
      rep.coldClip[id] = { asRendered, correct, shape: T.shape };
      if(Math.abs(asRendered - correct) > 1) fail('coldClip.'+id+'.staleShape');
    }
    setIngredient(CONFIG.recipes.RECIPES[0].stages[0].ing);
  }

  /* 13. ATMOSPHERE (Phase 4B). Every assertion here is a form of one rule: nothing is ever taken away. */
  {
    const A = CONFIG.cadence, F = CONFIG.flow, SP = CONFIG.spirit;
    rep.flowAfterSweep = +Flow.level().toFixed(3);          // six clean recipes must have raised the room
    if(!(rep.flowAfterSweep > 0)) fail('flow.neverRose');
    // the floor: the worst run possible, then check all three layers are still audible
    Audio.cadenceReset(); Flow.set(0);
    for(let i=0;i<40;i++){ Flow.onCut(1); Audio.cadenceTick(); }
    const worst = Audio.cadenceState();
    const foleyPeak = Math.max.apply(null, ['tomato','cucumber','carrot'].map(k => CONFIG.INGREDIENTS[k].audio.transPeak));
    rep.cadence = { bpm: A.CADENCE_BPM, floor: A.CADENCE_LAYER_FLOOR, on: worst.on, events: worst.events,
      worstMix: { bed:+worst.mix.bed.toFixed(3), mel:+worst.mix.mel.toFixed(3), tex:+worst.mix.tex.toFixed(3) },
      minGain: { bed:+worst.gains.bed.toFixed(4), mel:+worst.gains.mel.toFixed(4), tex:+worst.gains.tex.toFixed(4) },
      foleyPeak: +foleyPeak.toFixed(3),
      foleyToBedRatio: +(foleyPeak/A.LAYER_GAINS.bed).toFixed(2),
      foleyToLoudestLayer: +(foleyPeak/Math.max(A.LAYER_GAINS.bed, A.LAYER_GAINS.mel, A.LAYER_GAINS.tex)).toFixed(2) };
    for(const k of ['bed','mel','tex']){
      if(!(worst.mix[k] >= A.CADENCE_LAYER_FLOOR - 1e-9)) fail('cadence.'+k+'.belowFloor');
      if(!(worst.gains[k] > 0)) fail('cadence.'+k+'.silent');
      if(worst.gains[k] >= foleyPeak*0.5) fail('cadence.'+k+'.masksFoley'); // the bed sits well under the food
    }
    Flow.set(0); for(let i=0;i<20;i++) Flow.onCut(0);
    Audio.cadenceTick();
    const best = Audio.cadenceState();
    rep.cadence.bestMix = { bed:+best.mix.bed.toFixed(3), mel:+best.mix.mel.toFixed(3), tex:+best.mix.tex.toFixed(3) };
    if(!(best.mix.mel > worst.mix.mel && best.mix.tex > worst.mix.tex)) fail('cadence.mixDoesNotRise');
    if(!(best.mix.tex <= best.mix.mel + 1e-9)) fail('cadence.textureNotLast');
    // quantization: a pure sweep of every offset across four beats — provable with or without live audio
    const grid = (60/A.CADENCE_BPM)*(4/A.QUANTIZE_DIVISION);
    let mx = 0, mxc = 0, nudged = 0, N = 4000;
    for(let i=0;i<N;i++){ const rel = grid*4*i/N;
      const q = Audio.quantShiftFor(rel), qc = Audio.quantShiftFor(rel, A.CHIME_MAX_SHIFT_MS);
      if(q > mx) mx = q; if(qc > mxc) mxc = qc; if(q > 0) nudged++; }
    rep.quantize = { gridMs: +(grid*1000).toFixed(1), worstShiftMs: +mx.toFixed(2), capMs: A.QUANTIZE_MAX_SHIFT_MS,
      nudgedPct: +(100*nudged/N).toFixed(1), chimeWorstShiftMs: +mxc.toFixed(2), chimeCapMs: A.CHIME_MAX_SHIFT_MS,
      hitstopMs: CONFIG.perfect.HITSTOP_MS, liveShiftMaxMs: worst.shiftMaxMs, liveChimeShiftMaxMs: worst.chimeShiftMaxMs };
    if(mx > A.QUANTIZE_MAX_SHIFT_MS + 1e-6) fail('quantize.overCap');
    if(mxc > Math.min(A.CHIME_MAX_SHIFT_MS, CONFIG.perfect.HITSTOP_MS) + 1e-6) fail('quantize.chimePastHitstop');
    // flow has NO UI. Not a number, not a meter, not a word — anywhere in the document
    const domText = (document.body.innerText || '') + ' ' + (document.body.getAttribute('aria-label') || '');
    rep.flowUi = { mentionsFlow: /flow/i.test(domText), meters: document.querySelectorAll('meter,progress').length };
    if(rep.flowUi.mentionsFlow) fail('flow.hasUiText');
    if(rep.flowUi.meters) fail('flow.hasMeter');
    // the measured light on the board: same pixel, flow 0 vs flow 1
    /* The reading is the board's own five-point mean (§53c's pool included), taken through valueProbe so the
       suite and a hand measurement can never disagree about what "the board" is. */
    /* §17-R HARNESS — measure what manual inspection measures: valueProbe().board.mean, the canonical
       five-point board reading (172.5 at flow 0, 176.8 at flow 1 → the true settled +2.49%, identical
       under the old and the new ROOM_SHADE). The old assertion read ONE pixel at (0.30,0.34) of the face
       after a single draw(), and that reading is not the board: it lands where the pool barely reaches and
       measured 174.4 → 175.1 = 0.4%. valueProbe() owns the state the reading needs (STATION framing, room
       revealed, scene re-rendered past its rate limit) and restores it, so the harness no longer has to.
       The endpoints are still sampled until they stop moving, and a reading that never settles is its own
       failure — the 1% threshold is untouched and nothing can hide behind the wait. */
    const boardMean = () => { draw(performance.now(), gameNow()); return K.valueProbe().board.mean; };
    const lumSettled = (x) => { let prev = null, same = 0, i = 0;
      for(; i < 60; i++){ Flow.set(x); const l = boardMean();
        if(l === prev){ if(++same >= 3) return { lum: l, frames: i+1, settled: true }; }
        else { same = 0; prev = l; } }
      return { lum: prev, frames: i, settled: false }; };
    const s0 = lumSettled(0), s1 = lumSettled(1);
    const lum0 = s0.lum, lum1 = s1.lum;
    rep.flowLight = { lum0, lum1, deltaPct: +(100*(lum1-lum0)/Math.max(1,lum0)).toFixed(2), cfgRange: F.FLOW_LIGHT_RANGE,
      settleFrames: [s0.frames, s1.frames], settled: s0.settled && s1.settled,
      probe: 'valueProbe().board.mean (5 points, STATION, room revealed)' };
    if(!rep.flowLight.settled) fail('flow.lightNeverSettled');
    if(!(lum1 > lum0)) fail('flow.lightDoesNotRise');
    if(rep.flowLight.deltaPct > F.FLOW_LIGHT_RANGE*100 + 1.5) fail('flow.lightTooStrong');
    if(rep.flowLight.deltaPct < 1) fail('flow.lightImperceptible');
    // the kitchen is pre-rendered: two identical frames must not re-render it
    Flow.set(0.5); draw(performance.now(), gameNow());
    const r0 = KitchenScene.renders(); draw(performance.now(), gameNow()); draw(performance.now(), gameNow());
    rep.scene = { redrawsForTwoIdenticalFrames: KitchenScene.renders() - r0, blurPx: CONFIG.scene.BG_BLUR_PX,
      contrast: CONFIG.scene.BG_CONTRAST, threshold: CONFIG.scene.BG_REDRAW_THRESHOLD, cost: KitchenScene.cost() };
    if(rep.scene.redrawsForTwoIdenticalFrames > 0) fail('scene.redrawsEveryFrame');
    if(KitchenScene.cost().worstMs > 40) fail('scene.renderTooExpensive');
    Flow.set(0);
    /* spirit grows on a BAD run too, and never shrinks. It is SEEDED to the schema's base first: a save that
       has already reached 100 clamps every write, so growth becomes unmeasurable rather than broken — the suite
       would report a defect that is really a full save. The player's own value is restored with every other key. */
    Store.set('spirit', { value: SP.SPIRIT_BASE }); Spirit.reload();
    const sBefore = Spirit.value();
    const learn = Spirit.grow('Learning'), master = Spirit.grow('Masterful');
    rep.spirit = { before: +sBefore.toFixed(3), afterLearning: +learn.after.toFixed(3),
      learningDelta: +(learn.after - learn.before).toFixed(3), masterfulDelta: +(master.after - master.before).toFixed(3),
      warmth: +Spirit.warmth().toFixed(3), ambientAt: SP.SPIRIT_AMBIENT_AT, ambientGain: SP.SPIRIT_AMBIENT_GAIN,
      announced: /spirit|unlocked|milestone/i.test(document.body.innerText || '') };
    if(!(learn.after > learn.before)) fail('spirit.learningDidNotGrow');
    if(!(master.after - master.before > learn.after - learn.before)) fail('spirit.gradeDoesNotScale');
    if(rep.spirit.announced) fail('spirit.announced');
    Save.setSpirit(sBefore - 10); // a decrease must be refused by the store itself, not by its callers
    rep.spirit.afterDecreaseAttempt = +Spirit.reload().toFixed(3);
    if(rep.spirit.afterDecreaseAttempt < master.after) fail('spirit.decreased');
    // a corrupt, absent or hostile value never crashes the game
    const corrupt = {};
    for(const [name, val] of [['string','not-an-object'], ['nan',{value:NaN}], ['missing',null],
                              ['negative',{value:-9}], ['huge',{value:1e9}]]){
      Store.set('spirit', val);
      corrupt[name] = +Spirit.reload().toFixed(3);
      draw(performance.now(), gameNow());        // and the kitchen still renders from it
    }
    rep.spirit.corrupt = corrupt;
    if(!Object.keys(corrupt).every(k => Number.isFinite(corrupt[k]) && corrupt[k] >= 0 && corrupt[k] <= 100))
      fail('spirit.corruptNotHandled');
    rep.payload = { newAssetFiles: 0, scripts: document.querySelectorAll('script[src]').length,
      images: document.querySelectorAll('img,link[rel=preload]').length, audioFiles: 0 };
    if(rep.payload.scripts || rep.payload.images) fail('payload.externalAsset');
  }

  /* 14. THE HOME KITCHEN (Phase 5A). One rule: the room may not touch the board, the pointer, the numbers
     or the payload. Everything it is allowed to do is presentation. */
  {
    const K5 = CONFIG.kitchen, KT = window.__kcTest, ph0 = phase;
    // (2) the most dangerous thing in the phase: the board's rect and the pointer mapping
    rep.board = KT.boardProbe();
    const B0 = rep.board.design;
    if(B0.x !== 22 || B0.y !== 128 || B0.w !== 496 || B0.h !== 748 || B0.radius !== 26) fail('board.rectMoved');
    if(rep.board.tap.err > 0.001) fail('board.pointerMappingDrifted');
    if(rep.board.roomIntrudes) fail('board.roomIntrudes');
    // (5) ONE value, ONE renderer: a first-ever load does not reveal the room and does not even render it
    phase = 'cutting';
    Store.set('firstRecipeDone', null); SceneMemory.reload(); KitchenScene.syncReveal(); KitchenScene.invalidate();
    const rev0 = KitchenScene.reveal(), comp0 = KitchenScene.report().composites;

      uneven:  [0.10,0.19,0.29,0.55,0.76,0.90],
      chaotic: [0.05,0.10,0.16,0.22,0.86,0.95],
    };
    const out = {};
    for(const axis of ['h','v']){
      CONFIG.recipe.CUT_AXIS = axis; out[axis] = {};
      for(const key in patterns){
        testReset();
        const bd = bandRange(axis), span = bd.hi - bd.lo, t0 = performance.now();
        patterns[key].forEach((f, i) => {
          const pos = bd.lo + span*f, t = t0 + i*400;
          if(verb === 'swipe'){
            if(axis==='h') this.swipe(pos, pos, 0, 260, t); else this.swipeV(pos, pos, 0, 260, t);
          } else {
            tryTap(axis==='h' ? { x: T.cx, y: pos } : { x: pos, y: T.cy }, t);
          }
        });
        const cs = cuts.filter(c => c.axis===axis).map(c => +c.c.toFixed(1)).sort((a,b)=>a-b);
        const off = cuts.length - cs.length;
        const edges = [bd.lo, ...cs, bd.hi], gaps = [];
        for(let i=1;i<edges.length;i++) gaps.push(+(edges[i]-edges[i-1]).toFixed(1));
        out[axis][key] = { n: cs.length, offAxis: off, gaps, ideal: +((bd.hi-bd.lo)/(cs.length+1)).toFixed(1),
          ev: gradeInfo && gradeInfo.evenness, cn: gradeInfo && gradeInfo.consistency, ov: gradeInfo && gradeInfo.overall };
      }
    }
    CONFIG.recipe.CUT_AXIS = prevAxis; CONFIG.perfect.PERFECT_TOL = prevTol; CONFIG.recipe.count = prevCount; testReset();
    return out;
  },

  /* ---------- 5A-2 (§53a): the value structure, measured rather than argued ----------
     Samples real rendered pixels: the board's face, the wall and mid band, the table, and the four corners.
     The board must come out brightest — if it ever does not, the room has taken the frame back. */
  valueProbe(){
    const wasDone = SceneMemory.firstDone(), cam0 = Camera.state();
    if(!wasDone){ SceneMemory.completeFirst(); KitchenScene.syncReveal(); }   // measurement only — restored below
    Camera.snap('STATION');                     // value is measured from the gameplay framing, always
    KitchenScene.refresh();                     // the room is rate-limited by design: a measurement must not be
    draw(performance.now(), gameNow());
    const B = CONFIG.board;
    const at = (x, y) => {
      const p = Camera.forwardView(x, y);       // design → screen through the camera, so a probe is framing-proof
      const px = clamp(Math.round(p.x*view.dpr), 0, canvas.width-1);
      const py = clamp(Math.round(p.y*view.dpr), 0, canvas.height-1);
      const d = ctx.getImageData(px, py, 1, 1).data;
      return +(0.2126*d[0] + 0.7152*d[1] + 0.0722*d[2]).toFixed(1);
    };
    const mean = a => +(a.reduce((s,v) => s+v, 0)/a.length).toFixed(1);
    /* Sampled on the DRAWN FACE, not on the cut rect (§53h). The rect's upper and lower bands are table now,
       and a probe that kept sampling them would report the table's value as the board's. */
    const q = boardQuad();
    const onFace = (u, v) => { const y = q.yt + (q.yb-q.yt)*v;
      const x0 = q.xt0 + (q.xb0-q.xt0)*v, x1 = q.xt1 + (q.xb1-q.xt1)*v;
      return at(x0 + (x1-x0)*u, y); };
    const board = [[0.30,0.10],[0.62,0.24],[0.20,0.62],[0.78,0.74],[0.50,0.92]].map(p => onFace(p[0], p[1]));
    const wall = [[270,96],[280,70],[460,96],[330,64]].map(p => at(p[0], p[1]));
    const table = [[270,240],[8,300],[532,660],[60,742]].map(p => at(p[0], p[1]));
    const corners = [[6,6],[534,6],[6,954],[534,954]].map(p => at(p[0], p[1]));
    /* The three things pass 1 crushed to near-black. They are reported by name because "the room is too dark"
       is not a feeling here — it is the knife rack, the jars and the shelf being unreadable. */
    const props = { rack: at(392, 68), jars: at(330, 74), shelf: at(400, 14), basket: at(80, 800) };
    const objects = [[92,88],[330,830]].map(p => at(p[0], p[1]));
    const room = mean(wall.concat(table, corners));
    const floor = Math.min.apply(null, wall.concat(table, corners, [props.rack, props.jars, props.shelf]));
    Camera.snap(cam0);
    if(!wasDone){ Store.set('firstRecipeDone', null); SceneMemory.reload(); KitchenScene.syncReveal(); }
    return { board: { mean: mean(board), min: Math.min.apply(null, board), max: Math.max.apply(null, board), samples: board },
      room: { mean: room, wall: mean(wall), table: mean(table), corners: mean(corners), floor: floor,
              samples: { wall, table, corners }, props: props, creamObjects: objects },
      ratio: { boardOverRoom: +(mean(board)/Math.max(1, room)).toFixed(2),
               boardOverWall: +(mean(board)/Math.max(1, mean(wall))).toFixed(2),
               boardOverCorners: +(mean(board)/Math.max(1, mean(corners))).toFixed(2) },
      brightest: mean(board) > Math.max(mean(wall), mean(table), mean(corners)) ? 'board' : 'room',
      grade: { far: CONFIG.scene.FAR_SHADE, near: CONFIG.scene.NEAR_SHADE, vignette: CONFIG.scene.VIGNETTE,
               pool: CONFIG.scene.POOL_WARM }, reveal: KitchenScene.reveal() };
  },
  /* §55: the order paper is the one always-on reading surface, so its contrast against the DOM text on it is
     asserted like a number, not trusted like a taste. WCAG ratio, measured off the rendered paper. */
  clipboardContrast(){
    const wasDone = SceneMemory.firstDone(), cam0 = Camera.state();
    if(!wasDone){ SceneMemory.completeFirst(); KitchenScene.syncReveal(); }
    Camera.snap('STATION');
    KitchenScene.refresh(); draw(performance.now(), gameNow());
    const lin = v => { const c = v/255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
    const relLum = rgb => 0.2126*lin(rgb[0]) + 0.7152*lin(rgb[1]) + 0.0722*lin(rgb[2]);
    const at = (x, y) => {
      const p = Camera.forwardView(x, y);
      const px = clamp(Math.round(p.x*view.dpr), 0, canvas.width-1);
      const py = clamp(Math.round(p.y*view.dpr), 0, canvas.height-1);
      const d = ctx.getImageData(px, py, 1, 1).data; return [d[0], d[1], d[2]];
    };
    const parse = s => (s.match(/[\d.]+/g) || [0,0,0,1]).map(Number);

      return [0,1,2].map(i => fg[i]*a + bg[i]*(1-a)); };

  runStage(verb){ // the current stage, cut ideally: both sets for a grid, in axis order

    const sets = R.counts ? [['h',R.counts.h],['v',R.counts.v]] : [[R.CUT_AXIS, R.count]];

  ingredient(){ return { id: activeSrc.ing, shape: T.shape, stage: stageIndex,

  /* §53h: the cut rect and the DRAWN face are different rectangles now. Piece counts, grades and plate
     containment are all blind to food sitting off the wood, so this measures the food against the drawn
     quad — the only surface the player reads as "the board". Conservative: each piece is measured by its
     parent silhouette's box, so a pass here cannot be a false pass. */
  containment(){
    const f = window.__kcTest.boardProbe().face;
    const span = y => { const t = clamp01((y - f.yt) / (f.yb - f.yt));
      return { l: f.xt0 + (f.xb0 - f.xt0)*t, r: f.xt1 + (f.xb1 - f.xt1)*t }; };
    const check = (x0, y0, x1, y1) => { // worst outward overshoot of a box against the tapered face
      let worst = 0, side = null;
      if(y0 < f.yt){ worst = Math.max(worst, f.yt - y0); side = 'top'; }
      if(y1 > f.yb && y1 - f.yb > worst){ worst = y1 - f.yb; side = 'bottom'; }
      for(const y of [Math.max(y0,f.yt), Math.min(y1,f.yb)]){ const s = span(y);
        if(s.l - x0 > worst){ worst = s.l - x0; side = 'left'; }
        if(x1 - s.r > worst){ worst = x1 - s.r; side = 'right'; } }
      return { over: +worst.toFixed(1), side };
    };
    const whole = check(T.cx-T.rx, T.cy-T.ry, T.cx+T.rx, T.cy+T.ry);
    const rows = pieces.map((p, i) => { const g = pieceGeom(p), dx = p.dx||0, dy = p.dy||0;
      const r = check(g.cx-g.rx+dx, g.cy-g.ry+dy, g.cx+g.rx+dx, g.cy+g.ry+dy);
      return { i, over: r.over, side: r.side, plating: !!p.plating }; });
    const worst = rows.reduce((a,b) => b.over > a.over ? b : a, { over: 0, side: null });
    return { face: f, faceWxH: (f.xb1-f.xb0)+'x'+(f.yb-f.yt),
      ingredientBox: { x:T.cx-T.rx, y:T.cy-T.ry, w:T.rx*2, h:T.ry*2 },
      whole, pieces: rows.length, worstPiece: worst, rows,
      contained: whole.over <= 0 && worst.over <= 0 };
  },
  scaleReport(){ // the normalized roster: each ingredient's footprint as a % of the board, biggest first
    const B = CONFIG.board;
    const rows = Object.keys(CONFIG.INGREDIENTS).map(id => {
      const g = CONFIG.INGREDIENTS[id].geom;
      return { ing: id, k: ingScale[id], w: +(2*g.rx/B.w*100).toFixed(1), h: +(2*g.ry/B.h*100).toFixed(1),
        px: Math.round(2*g.rx)+'x'+Math.round(2*g.ry) };
    }).sort((a,b) => b.w*b.h - a.w*a.h);
    return { board: B.w+'x'+B.h, n: rows.length, rows };
  },
  plateOverflow(){ // worst plated piece extent as a fraction of the rim — >1 means a piece hangs off the plate
    if(!plate) return null;
    const P = CONFIG.plating, cx = T.cx, cy = T.cy + P.PLATE_DY;
    let worst = 0, who = null, serve = 1;
    for(const p of plate.order){
      const a = p.plating, g = pieceGeom(p);
      if(!a) continue;
      serve = Math.min(serve, a.toScale || 1);
      const th = (p.setAngle || 0)*Math.PI/180;
      const half = SILS[g.shape].support(g, Math.cos(th), Math.sin(th)) * (a.toScale || 1);
      const ang = th + a.toRot, px = p.gx + a.toDx, py = p.gy + a.toDy;
      for(const s of [1,-1]){
        const r = Math.hypot((px + s*half*Math.cos(ang) - cx)/P.PLATE_RX, (py + s*half*Math.sin(ang) - cy)/P.PLATE_RY);
        if(r > worst){ worst = r; who = p.src.ing; }
      }
    }
    return { worst: +worst.toFixed(3), serveScale: +serve.toFixed(3), ing: who, n: plate.order.length };
  },

  regress: regressSuite,
  regressStart(){ if(!window.__kcRegressRun){ window.__kcRegressLast = null;
      window.__kcRegressRun = regressSuite().then(r => { window.__kcRegressLast = r; window.__kcRegressRun = null; return r; },
        e => { window.__kcRegressLast = { pass:false, fail:['threw: '+((e&&e.message)||e)] }; window.__kcRegressRun = null; }); }
    return 'started'; },

  reset: testReset,
  /* The peel step's hook: true = shaved (flesh), false = shell on, null = follow the knife (the shell sheds on
     the first pass until the peel gesture ships). */

          opening's savings beat bought: the strongest callback the real content has. */
  const MILES = [
    { bit:1, at:8,  kicker:'THE ROOM COMES BACK',   line:'It\u2019s starting to feel like a real restaurant again.' },
    { bit:2, at:20, kicker:'WORD GETS AROUND',      line:'People are coming back.' },
    { bit:4, at:45, kicker:'SOMETHING WORTH KEEPING', line:'I never thought I\u2019d care this much about this place.' },
    { bit:8, at:70, kicker:'THE LAST WISH',         line:'They would have loved seeing this.' },
  ];

  const CARDS = {
    board: { name:'Basic Cutting Board', tag:'BOUGHT' },
    knife: { name:'Basic Kitchen Knife', tag:'BOUGHT' },
    ing:   { name:'Fresh Ingredients',   tag:'FIRST BATCH' },
  };
  /* The ingredient card paints the REAL ingredients through their own PAINT — the same art the board
     gets. Nothing in the story invents food (§21). */
  function paintIng(cv){
    const ids = ['tomato','cucumber','carrot'].filter(id => CONFIG.INGREDIENTS[id] && PAINT[id]);
    const dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth || 120, h = cv.clientHeight || 54;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    ids.forEach((id, k) => {
      const g = CONFIG.INGREDIENTS[id].geom, cw = w/ids.length, oh = g.overhang || { x:0, y:0 };
      const s = Math.min(cw/((g.rx+oh.x)*2.4), h/((g.ry+oh.y)*2.4));
      c.save(); c.translate(cw*(k+0.5), h/2); c.scale(s, s); c.translate(-g.cx, -g.cy);
      PAINT[id](c, g); c.restore();
    });
  }
  function cardsHTML(list){
    return '<div class="sCards">' + list.map((k, i) => {
      const C2 = CARDS[k], art = k === 'ing' ? '<canvas></canvas>' : ART[k];
      return '<div class="sCard" style="animation-delay:' + (0.25 + i*0.85).toFixed(2) + 's">' + art
        + '<div class="sCardName">' + C2.name + '</div><div class="sCardTag">' + C2.tag + '</div></div>';
    }).join('') + '</div>';
  }
  function dlgHTML(d){
    return '<div class="sDlg' + (d.side === 'you' ? ' you' : '') + '">'
      + '<div class="sDlgArt">' + ART[d.art] + '</div>'
      + '<div class="sBubble" style="animation-delay:.18s"><div class="sWho">' + d.who + '</div>'
      + '<p class="sSay">' + d.say + '</p></div></div>';
  }

  /* particles: fade, drift, sparkle. No skeletal anything (§18). The coins fly INTO the three cards —
     the savings becoming the board, the knife and the first ingredients, which is the whole beat (§9). */
  function fx(kind){
    const host = el('storyFx'), n = kind === 'dust' ? 26 : kind === 'coins' ? 18 : 12;
    const W = host.clientWidth || 400, H = host.clientHeight || 700;
    const targets = kind === 'coins'
      ? [...document.querySelectorAll('.sCard')].map(c => { const r = c.getBoundingClientRect();
          return { x: r.left + r.width/2, y: r.top + r.height*0.42 }; })
      : [];
    for(let i=0;i<n;i++){
      const d = document.createElement('div');
      d.className = 'sFleck ' + (kind === 'dust' ? 'sDust' : kind === 'coins' ? 'sCoin' : 'sSpark');
      if(kind === 'dust'){
        d.style.left = (W*(0.12 + Math.random()*0.76)) + 'px';
        d.style.top  = (H*(0.30 + Math.random()*0.34)) + 'px';
        d.style.setProperty('--dx', ((Math.random()*2-1)*W*0.42).toFixed(0) + 'px');
        d.style.setProperty('--dy', (-40 - Math.random()*130).toFixed(0) + 'px');
      } else if(kind === 'coins'){
        const x0 = W*0.5 + (Math.random()*2-1)*W*0.06, y0 = H*0.70;
        const t = targets.length ? targets[i % targets.length]
                                 : { x: W*0.5, y: H*0.34 };
        d.style.left = x0 + 'px'; d.style.top = y0 + 'px';
        d.style.setProperty('--dx', (t.x - x0 + (Math.random()*2-1)*14).toFixed(0) + 'px');
        d.style.setProperty('--dy', (t.y - y0 + (Math.random()*2-1)*10).toFixed(0) + 'px');
        d.style.animationDelay = (0.2 + (i % targets.length || 0)*0.6 + Math.random()*0.4).toFixed(2) + 's';
        host.appendChild(d);
        continue;
      } else {
        d.style.left = (W*(0.14 + Math.random()*0.72)) + 'px';
        d.style.top  = (H*(0.22 + Math.random()*0.44)) + 'px';
      }
      d.style.animationDelay = (Math.random()*0.9).toFixed(2) + 's';
      host.appendChild(d);
    }
    setTimeout(() => { if(host.childElementCount > 120) host.textContent = ''; }, 2600);
  }

  function clear(){ clearTimeout(timer); clearTimeout(hintT); timer = hintT = null; }
  function render(b){
    const root = el('story');
    root.classList.remove('sFaded','sDecline','sClean','sThrive');
    if(b.tint) root.classList.add(b.tint);
    root.classList.toggle('veil', !!b.veil);
    storyBare = !!b.bare;
    if(b.bare) ghostHand = null;                 // no tutorial hand over a story beat
    if(b.cam) Camera.go(b.cam, 900);
    if(b.onEnter) b.onEnter();
    el('storyFx').textContent = '';
    const st = el('storyStage');
    st.innerHTML = (b.art ? '<div class="sArt' + (b.artClass ? ' ' + b.artClass : '') + '">' + ART[b.art] + '</div>' : '')
      + (b.dlg ? dlgHTML(b.dlg) : '') + (b.cards ? cardsHTML(b.cards) : '');
    const cv = st.querySelector('canvas');
    if(cv) requestAnimationFrame(() => paintIng(cv));
    let d = 0.14, html = '';
    const add = (cls, txt, step) => { html += '<div class="' + cls + '" style="animation-delay:' + d.toFixed(2) + 's">'
      + txt + '</div>'; d += step; };
    if(b.kicker) add('sKicker', b.kicker, 0.5);
    if(b.title)  add('sTitle', b.title, 0.7);
    if(b.step)   add('sStepLabel', b.step, 0.5);
    (b.lines || []).forEach(t => { html += '<p class="sLine" style="animation-delay:' + d.toFixed(2) + 's">'
      + t + '</p>'; d += 0.85; });
    if(b.quote){ d += 0.4; add('sQuote', b.quote, 1.5); }      // the wish gets its own pause (§6)
    el('storyLines').innerHTML = html;
    const bt = el('storyBtns');
    bt.innerHTML = b.btn ? '<button class="sBtn" type="button">' + b.btn + '</button>' : '';
    if(b.btn) bt.firstChild.addEventListener('click', ev => { ev.stopPropagation(); advance(); });
    if(b.fx) setTimeout(() => { if(live) fx(b.fx); }, b.fx === 'coins' ? 520 : 60);   // coins need the cards laid out first
    const settled = Math.round(d*1000) + 500;
    el('storyHint').classList.remove('show');
    if(!b.btn){
      timer = setTimeout(advance, Math.max(b.hold || 0, settled));
      hintT = setTimeout(() => { if(live && !seq[at].btn) el('storyHint').classList.add('show'); },
        Math.min(settled, 1600));
    }
  }
  function advance(){ clear(); at++; if(at >= seq.length) finish(); else render(seq[at]); }
  function run(list, done){
    clear();
    seq = list; at = -1; coda = done || null; live = true; storyLock = true;
    closePantry(); hideResult();
    clearTimeout(msT);                            // a milestone card never sits under a story beat
    el('storyMs').classList.remove('show'); el('storyMs').setAttribute('aria-hidden', 'true');
    document.body.classList.add('storyOn');
    const root = el('story');
    root.classList.add('on'); root.setAttribute('aria-hidden', 'false');
    if(!(list[0] && list[0].cam)) Camera.snap('ROOM');
    advance();
    return list.length;
  }
  function finish(){
    clear();
    live = false; storyLock = false; storyBare = false;
    const root = el('story');
    root.classList.remove('on','veil','sFaded','sDecline','sClean','sThrive');
    root.setAttribute('aria-hidden', 'true');
    el('storyStage').textContent = ''; el('storyLines').textContent = '';
    el('storyBtns').textContent = ''; el('storyFx').textContent = '';
    el('storyHint').classList.remove('show');
    document.body.classList.remove('storyOn');
    const cb = coda; coda = null; if(cb) cb();
  }
  function banner(kicker, line, ms){
    const card = el('storyMsCard'), node = el('storyMs');
    card.querySelector('span').textContent = kicker;
    card.querySelector('p').textContent = line;
    node.classList.add('show'); node.setAttribute('aria-hidden', 'false');
    clearTimeout(msT);
    msT = setTimeout(() => { node.classList.remove('show'); node.setAttribute('aria-hidden', 'true'); }, ms || 4200);
  }
  function backToKitchen(){ SceneFlow.prep(); }
  function newGame(){
    Store.set(KEY.ms, 0); Store.set(KEY.fin, null);
    return run(OPENING.concat(FRESH, CHEF), () => {
      Store.set(KEY.done, true);
      SceneFlow.prep(); startRecipe(0);          // the story ends ON the first prep, ready to cut
    });
  }

  /* ---- chapters: the prototype's way to walk the whole flow end to end (§22) ---- */
  const CH = [
    { n:'New Game \u00b7 the full opening', t:(OPENING.length + FRESH.length + CHEF.length) + ' BEATS', go:newGame },
    { n:'A Fresh Start \u00b7 restoration', t:FRESH.length + ' BEATS', go:() => run(FRESH, backToKitchen) },
    { n:'The chef \u00b7 first prep', t:CHEF.length + ' BEATS', go:() => run(CHEF, () => { SceneFlow.prep(); startRecipe(0); }) },
  ].concat(MILES.map(m => ({ n:'Milestone \u00b7 ' + m.kicker.toLowerCase(), t:'LEVEL ' + m.at,
      go:() => banner(m.kicker, m.line) })),
    [{ n:'Level 100 \u00b7 the payoff', t:'FINALE', go:() => run(FINALE, backToKitchen) }]);
  function buildChapters(){
    const body = el('chaptersBody');
    body.textContent = '';
    CH.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'chItem'; b.type = 'button';
      b.innerHTML = '<b>' + c.n + '</b><i>' + c.t + '</i>';
      b.addEventListener('click', () => { closeChapters(); c.go(); });
      body.appendChild(b);
    });
  }
  function openChapters(){
    if(!el('chaptersBody').firstChild) buildChapters();
    el('chapters').classList.add('show'); el('chapters').setAttribute('aria-hidden', 'false');
    $('game').classList.add('blur');
  }
  function closeChapters(){
    el('chapters').classList.remove('show'); el('chapters').setAttribute('aria-hidden', 'true');
    $('game').classList.remove('blur');
  }

  return {
    boot(){
      el('story').addEventListener('click', () => { if(live && !seq[at].btn) advance(); });
      el('storyTab').addEventListener('click', openChapters);
      el('chaptersClose').addEventListener('click', closeChapters);
      el('chapters').addEventListener('click', e => { if(e.target === el('chapters')) closeChapters(); });
      if(Store.get(KEY.done) === true) return 'returning';
      newGame();
      return 'opening';
    },
    /* Called after a plate is put away. It reads the EXISTING counter and nothing else: the restaurant's
       journey is the preps the player has already done, reinterpreted (§12). */
    flush(){
      if(live || Store.get(KEY.done) !== true) return null;
      const n = Save.played();
      if(n >= 100 && Store.get(KEY.fin) !== true){ Store.set(KEY.fin, true); run(FINALE, backToKitchen); return 'finale'; }
      let mask = intOr(Store.get(KEY.ms), 0);
      for(const m of MILES) if(n >= m.at && !(mask & m.bit)){
        Store.set(KEY.ms, mask | m.bit); banner(m.kicker, m.line); return 'milestone.' + m.at;
      }
      return null;
    },
    newGame, chapters: openChapters, banner,
    level(){ return Save.played(); },
    play(name){ const m = { opening:OPENING, fresh:FRESH, chef:CHEF, finale:FINALE }[name];
      return m ? run(m, backToKitchen) : null; },
    skip(){ if(live) finish(); return live; },
    report(){ return { live, beat: at, beats: seq.length, level: Save.played(),
      introDone: Store.get(KEY.done) === true, milestones: intOr(Store.get(KEY.ms), 0),
      finaleSeen: Store.get(KEY.fin) === true, bare: storyBare, locked: storyLock }; },
  };
})();

startRecipe(0);
SceneFlow.begin();                 // §62: which path this load takes — decided once, by the save, before frame 1
Story.boot();                      // the narrative layer, around the game: a new player meets the restaurant first

/* ---------- main loop ---------- */
// Only the newest instance of this script may paint or accept input. Re-running the script (hot reload, a second
// script tag, a re-injected preview) otherwise leaves a zombie RAF loop repainting a stale board: cuts land and
// sound plays in the live instance while the canvas shows an untouched ingredient.
const MY_GEN = (window.__kcGen = (window.__kcGen || 0) + 1);
function isStale(){ return MY_GEN !== window.__kcGen; }
let hiddenSince = null; // set ONLY by visibilitychange — never polled from document.hidden, which some hosts report
                        // true while still pumping, rendering and taking input (polling it hung the loop)
/* Measurement only, set by regressSuite and nothing else. The payoff sequence deliberately WAITS while the
   document is hidden (§18), which is right on a phone and makes the sequence unmeasurable in a preview whose
   iframe is backgrounded the whole time: the suite would report the shipped behaviour as seven failures. With
   this true the clock keeps running; shipped behaviour is untouched, and the flag is reported alongside the run. */
let measureFg = false;
let rafId = 0;
function schedule(){ if(!rafId && !isStale()) rafId = requestAnimationFrame(frame); }
function frame(now){
  rafId = 0;
  if(isStale()) return; // a newer instance took over; this loop stops here
  try { step(now); } catch(err){ window.__kcError = (err && err.stack) || String(err); throw err; }
  schedule();
}
// Painting must not depend on animation frames alone: a hidden or throttled document suspends them, and the game
// then takes input and plays audio while the canvas holds a stale frame — cuts appear to do nothing. Any input, a
// visibility change, or the watchdog paints directly, so what you hear always matches what you see.
function pump(){
  if(isStale()) return;
  const t = performance.now();
  if(t - lastFrame > 40){ try { step(t); } catch(err){ window.__kcError = (err && err.stack) || String(err); } }
  schedule();
}
// The watchdog belongs to THIS generation: without the self-clear, a re-injected script leaves one interval per
// generation ticking forever — each pump() no-ops on isStale(), but the timers themselves accumulate.
const pumpTimer = setInterval(() => { if(isStale()){ clearInterval(pumpTimer); return; } pump(); }, 100);
// Time spent backgrounded is discounted so absolute deadlines (the replay hold, the plating flight, each piece's
// settle) survive an app-switch. Pumped frames while hidden are accounted for in step(); this adds only the residue
// since the last pumped frame — adding the whole span here would double-count it and rewind the clock too far.
document.addEventListener('visibilitychange', () => {
  if(isStale()) return;                     // a stale generation must not rewind the live instance's clock
  if(document.hidden){ if(hiddenSince == null) hiddenSince = performance.now(); return; }
  if(hiddenSince != null){ frozenAccum += Math.max(0, performance.now() - lastFrame); hiddenSince = null; }
  lastFrame = performance.now() - 16;
  pump();
});
function step(now){
  const dt = now - lastFrame;
  if(freezeUntil){ // hitstop accounting: overlap of this frame with the freeze window
    const a = Math.max(lastFrame, freezeFrom), b = Math.min(now, freezeUntil);
    if(b > a) frozenAccum += b - a;
    if(now >= freezeUntil){ freezeFrom = 0; freezeUntil = 0; }
  }
  lastFrame = now;
  checkSize();                    // covers hosts without ResizeObserver: the first non-zero layout re-measures
  if(dt > 0){ fpsEMA = fpsEMA*0.92 + (1000/dt)*0.08; if(dt > worstDt) worstDt = dt; }
  Flow.tick(Math.min(dt, 100));   // a backgrounded gap must not fast-forward the room
  IdleState.tick(now, Math.min(dt, 100));  // §7: ten quiet seconds and the room is simply there to be looked at
  SceneFlow.tick(now);            // §62: the intro pushes in, or a player's first touch does it for them
  Camera.tick(now, Math.min(dt, 100));
  KitchenScene.tick(Math.min(dt, 100));
  Audio.cadenceTick();            // the mix model ticks with or without audio, so it is always measurable
  if(pendingEventTs != null){
    const sample = now - pendingEventTs;
    latencyEMA = latencyEMA==null ? sample : latencyEMA*0.85 + sample*0.15;
    pendingEventTs = null;
  }
  // stalled movement decays velocity to zero — a paused stroke must not carry stale speed into blur or audio
  const lastPt = stroke && stroke.pts.length ? stroke.pts[stroke.pts.length-1] : null;
  if(!lastPt || now - lastPt.t > CONFIG.input.VEL_IDLE_MS) velEMA *= Math.pow(CONFIG.input.VEL_DECAY, Math.max(1, dt)/16);
  // While backgrounded no game time passes, so the sequence cannot advance unseen: gating on the transition-tracked
  // flag (not on document.hidden) keeps the replay hold, plating flight and piece settles waiting for the player.
  if(phase === 'paused' || (hiddenSince != null && !measureFg)) frozenAccum += dt;
  else if(phase === 'sequence') advanceSequence();
  else if(phase === 'handoff') advanceHandoff();
  draw(now, now - frozenAccum);
  updateDebug(now);
}
schedule();
</script>
</body>
</html>
