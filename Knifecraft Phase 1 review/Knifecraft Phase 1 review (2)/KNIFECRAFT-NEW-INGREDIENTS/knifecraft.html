function tryTap(p, t, axisOverride){
  if(!insideSil(p.x, p.y)){ logStroke({ dom:'tap', axis:CONFIG.recipe.CUT_AXIS, reason:'off-ingredient' }); return; }
  const axis0 = liveAxis(axisOverride || CONFIG.recipe.CUT_AXIS); // a short stroke keeps the axis it was aiming at
  const d = dirSnap(axis0, 0);                                   // a tap has no direction: it follows the set
  const axis = d ? d.axis : axis0, slope = d ? d.slope : 0;
  const c = d ? interceptThrough(axis, slope, p.x, p.y) : (axis==='h' ? p.y : p.x);
  const cut = placeCut(axis, c, slope, { t, vel: CONFIG.audio.tapVel, px: p.x, py: p.y, verb: 'tap' });
  if(cut){ // tap verb: the knife performs one short downward chop onto the landing line
    const ly = cut.axis==='h' ? cut.c + cut.slope*(p.x-T.cx) : p.y;
    const lx = cut.axis==='h' ? p.x : cut.c + cut.slope*(p.y-T.cy);
    knife = { mode:'tap', phase:'chop', chopT: performance.now(), x: lx, y: ly, rot: 0, targetRot: 0, dirSign: 1, shineT: -1e9, trail: [] };
  }
}
/* Direction snapping (§49). Julienne wants cuts parallel to EACH OTHER, not to a predetermined axis — an axis
   lock contradicted the free-angle principle. The first cut of the set is placed exactly as drawn; every later
   cut inherits its direction while keeping the position the player chose along the perpendicular. A grid is the
   same rule with two directions: cut 1, and its perpendicular. */

const interceptThrough = (axis, slope, x, y) => axis==='h' ? y - slope*(x - T.cx) : x - slope*(y - T.cy);
function dirSnap(fitAxis, fitSlope){
  const R = CONFIG.recipe;
  if(!CONFIG.assist.JULIENNE_PARALLEL_SNAP || (!R.PARALLEL_SNAP && !R.PERP_SNAP)) return null;
  if(!cuts.length) return null;               // cut 1 belongs to the player: any angle, placed as drawn
  let d = { axis: cuts[0].axis, slope: cuts[0].slope };
  if(R.PERP_SNAP){                            // pick whichever of the two sets the stroke was aiming at
    const p = perpOf(d), a = lineAngleOf(fitAxis, fitSlope);
    if(angleApart(lineAngleOf(p.axis, p.slope), a) < angleApart(lineAngleOf(d.axis, d.slope), a)) d = p;
    if(axisFull(d.axis) && !axisFull(perpOf(d).axis)) d = perpOf(d); // a finished set never swallows a stroke
  }

}
function fitStroke(pts){ // least-squares fit + angle snap — shared by the committed cut and the live pre-score
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const xExt = Math.max(...xs)-Math.min(...xs), yExt = Math.max(...ys)-Math.min(...ys);
  // nearest-axis snapping: the stroke's dominant direction picks the axis, exact ties go to the recipe axis,
  // so a 45° stroke resolves to whichever axis it leans toward instead of becoming an unplaceable diagonal
  const axis = liveAxis(CONFIG.recipe.SINGLE_AXIS ? CONFIG.recipe.CUT_AXIS
    : (xExt === yExt ? CONFIG.recipe.CUT_AXIS : (xExt > yExt ? 'h' : 'v')));
  const iv = axis==='h' ? xs : ys, dv = axis==='h' ? ys : xs;
  const mi = mean(iv), md = mean(dv);
  let sii=0, sid=0;
  for(let k=0;k<iv.length;k++){ sii += (iv[k]-mi)*(iv[k]-mi); sid += (iv[k]-mi)*(dv[k]-md); }
  if(sii < 1) return null;
  const fitB = sid/sii;
  const center = axis==='h' ? T.cx : T.cy;
  const c = md + fitB*(center - mi);
  const A = CONFIG.assist;
  const angIn = Math.atan(Math.abs(fitB)) * 180/Math.PI;
  let slope;
  // A light assist, not a cliff: the old flat 70% pull over a 12–30° window flattened a deliberate 30° stroke to 10°
  // and jumped to full freedom at 30.1°. The pull now tapers to zero by ANGLE_FREE_DEG — continuous at both ends.
  if(!CONFIG.recipe.FREE_ANGLE) slope = 0;
  else if(angIn <= A.ANGLE_SNAP_DEG) slope = 0;
  else if(angIn < A.ANGLE_FREE_DEG) slope = fitB * (angIn - A.ANGLE_SNAP_DEG)/(A.ANGLE_FREE_DEG - A.ANGLE_SNAP_DEG);
  else slope = fitB;

  if(d){ // the set's direction wins; the player's position along the perpendicular is kept exactly
    const mx = mean(xs), my = mean(ys);
    return { axis: d.axis, c: interceptThrough(d.axis, d.slope, mx, my), slope: d.slope, angIn,
      iv: d.axis==='h' ? xs : ys, xs, ys, xExt, yExt, snapped: true };

/* Every stroke records what it decided and why. Rejections used to be silent, which read on device as

let strokeLog = null;
function logStroke(o){ strokeLog = Object.assign({ t: Math.round(performance.now()) % 100000 }, o); }
function trySwipe(rawPts){
  const f = fitStroke(rawPts);
  if(!f){ // degenerate fit (a near-stationary stroke): land it at the midpoint rather than swallowing the input
    const mid = rawPts[Math.floor(rawPts.length/2)];
    logStroke({ dom:'?', axis:'?', reason:'degenerate-fit\u2192tap' });
    tryTap({ x: mean(rawPts.map(p=>p.x)), y: mean(rawPts.map(p=>p.y)) }, mid.t);
    return;
  }
  const axis = f.axis, c = f.c, iv = f.iv, xs = f.xs, ys = f.ys;
  const dom = f.xExt === f.yExt ? 'tie' : (f.xExt > f.yExt ? 'h' : 'v');
  const midT = rawPts[Math.floor(rawPts.length/2)].t;
  // Coverage is measured along the STROKE'S OWN LINE. Measuring the axis-aligned span instead made a steep
  // diagonal near a thin shape's edge look uncovered — it barely spans the axis while fully crossing the food.
  const ch = cutChord(axis, c, f.slope);
  const ps = ch ? xs.map((x,i) => ch.proj(x, ys[i])) : null;
  const overlap = ch ? Math.min(Math.max(...ps), ch.hi) - Math.max(Math.min(...ps), ch.lo) : 0;
  const cov = ch ? +(overlap / ch.len).toFixed(2) : 0;
  if(!ch || cov < CONFIG.input.minCoverage){
    logStroke({ dom, ext:`${Math.round(f.xExt)}x${Math.round(f.yExt)}`, axis, cov, reason:'coverage-fallback\u2192tap on ' + axis });
    tryTap({ x: mean(xs), y: mean(ys) }, midT, axis);
    return;
  }
  const end = rawPts[rawPts.length-1], start = rawPts[0];
  logStroke({ dom, ext:`${Math.round(f.xExt)}x${Math.round(f.yExt)}`, axis, cov, cRaw:Math.round(c), reason:'swipe' });
  placeCut(axis, c, f.slope, {
    t: midT, vel: swipeVelocity(rawPts), px: end.x, py: end.y, verb: 'swipe', angIn: f.angIn,
    rev: (axis==='h' ? end.x >= start.x : end.y >= start.y) ? 1 : -1,
    preK: (preScore && preScore.axis === axis) ? clamp01(preScore.b - preScore.a) : 0,
  });
}
function swipeVelocity(pts){
  if(pts.length < 2) return 0.5;
  let d=0; for(let i=1;i<pts.length;i++) d += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
  const dt = (pts[pts.length-1].t - pts[0].t) || 1;
  return clamp01((d/dt) / 3.2);

/* ---------- placement: shared resolver (ghost + cuts use the SAME math — the preview is always truthful) ---------- */
function sameAxisConflict(axis, c, slope, skip){
  const ext = axis==='h' ? T.rx : T.ry, tol = CONFIG.assist.PARALLEL_TOL_DEG * Math.PI/180, gap = minGap(axis, slope);
  for(const e of cuts){
    if(e === skip || e.axis !== axis) continue;
    // two cuts at clearly different angles are meant to cross — that is an X, not a mistake
    if(CONFIG.recipe.FREE_ANGLE && Math.abs(Math.atan(slope) - Math.atan(e.slope)) > tol) continue;
    const dA = (c - slope*ext) - (e.c - e.slope*ext);
    const dB = (c + slope*ext) - (e.c + e.slope*ext);
    if(Math.sign(dA) !== Math.sign(dB) || Math.min(Math.abs(dA), Math.abs(dB)) < gap) return e;
  }

function cutChord(axis, c, slope){ // the run of FOOD along the cut line itself — the honest denominator for coverage
  const sp = seamSpan({ axis, c, slope });
  const dx = sp.x1 - sp.x0, dy = sp.y1 - sp.y0, L = Math.hypot(dx, dy) || 1;
  const ux = dx/L, uy = dy/L, N = 160;

  }

  return { lo: a*L, hi: b*L, len: Math.max(1, (b-a)*L),

// The edge margin yields to the direction for exactly the reason the gap does: a direction that can only hold
// 8px of spacing cannot also reserve 12px of edge, and reserving it anyway pushed the outermost ideal cut
// outside the placeable band — a refusal at a position the game itself calls ideal.

    return { lo: bd.lo + m, hi: bd.hi - m };

  // for an angle the player chose. Convert the group's perpendicular half-span into an intercept range instead.
  const nrm = Math.hypot(1, slope);

  // two neighbours and commit a cut still in conflict — two strokes landed on the SAME line, one silently wasted.
  for(let d = 2; d <= hi - lo; d += 2){    for(const cand of [c + d, c - d]){

/* ---------- pieces: half-plane partition; settle begins after the cut opens ---------- */
function regionGeom(cons){ // centroid by grid sample — existence is decided analytically, never by whether the grid happened to hit
  const step = CONFIG.render.pieceSampleStep;

      // where the span crosses gaps — without it a leaf piece's centroid drifts into empty air.
      if(insideSil(x,y) && containsPoint(cons, x, y)){ n++; sx+=x; sy+=y; hits.push(x, y); }

     between them. (gx,gy) is the pivot plating rotates and scales about, so an off-food pivot swings the
     fragment around nothing. Snap to the nearest sampled interior point. A convex body's mean is always
     inside its own region, so this never fires for ellipse, capsule or taper — existing food is untouched. */

/* ---------- scoring ---------- */
function cutAngleDeg(cut){ // the LINE's direction, folded into [-90,90) — what "parallel" means for grading

  if(phase !== 'sequence' || !CONFIG.recipes.SEQUENCE_SKIPPABLE) return;
  const gn = gameNow(), P = CONFIG.plating;
  replay = null;
  if(!plate) startPlating(gn);
  plate.t0 = gn - P.PLATE_IN_MS;
  for(const p of plate.order){ if(p.plating){ p.plating.t0 = gn - P.PLATE_FLIGHT_MS; p.plating.chimed = true; } }
  Audio.plateSettle(plate.order.length-1);
  hands = null; plate.taken = true; SceneFlow.taken();   // a skip takes the plate too: the board is never left dressed
  showResult();
}
function setPaused(on){
  if(on){ if(phase==='paused') return; pausedFrom = phase; phase = 'paused'; }
  else if(phase === 'paused'){ phase = pausedFrom || 'cutting'; }
  document.getElementById('paused').classList.toggle('show', phase === 'paused');
}

/* ---------- plating: the emotional payoff (§4) ---------- */
function platingRefinement(){ // one value shapes the whole arrangement: tighter with Evenness, never ugly
  const ev = gradeInfo ? gradeInfo.evenness : 70;
  return clamp01((ev - 35) / 60);
}
function platingList(){ return harvest.concat(pieces); } // harvested ingredients rejoin for one combined plating
function zoneFor(stage, nStages){ // a single ingredient owns the plate; a prep divides it into ingredient zones
  const P = CONFIG.plating;
  if(nStages <= 1) return { x: T.cx, y: T.cy + 6, s: 1, ps: 1 };
  const z = P.GARDEN_ZONES[Math.min(stage, P.GARDEN_ZONES.length-1)];
  // ps scales the PIECES too: packing three ingredients tighter is not enough — full-size slices collide
  return { x: T.cx + z.dx, y: T.cy + 6 + z.dy, s: z.s, ps: z.ps };
}
/* One arrangement per ingredient shape. Each takes the pieces of one stage and returns where they land; the
   cascade generalizes because it steps along that set's own normal, so nothing here knows about angles.
   SPACING COMES FROM THE PIECE, not from px constants: the ingredient's extent across the cut direction over
   the number of pieces IS a piece's thickness, so every arrangement holds its character whether it is dressing
   ten carrot batons or two peach halves. */
function pieceStep(list, z, div){
  const p0 = list[0], g = pieceGeom(p0), th = (p0.setAngle || 0)*Math.PI/180;
  const across = SILS[g.shape].support(g, -Math.sin(th), Math.cos(th));
  return Math.max(5, 2*across/Math.max(1, div || list.length)) * (z.ps || 1);
}
const ARRANGE = {
  fan(list, z, refine, P, jit){ // tomato: an overlapping cascade, like a fanned deck
    const slope = list[0].setSlope || 0, axis = list[0].setAxis || 'h';
    const th = axis==='h' ? Math.atan(slope) : Math.atan2(1, slope);
    const dirx = Math.cos(th), diry = Math.sin(th), nx = -diry, ny = dirx;
    const fit = (0.72 + 0.28/Math.hypot(1, slope)) * z.s;
    const sorted = list.slice().sort((a,b) => axis==='h' ? a.gy - b.gy : a.gx - b.gx);
    const n = sorted.length, step = pieceStep(sorted, z)*(0.85 + 0.15*refine)*fit;
    return sorted.map((p, i) => {
      const s = i - (n-1)/2, u = n > 1 ? s/((n-1)/2) : 0;
      return { p,
        x: z.x + s*step*(P.CASCADE_ACROSS_F*nx + P.CASCADE_ALONG_F*dirx) + (Math.random()*2-1)*jit,
        y: z.y + s*step*(P.CASCADE_ACROSS_F*ny + P.CASCADE_ALONG_F*diry) + (Math.random()*2-1)*jit*0.5,
        rot: u*P.CASCADE_ROT + (Math.random()*2-1)*0.05*(1-refine) };
    });
  },
  shingle(list, z, refine, P, jit){ // cucumber: a climbing row of discs — deliberate, never a stack
    const axis = list[0].setAxis || 'v';
    const sorted = list.slice().sort((a,b) => axis==='h' ? a.gy - b.gy : a.gx - b.gx);
    const n = sorted.length, th = -0.30;
    const step = pieceStep(sorted, z)*P.SHINGLE_STEP_F*z.s*(0.86 + 0.14*refine);
    return sorted.map((p, i) => {
      const s = i - (n-1)/2;
      return { p, x: z.x + Math.cos(th)*s*step + (Math.random()*2-1)*jit*0.5,
        y: z.y + Math.sin(th)*s*step + (Math.random()*2-1)*jit*0.4,
        rot: P.SHINGLE_ROT*(i%2 ? 1 : -1)*(1 - 0.45*refine) };
    });
  },
  nest(list, z, refine, P, jit){ // julienne: a loose bundle — batons roughly aligned, crossing at shallow angles
    const sorted = list.slice().sort((a,b) => a.gx - b.gx);
    const n = Math.max(1, sorted.length), th = -0.42;
    const step = pieceStep(sorted, z)*P.NEST_STEP_F*z.s;
    return sorted.map((p, i) => {
      const s = i - (n-1)/2, off = (i%2 ? 1 : -1)*step*0.55*(1 - 0.4*refine);
      return { p, x: z.x + Math.cos(th)*s*step - Math.sin(th)*off + (Math.random()*2-1)*jit*0.5,
        y: z.y + Math.sin(th)*s*step + Math.cos(th)*off + (Math.random()*2-1)*jit*0.35,
        rot: th + P.NEST_ROT*Math.sin(i*2.1)*(1.1 - 0.4*refine) };
    });
  },
  mound(list, z, refine, P, jit){ // dice: a neat mound, pieces settling with slight scatter
    const sorted = list.slice().sort((a,b) => (a.gy - b.gy) || (a.gx - b.gx));
    const n = sorted.length, cols = Math.max(1, Math.round(Math.sqrt(n))), rows = Math.ceil(n/cols);
    const sp = pieceStep(sorted, z, cols)*P.MOUND_STEP_F*z.s*(1 - 0.12*refine);
    return sorted.map((p, i) => {
      const col = (i%cols) - (cols-1)/2, row = Math.floor(i/cols) - (rows-1)/2;
      return { p, x: z.x + col*sp + (Math.random()*2-1)*jit*0.6,
        y: z.y + row*sp*0.68 + (Math.random()*2-1)*jit*0.5,
        rot: P.MOUND_ROT*Math.sin(i*1.9)*(1 - 0.4*refine) };
    });
  },
};
/* A piece's long axis runs ALONG its set's cut direction, so its length is the ingredient's reach in that
   direction — 210px for a carrot cut crosswise, 56px cut lengthwise. The plate ARRANGES that; it does not
   redefine how big the food is. So overflow is answered in one order: compress the composition about the plate
   centre (the pieces keep their size and overlap more, which is what a plated portion does), and only when a
   single piece still reaches past the rim does a serving trim shrink the pieces — clamped near 1. */
function plateFit(targets, z){
  const P = CONFIG.plating, cx = T.cx, cy = T.cy + P.PLATE_DY;
  const rx = P.PLATE_RX*P.PLATE_FILL, ry = P.PLATE_RY*P.PLATE_FILL;
  const zx = P.PLATE_RX*P.PLATE_ZONE, zy = P.PLATE_RY*P.PLATE_ZONE;
  const items = targets.map(t => {
    const g = pieceGeom(t.p), th = (t.p.setAngle || 0)*Math.PI/180, a = th + t.rot;
    return { half: SILS[g.shape].support(g, Math.cos(th), Math.sin(th)) * (z.ps || 1),
             ca: Math.cos(a), sa: Math.sin(a), ox: t.x - cx, oy: t.y - cy };
  });
  let pos = 1, scale = 1, centres = 0;
  for(const it of items) centres = Math.max(centres, Math.hypot(it.ox/zx, it.oy/zy));
  if(centres > 1) pos = Math.max(P.PLATE_POS_MIN, 1/centres);   // the composition sits inside the serving zone
  const worst = () => {
    let w = 0;
    for(const it of items) for(const s of [1,-1])
      w = Math.max(w, Math.hypot((it.ox*pos + s*it.half*scale*it.ca)/rx,
                                 (it.oy*pos + s*it.half*scale*it.sa)/ry));
    return w;
  };
  for(let i=0;i<24;i++){
    const w = worst();
    if(w <= 1.002) break;
    if(pos > P.PLATE_POS_MIN) pos = Math.max(P.PLATE_POS_MIN, pos/w);
    else if(scale > P.PLATE_SERVE_MIN) scale = Math.max(P.PLATE_SERVE_MIN, scale/w);
    else break;
  }
  return { pos, scale };
}
function startPlating(at){
  const P = CONFIG.plating, refine = platingRefinement();
  const all = platingList(), nStages = curRecipe().stages.length;
  const jit = P.PLATE_REFINEMENT_RANGE * (1 - refine);
  const byStage = new Map();
  for(const p of all){ const k = p.stage || 0; if(!byStage.has(k)) byStage.set(k, []); byStage.get(k).push(p); }
  const order = [];
  for(const k of [...byStage.keys()].sort((a,b) => a-b)){
    const list = byStage.get(k), z = zoneFor(k, nStages);
    const style = ARRANGE[list[0].plateStyle] ? list[0].plateStyle : 'fan';
    const targets = ARRANGE[style](list, z, refine, P, jit);
    const fit = plateFit(targets, z), pcx = T.cx, pcy = T.cy + P.PLATE_DY;
    targets.forEach((t, gi) => {
      const p = t.p;
      p.t0 = null;
      p.plating = { idx: gi, chimed: false, t0: 0,   // the chime ladder climbs within each ingredient
        fromDx: p.dx, fromDy: p.dy, fromRot: p.rot || 0, toScale: (z.ps || 1) * fit.scale,
        toDx: pcx + (t.x-pcx)*fit.pos - p.gx, toDy: pcy + (t.y-pcy)*fit.pos - p.gy, toRot: t.rot };
      order.push(p);
    });
  }
  const n = order.length;
  const stag = Math.min(P.PLATE_STAGGER_MS, P.PLATE_STAGGER_SPAN_MS/Math.max(1, n-1));
  order.forEach((p, i) => { p.plating.t0 = at + P.PLATE_IN_MS*0.45 + i*stag; });
  plate = { t0: at, order,
    endAt: at + P.PLATE_IN_MS*0.45 + (n-1)*stag + P.PLATE_FLIGHT_MS + P.PLATE_SETTLE_MS };
  SceneFlow.plating();          // ≤6% push: plating is already the payoff, the camera only supports it
}
function animPlating(p, gnow){
  const P = CONFIG.plating, a = p.plating;
  const k = clamp01((gnow - a.t0)/P.PLATE_FLIGHT_MS), e = easeOut(k);
  p.dx = a.fromDx + (a.toDx - a.fromDx)*e;
  p.dy = a.fromDy + (a.toDy - a.fromDy)*e - P.PLATE_ARC_PX*Math.sin(Math.PI*k);
  p.rot = a.fromRot + (a.toRot - a.fromRot)*e;
  p.scale = 1 + ((a.toScale || 1) - 1)*e;      // pieces settle to plate scale as they fly — depth, not a pop
  p.lift = Math.sin(Math.PI*k);
  if(k >= 1 && !a.chimed){ a.chimed = true; Audio.plateSettle(a.idx); }
}

/* ---------- result screen (§5): the delta is the headline ---------- */
const $ = id => document.getElementById(id);
const STARS = { Masterful:5, Clean:4, Honest:3, Rustic:2, Learning:1 };
function countUp(el, to, suffix, prefix){
  const ms = CONFIG.result.COUNTUP_MS, t0 = performance.now();
  if(el.__iv) clearInterval(el.__iv);
  el.__iv = setInterval(() => {
    const k = clamp01((performance.now() - t0)/ms);
    el.textContent = (prefix||'') + Math.round(to*easeOut(k)) + (suffix||'');
    if(k >= 1){ clearInterval(el.__iv); el.__iv = 0; }
  }, 16);
}
function showResult(){
  if(phase === 'result') return;
  phase = 'result';
  if(Camera.state() !== 'ROOM') SceneFlow.taken();             // the result is always read from the room
  const R = CONFIG.result, g = gradeInfo, id = CONFIG.recipe.id;
  const prevBest = Save.best(id);
  const improved = prevBest != null && g.overall > prevBest;
  const runIndex = Save.bumpPlayed();
  Save.touchDay();
  Spirit.grow(g.grade);                                       // the kitchen is warmer next time. Never announced (§24)
  SceneMemory.completeFirst();                                // §5: the first plate is taken — the room is theirs now
  KitchenScene.prewarm();                                     // pay for it behind the result card, never mid-cut
  const sig = g.evenness >= R.SIGNATURE_THRESHOLD && g.consistency >= R.SIGNATURE_THRESHOLD; // Rhythm is a bonus: it cannot gate this
  if(sig) Save.bumpSignatures();
  if(prevBest == null || g.overall > prevBest) Save.setBest(id, g.overall);
  const gw = $('gradeWord');
  gw.classList.toggle('sig', sig);
  if(sig) gw.innerHTML = "CHEF'S<br>SIGNATURE";               // two explicit lines: the pressed mark encloses both
  else gw.textContent = g.grade.toUpperCase().split('').join('\u2009');
  gw.style.animation = 'none'; void gw.offsetWidth;
  gw.style.animation = sig ? `stampSig ${R.SIGNATURE_REVEAL_MS}ms ease-out both`
                           : `stampIn ${R.GRADE_REVEAL_MS}ms ease-out both`;
  $('stars').textContent = '\u2605'.repeat(STARS[g.grade] || 1);
  $('rowBest').style.display = prevBest == null ? 'none' : 'flex';
  if(prevBest != null) $('bestVal').textContent = prevBest + '%';
  $('firstPrep').style.display = prevBest == null ? 'block' : 'none'; // first run: no delta, never 0%
  $('deltaLine').style.display = improved ? 'block' : 'none';        // no negative delta is reachable
  countUp($('newVal'), g.overall, '%');
  if(improved) countUp($('deltaLine'), g.overall - prevBest, '%', '\u25b2 +');
  countUp($('evVal'), g.evenness, '%');
  countUp($('cnVal'), g.consistency, '%');
  $('rhVal').textContent = '+' + g.rhythmBonus;                      // a bonus, never a percentage
  setDetails(runIndex <= R.DETAILS_OPEN_RECIPE_LIMIT);               // teaching first, then out of the way
  $('result').classList.add('show');
  $('result').setAttribute('aria-hidden', 'false');
  canvas.classList.add('blur');
  if(sig) Audio.signature();
}
function setDetails(open){
  $('details').classList.toggle('open', open);
  $('detailsToggle').textContent = (open ? '\u25b4' : '\u25be') + ' Details';
}
function hideResult(){
  $('result').classList.remove('show');
  $('result').setAttribute('aria-hidden', 'true');
  canvas.classList.remove('blur');
}
function leaveBoard(){ if(plate && !plate.taken) farewell = { t0: gameNow(), pieces: plate.order.slice() }; }
function prepAgain(){
  const t = performance.now();
  SceneFlow.prep();                            // back to the station, in the same motion language as the intro
  leaveBoard(); hideResult(); startRecipe(recipeIndex);
  Story.flush();                               // §13: a milestone, if this plate crossed one. Never blocks the prep.
  lastRetryMs = +(performance.now() - t).toFixed(1);
  return lastRetryMs;
}
function nextRecipe(){ SceneFlow.prep(); leaveBoard(); hideResult(); startRecipe(recipeIndex + 1, true); Story.flush(); }
function showMyCuts(){
  hideResult();
  replay = { t0: gameNow(), map: true };
  setTimeout(() => { if(phase === 'result'){ $('result').classList.add('show'); canvas.classList.add('blur'); } },
    CONFIG.replay.holdMs + CONFIG.replay.fadeMs + 120);
}
$('prepAgain').addEventListener('click', prepAgain);
$('nextRecipe').addEventListener('click', nextRecipe);
$('detailsToggle').addEventListener('click', () => setDetails(!$('details').classList.contains('open')));
$('showCuts').addEventListener('click', showMyCuts);
$('pause').addEventListener('click', () => { Audio.ensure(); setPaused(phase !== 'paused'); });
$('paused').addEventListener('click', () => setPaused(false));

/* ---------- drawing ---------- */
function draw(now, gnow){
  if(startupMarks.firstDrawAt == null) startupMarks.firstDrawAt = +performance.now().toFixed(1);
  computePreScore();
  KitchenScene.paint(ctx);                       // the Home Kitchen: pre-rendered layers, one blit per frame at rest
  const M = Camera.world();                      // §61: ONE transform — push, pull, parallax. No rotation term exists
  ctx.setTransform(M.a, M.b, M.c, M.d, M.e, M.f);
  syncHud();
  if(camZoom){ // Perfect Slice camera: raw time — it breathes through the freeze
    const el = now - camZoom.t0, Z = CONFIG.perfect.CAMERA_ZOOM_PCT;
    let z = 0;
    if(el < 90) z = Z * easeOut(el/90);
    else if(el < 350) z = Z * (1 - easeOut((el-90)/260));
    else camZoom = null;
    if(camZoom){ ctx.translate(camZoom.x, camZoom.y); ctx.scale(1+z, 1+z); ctx.translate(-camZoom.x, -camZoom.y); }
  }
  ctx.save();
  if(boardNudge){ // impact: felt, not seen
    const k = clamp01((gnow - boardNudge.t0)/CONFIG.physics.BOARD_NUDGE_MS);
    if(k >= 1) boardNudge = null;
    else { // along the cut normal: vertical and horizontal cuts land differently
      const d = CONFIG.physics.BOARD_NUDGE_PX * (1 - easeOut(k));
      ctx.translate(d * (boardNudge.nx || 0), d * (boardNudge.ny == null ? 1 : boardNudge.ny));
    }
  }
  drawBoard();
  /* A story beat may ask for the board BARE: during the opening the kitchen is neglected and there is
     nothing on it yet. One early return — the story never reaches into the food, ghost or knife paths. */
  if(storyBare){ ctx.restore(); return; }
  const carry = handsCarry(gnow);                 // §63: the plate leaves WITH the hands, so the board is clear after
  if(plate && plate.taken) drawFarewell(gnow);
  else {
    ctx.save(); if(carry) ctx.translate(0, carry.dy);
    drawPlate(gnow);
    drawFarewell(gnow);
    drawPieces(gnow);
    ctx.restore();
  }
  drawParticles(gnow);
  drawHands(gnow);
  drawBoardLight();                              // the same two numbers as the window: spirit warms, flow brightens
  ctx.restore();
  drawGhost();
  drawPeel(gnow);
  drawGhostHand(gnow);
  drawPips(gnow);
  drawKnife(now, gnow);
  drawSparks(now);
  drawReplay(gnow);
}
/* THE PEEL OVERLAY. A ring OUTSIDE the silhouette fills as the shell gives way — outside, so it never reads as
   a cut line on the food — plus the prompt under the board and the shreds the hand throws off. Everything here
   is derived from gnow, so a suspended frame cadence cannot leave it half-drawn. */
function drawPeel(gnow){
  if(!peel) return;
  const shedK = peel.done ? clamp01((gnow - peel.doneT) / PEEL_SHED_MS) : 0;
  const tone = PEEL_TONE[peel.ing] || '#8A6A2A';
  for(let i = peel.flecks.length - 1; i >= 0; i--){
    const f = peel.flecks[i], t = gnow - f.t0;
    if(t >= f.life){ peel.flecks.splice(i, 1); continue; }
    const k = t / f.life;
    ctx.save();
    ctx.globalAlpha = (1 - k*k) * 0.9;
    ctx.translate(f.x + f.vx*t, f.y + f.vy*t + 0.00042*t*t);
    ctx.rotate(f.rot + f.spin*t);
    ctx.fillStyle = tone;
    ctx.beginPath(); ctx.ellipse(0, 0, f.w, f.h, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,246,224,0.30)';
    ctx.beginPath(); ctx.ellipse(-f.w*0.25, -f.h*0.3, f.w*0.4, f.h*0.34, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  const fade = peel.done ? 1 - clamp01(shedK*1.6) : 1;
  if(fade <= 0.01) return;
  const p = peel.done ? 1 : peelProgress();
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.lineCap = 'round';
  /* Proportional stand-off, so the ring clears a melon as cleanly as a pineapple, and a light track with a
     warm arc rather than the fruit's own colour — a dark-green arc on a dark-green rind read as nothing. */
  const off = clamp(Math.max(T.rx, T.ry)*0.16, 26, 52);
  ctx.strokeStyle = 'rgba(24,16,10,0.30)'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.ellipse(T.cx, T.cy, T.rx + off, T.ry + off, 0, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,250,238,0.55)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(T.cx, T.cy, T.rx + off, T.ry + off, 0, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#FFC24A'; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.ellipse(T.cx, T.cy, T.rx + off, T.ry + off, 0, -Math.PI/2, -Math.PI/2 + Math.PI*2*p);
  ctx.stroke();
  const label = peel.done ? 'Peeled' : (p > 0.02 ? 'Keep rubbing' : 'Rub to peel');
  const ly = Math.min(T.cy + T.ry + off + 40, 748);
  ctx.font = '600 30px ui-rounded, "Avenir Next", system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(28,18,10,0.34)'; ctx.fillText(label, T.cx + 1, ly + 2);
  ctx.fillStyle = 'rgba(255,250,238,0.96)'; ctx.fillText(label, T.cx, ly);
  ctx.restore();
}
function drawPlateShape(a){ // cream ceramic, soft shadow, subtle rim — one fixed plate, whatever was cut
  const P = CONFIG.plating, cx = T.cx, cy = T.cy + P.PLATE_DY, rx = P.PLATE_RX, ry = P.PLATE_RY;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(60,40,24,0.26)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
  const g = ctx.createLinearGradient(cx-rx, cy-ry, cx+rx, cy+ry);
  g.addColorStop(0,'#FFFDF9'); g.addColorStop(0.55,'#F5EFE4'); g.addColorStop(1,'#E7DECF');
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a*0.85;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx*0.86, ry*0.82, 0, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(120,104,84,0.15)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(120,104,84,0.20)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}
function drawPlate(gnow){ // slides in beneath the pieces as they lift
  if(!plate) return;
  const k = easeOut(clamp01((gnow - plate.t0)/CONFIG.plating.PLATE_IN_MS));
  if(k <= 0) return;
  ctx.save(); ctx.translate(0, 16*(1-k)); drawPlateShape(k); ctx.restore();
}
function drawFarewell(gnow){ // the finished prep leaves the board rather than vanishing
  if(!farewell) return;
  const k = clamp01((gnow - farewell.t0)/CONFIG.recipes.INGREDIENT_EXIT_MS);
  if(k >= 1){ farewell = null; return; }
  const e = easeOut(k);
  ctx.save(); ctx.translate(0, 46*e);
  if(!farewell.noPlate) drawPlateShape(1 - e);
  for(const p of farewell.pieces){
    ctx.save();
    ctx.globalAlpha = 1 - e;
    ctx.translate(p.dx, p.dy);
    if(p.rot || p.scale){ ctx.translate(p.gx, p.gy); ctx.rotate(p.rot||0); if(p.scale) ctx.scale(p.scale, p.scale); ctx.translate(-p.gx, -p.gy); }
    ctx.clip(silPath(pieceGeom(p), 1.5));
    for(const cn of p.cons) clipHalfPlane(cn);
    drawIngredient(p.src);
    ctx.restore();
  }
  ctx.restore();
}
/* ---------- §63 the chef's hands: the loop closes when someone takes the plate ----------
   HANDS ONLY — no face, no body, no silhouette; the chef as a character, and every word of praise, is 5E. Canvas
   drawn from the existing palette, sleeve in desaturated cream, entering from above the frame and leaving with the
   plate. Slow in (decelerating), deliberate at the rim, quicker away — the plate is gone, not snatched. */
function handsPose(gnow){
  if(!hands) return null;
  const S = CONFIG.sceneflow, TR = S.HANDS_TRAVEL_PX;

    c2.fillStyle = stg; c2.fill(st);
    c2.save(); c2.clip(st);

       across the left/right rails so they follow the taper and the lean instead of running parallel. */
    c2.lineCap = 'round';
    for(let k=0;k<6;k++){
      const f0 = 0.09 + k*0.165, ph = 1.7 + k*2.1, amp = 0.020 + 0.014*((k*37)%5)/5;
      const lit = f0 < 0.42;

        for(let s=0;s<left.length;s++){
          const t = s/(left.length-1);
          const f = Math.min(0.97, Math.max(0.03, f0 + off + amp*Math.sin(t*5.6 + ph)));
          const a = left[s], b = right[s];
          const x = a[0] + (b[0]-a[0])*f, y = a[1] + (b[1]-a[1])*f;

    }
    for(let i=0;i<30;i++){                            // woody blotching, large enough to read at play scale

      const m = mid[Math.min(mid.length-1, Math.floor(h1*mid.length))];
      const px = m[0] + (h2-0.5)*m[2]*1.6, py = m[1] + (h3-0.5)*m[2]*1.2;

    cap.lineTo(lt[0], lt[1]);
    cap.lineTo(lt[0] + Math.sin(nrm)*tm[2]*0.10, lt[1] - Math.cos(nrm)*tm[2]*0.10);
    cap.lineTo(rt[0] + Math.sin(nrm)*tm[2]*0.14, rt[1] - Math.cos(nrm)*tm[2]*0.14);
    cap.closePath();
    const cg = c2.createLinearGradient(rt[0], rt[1], lt[0], lt[1]);
    cg.addColorStop(0,'#4C5230'); cg.addColorStop(0.45,'#696C42'); cg.addColorStop(1,'#50552F');
    c2.fillStyle = cg; c2.fill(cap);
    c2.save(); c2.clip(cap);
    c2.strokeStyle = 'rgba(30,36,16,0.34)'; c2.lineWidth = 2.2;
    for(const f of [0.30, 0.58, 0.80]){
      const x = rt[0] + (lt[0]-rt[0])*f, y = rt[1] + (lt[1]-rt[1])*f;
      c2.beginPath(); c2.moveTo(x, y); c2.lineTo(x + Math.sin(nrm)*tm[2]*0.34, y - Math.cos(nrm)*tm[2]*0.34);
      c2.stroke();

/* GINGER, ONE ROUTINE, TWO SKINS. A hand of ginger is the same picture peeled or not — same knobs, same ring
   ridges, same nodes — so the body is drawn ONCE here and the palette is passed in: PAINT.ginger is the PEELED
   rhizome (the base sprite) and SKIN.ginger is the tan corky shell over it, which is the pineapple/mango
   arrangement and costs the cut model nothing.
   A cluster silhouette is one subpath PER LOBE, so stroking it outlines every ellipse, buried parts included —
   which reads as a heap of glass tubes. The rim is therefore laid down first and then BURIED: stroke all lobes,
   then paint the interior clipped to the union INSET by that stroke, so only the outer edge survives. */
function gingerBody(c2, g, P){
  const sil = silPath(g, 0);
  const lobe = (b, sx, sy) => { const p = new Path2D();
    p.ellipse(g.cx+b.dx, g.cy+b.dy, b.rx*sx, b.ry*sy, b.rot||0, 0, Math.PI*2); return p; };
  const lobeIn = (b, d) => { const p = new Path2D();
    p.ellipse(g.cx+b.dx, g.cy+b.dy, Math.max(2, b.rx-d), Math.max(2, b.ry-d), b.rot||0, 0, Math.PI*2);
    return p; };
  const RIM = 3;
  c2.strokeStyle = P.rim; c2.lineWidth = RIM;
  for(const b of g.leaves) c2.stroke(lobe(b, 1, 1));
  const inner = new Path2D();
  for(const b of g.leaves) inner.addPath(lobeIn(b, RIM*0.5));
  c2.save(); c2.clip(inner);
  const bg = c2.createLinearGradient(g.cx-g.rx*0.4, g.cy-g.ry, g.cx+g.rx*0.3, g.cy+g.ry);
  bg.addColorStop(0, P.base[0]); bg.addColorStop(0.34, P.base[1]);
  bg.addColorStop(0.70, P.base[2]); bg.addColorStop(1, P.base[3]);
  c2.fillStyle = bg; c2.fill(sil);
  for(const b of g.leaves){                     // each knob swells; its edge stays CLOSE to the mid tone, or
    const ox = g.cx+b.dx, oy = g.cy+b.dy;       // every lobe wears a dark ring and the hand falls apart
    c2.save(); c2.clip(lobeIn(b, RIM*0.5));
    const dome = c2.createRadialGradient(ox-b.rx*0.20, oy-b.ry*0.56, b.ry*0.05, ox, oy+b.ry*0.30, b.rx*1.05);
    dome.addColorStop(0, P.dome[0]); dome.addColorStop(0.42, P.dome[1]);
    dome.addColorStop(0.82, P.dome[2]); dome.addColorStop(1, P.dome[3]);
    c2.fillStyle = dome; c2.fill(lobe(b, 1, 1));
    c2.translate(ox, oy); c2.rotate(b.rot||0);  // ring ridges: at the joints and the tips, not ruled evenly
    const bands = b.tip ? 4 : 3;
    for(let i=0;i<bands;i++){
      const lx = b.rx*(b.tip ? 0.22 + i*0.18 : -0.52 + i*0.20);

    }

  /* CONTACT SHADOWS: a finger casts its shadow on the body JUST OUTSIDE its own outline, so the dark is a
     narrow annulus hugging the finger, clipped to the body lobe it grows from. Filling the whole overlap
     greys out half the rhizome; stroking the outline reads as loose sausages. */

    if(!f.tip) continue;
    for(const b of g.leaves){
      if(!b.mass) continue;
      c2.save(); c2.clip(lobeIn(b, RIM*0.5));
      for(const [o, i2, a] of [[1.07, 1.00, 0.30], [1.15, 1.07, 0.17], [1.24, 1.15, 0.08]]){

  for(const b of g.leaves){                     // a blunt, slightly paler finger end
    if(!b.tip) continue;

    const sx = g.cx + b.dx + (b.dx/m)*b.rx*0.46, sy = g.cy + b.dy + (b.dy/m)*b.ry*0.46;
    const ng = c2.createRadialGradient(sx-b.ry*0.10, sy-b.ry*0.14, 1, sx, sy, b.ry*0.62);
    ng.addColorStop(0, P.node[0]); ng.addColorStop(0.58, P.node[1]); ng.addColorStop(1, P.node[2]);
    c2.fillStyle = ng;
    c2.beginPath(); c2.ellipse(sx, sy, b.ry*0.42, b.ry*0.30, b.rot||0, 0, Math.PI*2); c2.fill();
    c2.strokeStyle = P.ridge; c2.lineWidth = 1.4;
    c2.beginPath(); c2.ellipse(sx, sy, b.ry*0.50, b.ry*0.37, b.rot||0, 0, Math.PI*2); c2.stroke();
  }
  if(P.freckle) for(let i=0;i<70;i++){          // corky freckles: the SHELL has them, the shaved flesh does not
    const a = i*2.399, r = Math.sqrt((i+0.5)/70);
    const x = g.cx + Math.cos(a)*g.rx*r*0.94, y = g.cy + Math.sin(a)*g.ry*r*0.94;
    c2.fillStyle = i%3 ? P.freckle[0] : P.freckle[1];
    c2.beginPath(); c2.ellipse(x, y, 2 + (i%4)*0.55, 1.3 + (i%3)*0.45, a, 0, Math.PI*2); c2.fill();
  }
  /* ONE LIGHT over the whole hand: eight per-lobe domes are eight little suns. A multiply pass grades the
     finished body across a single upper-left source. */
  c2.globalCompositeOperation = 'multiply';
  const glob = c2.createLinearGradient(g.cx-g.rx*0.8, g.cy-g.ry, g.cx+g.rx*0.8, g.cy+g.ry);
  glob.addColorStop(0, P.grade[0]); glob.addColorStop(0.44, P.grade[1]);
  glob.addColorStop(0.80, P.grade[2]); glob.addColorStop(1, P.grade[3]);
  c2.fillStyle = glob; c2.fill(sil);
  c2.globalCompositeOperation = 'source-over';
  const shade = c2.createLinearGradient(g.cx, g.cy+g.ry*0.04, g.cx, g.cy+g.ry);
  shade.addColorStop(0, P.under.replace('$A', 0)); shade.addColorStop(1, P.under.replace('$A', 0.40));
  c2.fillStyle = shade; c2.fill(sil);
  const lit = c2.createLinearGradient(g.cx-g.rx*0.5, g.cy-g.ry, g.cx+g.rx*0.15, g.cy+g.ry*0.05);
  lit.addColorStop(0, P.sheen.replace('$A', 0.30)); lit.addColorStop(1, P.sheen.replace('$A', 0));
  c2.fillStyle = lit; c2.fill(sil);
  c2.restore();
}
const PAINT = {

  ginger(c2, g){

      occl:  'rgba(150,118,40,$A)',

  tomato(c2, g){

      const sg = c2.createLinearGradient(0, -L.ry, 0, L.ry);
      sg.addColorStop(0,'#8AA85E'); sg.addColorStop(0.5,'#6E8C48'); sg.addColorStop(1,'#546E36');

      c2.strokeStyle = 'rgba(226,240,205,0.20)'; c2.lineWidth = 1.1;  // side veins: a suggestion, not a diagram

    c2.fillStyle = stain; c2.beginPath();
    c2.ellipse(g.cx, g.cy, g.rx*0.34, g.ry*0.38, 0.18, 0, Math.PI*2); c2.fill();
    const sg = c2.createLinearGradient(g.cx-g.rx*0.20, g.cy-g.ry*0.20, g.cx+g.rx*0.20, g.cy+g.ry*0.20);
    sg.addColorStop(0,'#A6462C'); sg.addColorStop(0.5,'#8E3524'); sg.addColorStop(1,'#73281B');
    c2.fillStyle = sg; c2.fill(st);
    c2.strokeStyle = 'rgba(52,18,12,0.34)'; c2.lineWidth = 1.4;   // furrows: a one-sided fan, never a rosette
    for(let i=0;i<7;i++){ const a = -1.0 + i*0.32;
      c2.beginPath();
      c2.moveTo(g.cx + Math.cos(a)*g.rx*0.04, g.cy + Math.sin(a)*g.ry*0.05);
      c2.quadraticCurveTo(g.cx + Math.cos(a)*g.rx*0.17, g.cy + Math.sin(a)*g.ry*0.20,
                          g.cx + Math.cos(a)*g.rx*0.24, g.cy + Math.sin(a)*g.ry*0.29);
      c2.stroke(); }
    c2.strokeStyle = 'rgba(58,20,14,0.45)'; c2.lineWidth = 2; c2.stroke(st);   // hard vector rim on the stone
    const feather = c2.createRadialGradient(g.cx, g.cy, g.rx*0.58, g.cx, g.cy, g.rx*0.90);
    feather.addColorStop(0,'rgba(244,150,96,0)'); feather.addColorStop(1,'rgba(244,150,96,0.30)');
    c2.fillStyle = feather; c2.fill(silPath(flesh, 0));           // warms the flesh INTO the skin: kills plateau 3
    c2.restore();
    /* SKIN, painted last through an even-odd annulus so the flesh cannot eat it. */
    const ring = new Path2D();
    ring.addPath(silPath(g, 0)); ring.addPath(silPath(flesh, 0));
    c2.save(); c2.clip(ring, 'evenodd');
    const bx = g.cx - g.rx*0.62, by = g.cy - g.ry*0.52;           // focused ON the ring, not on the fruit centre
    const blush = c2.createRadialGradient(bx, by, g.rx*0.04, bx, by, g.rx*1.30);
    blush.addColorStop(0,'rgba(232,96,52,0.90)'); blush.addColorStop(0.34,'rgba(228,104,56,0.70)');
    blush.addColorStop(0.62,'rgba(226,120,66,0.36)'); blush.addColorStop(0.86,'rgba(228,140,80,0.12)');
    blush.addColorStop(1,'rgba(230,150,88,0)');
    c2.fillStyle = blush; c2.fill(silPath(g, 0));
    for(let i=0;i<64;i++){                                        // mottling, densest where the blush fades out
      const a = i*2.399963, r = 0.70 + 0.30*((i*7919 % 53)/53);
      c2.fillStyle = i % 2 ? 'rgba(198,74,38,0.14)' : 'rgba(252,190,138,0.16)';
      c2.beginPath();
      c2.arc(g.cx + Math.cos(a)*g.rx*0.94*r, g.cy + Math.sin(a)*g.ry*0.94*r,
             1.8 + 2.6*((i*6151 % 23)/23), 0, Math.PI*2);
      c2.fill();
    }
    const cx0 = g.cx - g.rx*0.30;                                 // suture: continuous across the whole ring
    c2.strokeStyle = 'rgba(186,74,36,0.46)'; c2.lineWidth = 5; c2.lineCap = 'round';
    c2.beginPath(); c2.moveTo(cx0 + g.rx*0.16, g.cy - g.ry*1.02);
    c2.quadraticCurveTo(cx0 - g.rx*0.16, g.cy, cx0 + g.rx*0.14, g.cy + g.ry*1.02); c2.stroke();
    c2.strokeStyle = 'rgba(255,214,168,0.42)'; c2.lineWidth = 2.6;
    c2.beginPath(); c2.moveTo(cx0 + g.rx*0.23, g.cy - g.ry*1.0);
    c2.quadraticCurveTo(cx0 - g.rx*0.09, g.cy, cx0 + g.rx*0.21, g.cy + g.ry*1.0); c2.stroke();
    const fuzz = c2.createRadialGradient(g.cx, g.cy, g.rx*0.66, g.cx, g.cy, g.rx*1.02);
    fuzz.addColorStop(0,'rgba(255,232,200,0)'); fuzz.addColorStop(1,'rgba(255,232,200,0.26)');
    c2.fillStyle = fuzz; c2.fill(silPath(g, 0));
    c2.restore();
    const sheen = c2.createRadialGradient(g.cx-g.rx*0.44, g.cy-g.ry*0.50, g.rx*0.03, g.cx-g.rx*0.38, g.cy-g.ry*0.44, g.rx*0.44);
    sheen.addColorStop(0,'rgba(255,246,230,0.30)'); sheen.addColorStop(1,'rgba(255,246,230,0)');
    c2.fillStyle = sheen; c2.fill(silPath(g, 0));
    c2.restore();
    c2.strokeStyle = 'rgba(184,64,30,0.42)'; c2.lineWidth = 2.2; c2.stroke(silPath(g, 0));
  },
  /* CORN — the identity is a LATTICE, so the lattice is the paint. Staggered rows (every other row offset by
     half a kernel), each kernel individually toned by its distance from the lit band a third of the way down,
     with index-derived jitter on top. Uniformly coloured kernels read as bubble wrap. */
  corn(c2, g){
    /* Stalk stub off the butt — cosmetic overhang (geom.overhang), like celery's crown: no cut, span or piece
       sees it, and it sheds on the first cut. Drawn first so the cob's own edge covers the joint. */
    {
      const bx = g.cx - g.rx*0.96, L = 44, h0 = 17, h1 = 11, dy = 5;
      const p = new Path2D();
      p.moveTo(bx, g.cy - h0); p.quadraticCurveTo(bx - L*0.55, g.cy - h1*1.1 + dy*0.5, bx - L, g.cy - h1 + dy);
      p.quadraticCurveTo(bx - L*1.06, g.cy + dy, bx - L, g.cy + h1 + dy);
      p.quadraticCurveTo(bx - L*0.55, g.cy + h1*1.1 + dy*0.5, bx, g.cy + h0);
      p.closePath();
      const sg = c2.createLinearGradient(bx, g.cy - h0, bx, g.cy + h0);
      sg.addColorStop(0,'#A9C566'); sg.addColorStop(0.42,'#8CAF4C'); sg.addColorStop(1,'#5E8232');
      c2.fillStyle = sg; c2.fill(p);
      c2.strokeStyle = 'rgba(70,98,38,0.55)'; c2.lineWidth = 1.8; c2.stroke(p);
    }
    const cob = c2.createLinearGradient(g.cx, g.cy-g.ry, g.cx, g.cy+g.ry);
    cob.addColorStop(0,'#E8CE7C'); cob.addColorStop(0.42,'#D8B75E'); cob.addColorStop(1,'#A98A42');
    c2.fillStyle = cob; c2.fill(silPath(g, 0));
    c2.save(); c2.clip(silPath(g, 0));
    const TONE = ['#FFF3AC','#FCE68C','#F5D66E','#E4C158','#C9A344','#AC8A38'];
    const COLS = 17, ROWS = 7, kw = (g.rx*2/COLS)*0.50, kh = (g.ry*2/ROWS)*0.54;
    for(let r=0;r<ROWS;r++){
      const fy = (r+0.5)/ROWS;
      const shade = Math.min(1, Math.abs(fy-0.32)*1.75);          // lit band high on the barrel, falls to both rims
      for(let i=0;i<COLS;i++){
        const fx = (i + 0.5 + (r%2 ? 0.5 : 0))/COLS, x = g.cx - g.rx + fx*g.rx*2;
        /* Rows ride the TAPER, as celery's ribs do. A flat grid on a narrowing cob puts whole kernels outside
           the silhouette and the clip bites them in half, which reads as a lattice printed on a cob rather
           than kernels wrapped around one. Half-height at this x sets both the row's y and the kernel's size. */
        const h = taperH(g, x); if(h <= 0) continue;
        const sq = h/g.ry, y = taperY(g, x) - h + fy*h*2;
        const seed = (r*131 + i*7919) % 97;
        const ti = Math.max(0, Math.min(TONE.length-1, Math.round(shade*(TONE.length-1) + ((seed%5)-2)*0.35)));
        c2.fillStyle = TONE[ti];
        c2.beginPath(); c2.ellipse(x, y, kw*(0.94 + (seed%7)/70), kh*sq*(0.94 + (seed%5)/60), 0, 0, Math.PI*2);
        c2.fill();
        c2.fillStyle = 'rgba(255,252,224,' + (0.34 - shade*0.22).toFixed(3) + ')';
        c2.beginPath(); c2.ellipse(x - kw*0.26, y - kh*sq*0.30, kw*0.42, kh*sq*0.38, -0.5, 0, Math.PI*2); c2.fill();
        c2.strokeStyle = 'rgba(140,102,30,0.22)'; c2.lineWidth = 1;   // the gap between kernels
        c2.beginPath(); c2.ellipse(x, y, kw, kh*sq, 0, 0, Math.PI*2); c2.stroke();
      }
    }
    const shade = c2.createLinearGradient(g.cx, g.cy-g.ry, g.cx, g.cy+g.ry);
    shade.addColorStop(0,'rgba(120,88,26,0.22)'); shade.addColorStop(0.34,'rgba(120,88,26,0)');
    shade.addColorStop(1,'rgba(120,88,26,0.30)');
    c2.fillStyle = shade; c2.fill(silPath(g, 0));                    // barrel roundness, over the lattice
    const ends = c2.createLinearGradient(g.cx-g.rx, g.cy, g.cx-g.rx*0.80, g.cy);
    ends.addColorStop(0,'rgba(246,236,196,0.66)'); ends.addColorStop(1,'rgba(246,236,196,0)');
    c2.fillStyle = ends; c2.fill(silPath(g, 0));                     // pale cob stub, butt end
    c2.restore();
    c2.strokeStyle = 'rgba(146,106,32,0.38)'; c2.lineWidth = 1.8; c2.stroke(silPath(g, 0));
  },
  /* CELERY — a BUNCH, per the reference: four bundled ribs, glossy and pale, with dark serrated leaf tops at
     the narrow end and a blanched butt at the wide one. The previous pass painted one C-channelled stick with
     seven rib STRINGS on it, and strings on a single body is the wrong model — a bunch's ribs are separate
     solids that overlap, so each rib is filled as its own tapering band (dark edges, bright glossy core, hard
     seam against its neighbour) rather than stroked as a line. The channel wash is gone with it: the gloss on
     four rounded ribs already refuses the pale-cucumber read the old trough was fighting off alone. */
  celery(c2, g){
    const body = c2.createLinearGradient(g.cx, g.cy-g.rBig, g.cx, g.cy+g.rBig);
    body.addColorStop(0,'#CFE39C'); body.addColorStop(0.42,'#AECB72'); body.addColorStop(1,'#7E9C48');
    c2.fillStyle = body; c2.fill(silPath(g, 0));
    const inner = innerGeom(g, 7);
    const ig = c2.createLinearGradient(g.cx, g.cy-g.rBig, g.cx, g.cy+g.rBig);
    ig.addColorStop(0,'#ECF4CC'); ig.addColorStop(0.48,'#D6E5A2'); ig.addColorStop(1,'#A8C06E');
    c2.save(); c2.clip(silPath(g, 0));
    c2.fillStyle = ig; c2.fill(silPath(inner, 0));
    /* Ribs ride the taper (taperH/taperY), as corn's kernel rows do — a band at a flat fraction of rBig would
       run outside the narrow end and get bitten off by the clip, which reads as stripes printed on a stick.
       Each rib also BOWS slightly and by a different amount, because the ribs in a real bunch splay. The bands
       leave a GAP between them and both their edges are seamed, so what separates two ribs is a groove with a
       shadow in it rather than one shared line. */
    const RIBS = [[-1.00,-0.56,0.030],[-0.46,-0.04,-0.018],[0.06,0.48,0.022],[0.58,1.00,-0.026]];
    const edge = (x, f) => taperY(g, x) + f*taperH(g, x);
    RIBS.forEach(([a, b, bow], k) => {
      const band = new Path2D(), x0 = g.cx - g.rx*0.995, x1 = g.cx + g.rx*0.995, N = 26;
      for(let i=0;i<=N;i++){ const x = x0 + (x1-x0)*(i/N), s = Math.sin((i/N)*Math.PI);
        const y = edge(x, a + bow*s); i ? band.lineTo(x,y) : band.moveTo(x,y); }
      for(let i=N;i>=0;i--){ const x = x0 + (x1-x0)*(i/N), s = Math.sin((i/N)*Math.PI);
        band.lineTo(x, edge(x, b + bow*s)); }
      band.closePath();
      const yA = edge(g.cx, a), yB = edge(g.cx, b);
      const rg = c2.createLinearGradient(g.cx, yA, g.cx, yB);
      const dark = k < 2 ? '#93B45C' : '#84A44F';
      rg.addColorStop(0, dark); rg.addColorStop(0.28,'#C6DE90'); rg.addColorStop(0.46,'#E6F3BC');
      rg.addColorStop(0.66,'#C2DA8A'); rg.addColorStop(1, dark);
      c2.fillStyle = rg; c2.fill(band);
      c2.save(); c2.clip(band);                                     // specular streak, tight along the crown
      const gl = c2.createLinearGradient(g.cx, yA + (yB-yA)*0.30, g.cx, yA + (yB-yA)*0.62);
      gl.addColorStop(0,'rgba(255,255,240,0)'); gl.addColorStop(0.5,'rgba(255,255,240,0.55)');
      gl.addColorStop(1,'rgba(255,255,240,0)');
      c2.fillStyle = gl; c2.fill(band);
      c2.restore();
      c2.strokeStyle = 'rgba(96,126,54,0.55)'; c2.lineWidth = 2.2;   // both seams: the groove either side of it
      [a, b].forEach(f => {
        c2.beginPath();
        for(let i=0;i<=N;i++){ const x = x0 + (x1-x0)*(i/N), s = Math.sin((i/N)*Math.PI);
          const y = edge(x, f + bow*s); i ? c2.lineTo(x,y) : c2.moveTo(x,y); }
        c2.stroke();
      });
      /* STRINGS — the fibres that run the length of a rib. Faint and INSIDE the band (never at its edges, where
         they would double the seam), a few per rib, so a rib reads as fibrous celery rather than a gel band. */
      c2.save(); c2.clip(band);
      for(let s2=0;s2<3;s2++){
        const f = a + (b-a)*(0.26 + s2*0.24 + ((k*7+s2*13)%5)/70);
        c2.strokeStyle = s2 === 1 ? 'rgba(255,255,236,0.34)' : 'rgba(118,148,68,0.26)';
        c2.lineWidth = s2 === 1 ? 1.6 : 1.2;
        c2.beginPath();
        for(let i=0;i<=N;i++){ const x = x0 + (x1-x0)*(i/N), sn = Math.sin((i/N)*Math.PI);
          const y = edge(x, f + bow*sn) + Math.sin(i*0.9 + k)*0.6; i ? c2.lineTo(x,y) : c2.moveTo(x,y); }
        c2.stroke();
      }
      c2.restore();
    });
    const base = c2.createLinearGradient(g.cx-g.rx, g.cy, g.cx-g.rx*0.34, g.cy);
    base.addColorStop(0,'rgba(252,252,228,0.82)'); base.addColorStop(1,'rgba(252,252,228,0)');
    c2.fillStyle = base; c2.fill(silPath(g, 0));                   // blanched butt, wide end
    c2.fillStyle = 'rgba(96,124,52,0.05)';                         // fine grain, subordinate
    for(let i=0;i<90;i++){ const a = i*2.399963, r = Math.sqrt((i*6151 % 79)/79);
      c2.beginPath();
      c2.ellipse(g.cx + Math.cos(a)*g.rx*0.90*r, g.cy + Math.sin(a)*g.rBig*0.80*r, 5, 0.9, 0.04, 0, Math.PI*2);
      c2.fill(); }
    c2.restore();
    c2.strokeStyle = 'rgba(88,116,48,0.42)'; c2.lineWidth = 1.8; c2.stroke(silPath(g, 0));
    /* LEAF TOPS — cosmetic, past the silhouette (geom.overhang), so they change no cut, span or piece. They are
       the loudest cue in the reference: a bushy dark crown against pale ribs. Two things had to be right. The
       TOOTHING first: a high-frequency ruffle turned every blade into a spiky diamond — holly, not celery — so
       the teeth are coarse and shallow over three ROUNDED lobes, which is what a celery leaflet actually is.
       Then DEPTH: one fan of blades reads as a paper cutout, so a darker, wider back row sits behind a lighter
       front row and the crown has a mass instead of an outline. */
    const tipX = g.cx + g.rx*0.90;
    /* THE JOINT. Previously every blade grew from one point at tipX, so the crown met the bunch at a bald hinge
       — the defect in the reference crop. In a real bunch each RIB carries its own petiole on out of the stalk,
       so the branches are drawn from the rib ends themselves: a tapering stalk per rib, curving into the fan,
       painted before the blades so the leaves sit on top of their own stems. */
    RIBS.forEach(([a, b, bow], k) => {
      const mid = (a + b)/2, sx = g.cx + g.rx*0.93, sy = edge(sx, mid + bow*0.3);
      const ex = tipX + 30 + k*6, ey = g.cy + (mid)*42 - 6;
      const wid = 7.5 - Math.abs(mid)*2.2;
      const p = new Path2D();
      p.moveTo(sx, sy - wid);
      p.quadraticCurveTo((sx+ex)/2 + 6, sy - wid*0.7 + (ey-sy)*0.34, ex, ey - wid*0.42);
      p.lineTo(ex, ey + wid*0.42);
      p.quadraticCurveTo((sx+ex)/2 + 6, sy + wid*0.7 + (ey-sy)*0.34, sx, sy + wid);
      p.closePath();
      const pg = c2.createLinearGradient(sx, sy - wid, sx, sy + wid);
      pg.addColorStop(0,'#6E9C42'); pg.addColorStop(0.42,'#9CC663'); pg.addColorStop(1,'#4F7A31');
      c2.fillStyle = pg; c2.fill(p);
      c2.strokeStyle = 'rgba(58,90,34,0.45)'; c2.lineWidth = 1.3; c2.stroke(p);
    });
    const blade = (len, wid, ph) => {
      const p = new Path2D(), M = 34;
      const w = t => wid*Math.sin(Math.pow(t,0.9)*Math.PI)*(1 + 0.34*Math.sin(t*Math.PI*2.6));
      p.moveTo(0, 0);
      for(let s=1;s<=M;s++){ const t = s/M;
        p.lineTo(w(t)*(1 + 0.08*Math.sin(t*10 + ph)), -t*len); }
      for(let s=M;s>=1;s--){ const t = s/M;
        p.lineTo(-w(t)*(1 + 0.08*Math.sin(t*10 + ph*1.6 + 2.1)), -t*len); }
      p.closePath();
      return p;
    };
    const ROWS = [
      { back:1, leaves:[[-1.30,116,-38],[-0.80,134,-20],[-0.26,142,-2],[0.30,130,19],[0.84,109,36]] },
      { back:0, leaves:[[-1.02,99,-29],[-0.50,120,-13],[0.02,128,3],[0.50,113,20],[1.04,91,33],[-0.18,80,-40],[0.22,76,40]] },
    ];
    ROWS.forEach(row => row.leaves.forEach(([rot, len, dy], i) => {
      c2.save(); c2.translate(tipX, g.cy + dy); c2.rotate(rot + Math.PI/2);
      c2.strokeStyle = row.back ? '#6D9448' : '#8FB45C'; c2.lineWidth = 4; c2.lineCap = 'round';
      c2.beginPath(); c2.moveTo(0, 6); c2.lineTo(0, -len*0.30); c2.stroke();        // petiole
      c2.translate(0, -len*0.28);
      const bl = blade(len*0.78, len*0.34, i*1.7 + row.back*0.9);
      const lg = c2.createLinearGradient(-len*0.4, 0, len*0.4, -len*0.6);
      if(row.back){ lg.addColorStop(0,'#2F6522'); lg.addColorStop(0.6,'#3C7628'); lg.addColorStop(1,'#2A5C1E'); }
      else { lg.addColorStop(0, i % 2 ? '#59993A' : '#4E8C31'); lg.addColorStop(0.55,'#68A648');
             lg.addColorStop(1,'#3C7528'); }
      c2.fillStyle = lg; c2.fill(bl);
      if(!row.back){ c2.strokeStyle = 'rgba(34,72,22,0.34)'; c2.lineWidth = 1.1; c2.stroke(bl); }
      if(!row.back){
        c2.strokeStyle = 'rgba(198,226,152,0.50)'; c2.lineWidth = 1.5;              // midrib
        c2.beginPath(); c2.moveTo(0, 0); c2.lineTo(0, -len*0.64); c2.stroke();
      }
      c2.restore();
    }));
  },
  /* MOZZARELLA — cheddar's opposite from the same larder: no planes, no rind, one wet sphere. Two speculars
     (a tight one and a broad one) plus a damp rim; the interior is DENSER and MATTE via innerGeom, so a slice
     opens onto a dull face. A cut that revealed more shine would read as a lit ball with a line drawn on it. */
  mozzarella(c2, g){
    const skin = c2.createRadialGradient(g.cx-g.rx*0.30, g.cy-g.ry*0.40, g.rx*0.10, g.cx, g.cy, g.rx*1.10);
    skin.addColorStop(0,'#FFFFFB'); skin.addColorStop(0.50,'#F7F5EA'); skin.addColorStop(0.86,'#E4E1D0');
    skin.addColorStop(1,'#CDCAB6');
    c2.fillStyle = skin; c2.fill(silPath(g, 0));
    const curd = innerGeom(g, 14);
    const cg = c2.createRadialGradient(g.cx-g.rx*0.14, g.cy-g.ry*0.10, g.rx*0.06, g.cx, g.cy, g.rx*0.96);
    cg.addColorStop(0,'#FDFCF4'); cg.addColorStop(0.62,'#F4F2E6'); cg.addColorStop(1,'#E7E4D4');
    c2.save(); c2.clip(silPath(g, 0));
    c2.fillStyle = cg; c2.fill(silPath(curd, 0));
    c2.save(); c2.clip(silPath(curd, 0));
    /* The earlier note here said a mozzarella has no texture and any mark on it reads as debris. That was true
       of a SPHERE — a featureless ball offers a mark nothing to belong to. This body is formed by hand, and the
       reference is covered in the evidence: broad soft FOLDS sweeping around the belly where the curd was
       gathered, low BUMPS between them, and a pinched knot. Those are not marks on a surface, they are the
       surface's own shape, so each one is painted as a shadow/light PAIR (dark on the far side of the fold, a
       pale roll on the near side) instead of a line. Lines still don't belong; form does. */
    const foldAt = (fx, fy, len, ang, curveAmt, str) => {
      /* A fold is a change in the SURFACE, not a mark on it — stroked creases came back as embossed curls,
         which is the failure the old note warned about wearing a new coat. So each fold is a pair of long,
         soft gradient LOBES along the same axis: shadow on the far side, a lit roll on the near side, both
         with a falloff that never resolves to an edge. Read as form; invisible as line. */
      c2.save(); c2.translate(fx, fy); c2.rotate(ang);
      const half = len/2, th = Math.abs(curveAmt);
      const lobe = (offY, stops, h) => {
        const gr = c2.createLinearGradient(0, offY - h, 0, offY + h);
        stops.forEach(([o, col]) => gr.addColorStop(o, col));
        c2.fillStyle = gr;
        c2.beginPath(); c2.ellipse(0, offY, half, h, 0, 0, Math.PI*2); c2.fill();
      };
      lobe(th*0.34, [[0,`rgba(198,193,169,0)`],[0.5,`rgba(198,193,169,${0.26*str})`],[1,'rgba(198,193,169,0)']], th*0.85);
      lobe(-th*0.52, [[0,'rgba(255,255,252,0)'],[0.5,`rgba(255,255,252,${0.44*str})`],[1,'rgba(255,255,252,0)']], th*0.70);
      c2.restore();
    };
    foldAt(g.cx-g.rx*0.26, g.cy+g.ry*0.16, g.rx*1.20, -0.22, g.ry*0.34, 1.00);
    foldAt(g.cx+g.rx*0.10, g.cy+g.ry*0.52, g.rx*1.00, -0.10, g.ry*0.26, 0.78);
    foldAt(g.cx-g.rx*0.10, g.cy-g.ry*0.44, g.rx*1.05,  0.14, g.ry*0.24, 0.66);
    const bump = (bx, by, rr, rot, str) => {                              // low knobs between the folds
      const lo = c2.createRadialGradient(bx+rr*0.34, by+rr*0.40, rr*0.05, bx, by, rr);
      lo.addColorStop(0, `rgba(198,193,169,${0.26*str})`); lo.addColorStop(1,'rgba(198,193,169,0)');
      c2.save(); c2.translate(bx, by); c2.rotate(rot); c2.translate(-bx, -by);
      c2.fillStyle = lo; c2.beginPath(); c2.ellipse(bx, by, rr, rr*0.72, 0, 0, Math.PI*2); c2.fill();
      const hi = c2.createRadialGradient(bx-rr*0.30, by-rr*0.34, rr*0.04, bx-rr*0.20, by-rr*0.22, rr*0.80);
      hi.addColorStop(0, `rgba(255,255,252,${0.52*str})`); hi.addColorStop(1,'rgba(255,255,252,0)');
      c2.fillStyle = hi; c2.beginPath(); c2.ellipse(bx, by, rr, rr*0.72, 0, 0, Math.PI*2); c2.fill();
      c2.restore();
    };
    bump(g.cx-g.rx*0.44, g.cy-g.ry*0.16, g.rx*0.30, -0.24, 1.00);
    bump(g.cx+g.rx*0.10, g.cy-g.ry*0.02, g.rx*0.26,  0.30, 0.82);
    bump(g.cx-g.rx*0.10, g.cy+g.ry*0.44, g.rx*0.22, -0.10, 0.70);
    bump(g.cx+g.rx*0.40, g.cy+g.ry*0.22, g.rx*0.18,  0.44, 0.60);
    for(let i=0;i<14;i++){                                          // whey pockets: small, wet, irregular
      const a = i*2.399963 + 0.8, r = Math.sqrt((i*6151 % 61)/61);
      const x = g.cx + Math.cos(a)*g.rx*0.58*r, y = g.cy + Math.sin(a)*g.ry*0.58*r;
      const rad = 2.0 + 2.6*((i*104729 % 23)/23);
      c2.fillStyle = 'rgba(222,218,196,0.24)';
      c2.beginPath(); c2.ellipse(x, y, rad, rad*0.68, a, 0, Math.PI*2); c2.fill();
      c2.fillStyle = 'rgba(255,255,252,0.32)';
      c2.beginPath(); c2.ellipse(x - rad*0.28, y - rad*0.26, rad*0.46, rad*0.32, a, 0, Math.PI*2); c2.fill();
    }
    c2.fillStyle = 'rgba(228,224,202,0.18)';
    for(let i=0;i<56;i++){ const a = i*2.399963, r = Math.sqrt((i*7919 % 67)/67);
      c2.beginPath();
      c2.arc(g.cx + Math.cos(a)*g.rx*0.74*r, g.cy + Math.sin(a)*g.ry*0.74*r, 1.5, 0, Math.PI*2); c2.fill(); }
    c2.restore();
    /* THE KNOT at the narrow end — where the ball was pinched off the rope. Radiating creases drew a literal
       arrow glyph; what the reference actually shows is a small CAP of curd sitting proud of the body, so it
       is one soft crescent shadow across the neck with a lit dome beyond it. Painted inside the silhouette:
       no span, no piece, no cut sees it. */
    const kx = g.cx + g.rx*0.66, ky = taperY(g, kx), kh = taperH(g, kx) || g.ry*0.5;
    c2.save(); c2.clip(silPath(g, 0));
    const neck = c2.createLinearGradient(kx - g.rx*0.16, ky, kx + g.rx*0.10, ky);
    neck.addColorStop(0,'rgba(206,201,178,0)'); neck.addColorStop(0.55,'rgba(200,195,171,0.34)');
    neck.addColorStop(1,'rgba(206,201,178,0)');
    c2.fillStyle = neck;
    c2.beginPath(); c2.ellipse(kx - g.rx*0.03, ky, g.rx*0.16, kh*0.98, -0.12, 0, Math.PI*2); c2.fill();
    const cap = c2.createRadialGradient(kx + g.rx*0.16, ky - kh*0.30, 4, kx + g.rx*0.20, ky, g.rx*0.30);
    cap.addColorStop(0,'rgba(255,255,253,0.70)'); cap.addColorStop(0.6,'rgba(255,255,252,0.22)');
    cap.addColorStop(1,'rgba(255,255,252,0)');
    c2.fillStyle = cap; c2.fill(silPath(g, 0));
    c2.restore();
    const wet = c2.createRadialGradient(g.cx-g.rx*0.36, g.cy-g.ry*0.42, g.rx*0.02, g.cx-g.rx*0.32, g.cy-g.ry*0.38, g.rx*0.34);
    wet.addColorStop(0,'rgba(255,255,255,0.92)'); wet.addColorStop(0.42,'rgba(255,255,255,0.30)');
    wet.addColorStop(1,'rgba(255,255,255,0)');
    c2.fillStyle = wet; c2.fill(silPath(g, 0));                      // tight specular — the "wet" cue
    const wet2 = c2.createRadialGradient(g.cx+g.rx*0.30, g.cy+g.ry*0.34, g.rx*0.04, g.cx+g.rx*0.28, g.cy+g.ry*0.32, g.rx*0.42);
    wet2.addColorStop(0,'rgba(255,255,250,0.34)'); wet2.addColorStop(1,'rgba(255,255,250,0)');
    c2.fillStyle = wet2; c2.fill(silPath(g, 0));                     // bounce light, opposite side
    const rim = c2.createRadialGradient(g.cx, g.cy, g.rx*0.74, g.cx, g.cy, g.rx*1.02);
    rim.addColorStop(0,'rgba(188,184,162,0)'); rim.addColorStop(1,'rgba(188,184,162,0.34)');
    c2.fillStyle = rim; c2.fill(silPath(g, 0));
    c2.restore();
    c2.strokeStyle = 'rgba(176,172,150,0.40)'; c2.lineWidth = 1.6; c2.stroke(silPath(g, 0));
  },
  /* BUTTER — cheddar's three-plane contract, unchanged, at a different value and hue. Proof the block paint
     generalises: the only bespoke part is the KNIFE DRAG on the front face (broad, soft, few) against
     cheddar's wire-cut striations (thin, hard, many). Same primitive, different material. */
  butter(c2, g){
    const [FLt, BLt, BRt, BRb, FRb, FLb] = SILS.block.pts(g);
    const FRt = [FRb[0], FLt[1]];
    const face = (pts, fill) => { c2.fillStyle = fill; c2.beginPath();
      pts.forEach(([x,y],i)=> i ? c2.lineTo(x,y) : c2.moveTo(x,y)); c2.closePath(); c2.fill(); };
    c2.save(); c2.clip(silPath(g, 0));
    const front = c2.createLinearGradient(FLt[0], FLt[1], FRb[0], FRb[1]);
    front.addColorStop(0,'#F9E7A6'); front.addColorStop(0.55,'#F3DC90'); front.addColorStop(1,'#E7CA76');
    face([FLt, FRt, FRb, FLb], front);
    const top = c2.createLinearGradient(BLt[0], BLt[1], FRt[0], FRt[1]);
    top.addColorStop(0,'#FFF7D2'); top.addColorStop(0.52,'#FCEFBB'); top.addColorStop(1,'#F6E4A4');
    face([FLt, BLt, BRt, FRt], top);
    const side = c2.createLinearGradient(FRt[0], FRt[1], BRb[0], BRb[1]);
    side.addColorStop(0,'#E4C36C'); side.addColorStop(1,'#CBA855');
    face([FRt, BRt, BRb, FRb], side);
    c2.save(); c2.beginPath();
    [FLt, FRt, FRb, FLb].forEach(([x,y],i)=> i ? c2.lineTo(x,y) : c2.moveTo(x,y));
    c2.closePath(); c2.clip();
    for(let i=0;i<4;i++){                                            // knife drag: broad, soft, diagonal
      const y = FLt[1] + (FLb[1]-FLt[1])*((i+0.6)/4);
      c2.strokeStyle = i % 2 ? 'rgba(255,250,214,0.24)' : 'rgba(196,158,70,0.12)';
      c2.lineWidth = 7 - i;
      c2.beginPath(); c2.moveTo(FLt[0], y + 5); c2.lineTo(FRt[0], y - 5); c2.stroke();
    }
    c2.restore();
    c2.fillStyle = 'rgba(198,160,72,0.07)';                          // waxy bloom, barely there
    for(let i=0;i<70;i++){ const a = i*2.399963, r = Math.sqrt((i*6151 % 73)/73);
      c2.beginPath();
      c2.arc(g.cx + Math.cos(a)*g.rx*1.02*r, g.cy + Math.sin(a)*g.ry*0.96*r, 1.5, 0, Math.PI*2); c2.fill(); }
    c2.strokeStyle = 'rgba(190,150,60,0.26)'; c2.lineWidth = 1.5;
    c2.beginPath(); c2.moveTo(FLt[0],FLt[1]); c2.lineTo(FRt[0],FRt[1]); c2.lineTo(FRb[0],FRb[1]); c2.stroke();
    c2.restore();
    c2.strokeStyle = 'rgba(184,144,56,0.36)'; c2.lineWidth = 2; c2.stroke(silPath(g, 0));
  },
  /* TOFU — the hardest paint here, because it has no features: no rind, no lattice, no blush. Everything is
     carried by the three planes separating at very low chroma, so their spread is WIDER in value than
     cheddar's even though the hue barely moves. The pinholes are what stop the faces reading as vector fills;
     the wet upper edge is what stops the block reading as foam. */
  tofu(c2, g){
    const [FLt, BLt, BRt, BRb, FRb, FLb] = SILS.block.pts(g);
    const FRt = [FRb[0], FLt[1]];
    const face = (pts, fill) => { c2.fillStyle = fill; c2.beginPath();
      pts.forEach(([x,y],i)=> i ? c2.lineTo(x,y) : c2.moveTo(x,y)); c2.closePath(); c2.fill(); };
    c2.save(); c2.clip(silPath(g, 0));
    const front = c2.createLinearGradient(FLt[0], FLt[1], FRb[0], FRb[1]);
    front.addColorStop(0,'#F4F1E4'); front.addColorStop(0.58,'#ECE8D8'); front.addColorStop(1,'#DFDBC9');
    face([FLt, FRt, FRb, FLb], front);
    const top = c2.createLinearGradient(BLt[0], BLt[1], FRt[0], FRt[1]);
    top.addColorStop(0,'#FDFCF6'); top.addColorStop(0.54,'#F8F6EC'); top.addColorStop(1,'#F0EDE0');
    face([FLt, BLt, BRt, FRt], top);
    const side = c2.createLinearGradient(FRt[0], FRt[1], BRb[0], BRb[1]);
    side.addColorStop(0,'#D8D3C0'); side.addColorStop(1,'#C4BFAC');
    face([FRt, BRt, BRb, FRb], side);
    c2.save(); c2.beginPath();                                       // pinholes: front face only, where seen
    [FLt, FRt, FRb, FLb].forEach(([x,y],i)=> i ? c2.lineTo(x,y) : c2.moveTo(x,y));
    c2.closePath(); c2.clip();
    for(let i=0;i<110;i++){
      const a = i*2.399963, r = Math.sqrt((i*7919 % 89)/89);
      const x = g.cx + Math.cos(a)*g.rx*0.92*r, y = g.cy + Math.sin(a)*g.ry*0.92*r;
      const rad = 0.9 + 1.5*((i*104729 % 29)/29);
      c2.fillStyle = 'rgba(176,170,148,0.14)';
      c2.beginPath(); c2.arc(x, y, rad, 0, Math.PI*2); c2.fill();
      c2.fillStyle = 'rgba(255,255,250,0.20)';
      c2.beginPath(); c2.arc(x-rad*0.32, y-rad*0.32, rad*0.58, 0, Math.PI*2); c2.fill();
    }
    c2.restore();
    c2.strokeStyle = 'rgba(255,255,252,0.52)'; c2.lineWidth = 2.2;    // damp light along the top front edge
    c2.beginPath(); c2.moveTo(FLt[0]+2, FLt[1]+1.5); c2.lineTo(FRt[0]-2, FRt[1]+1.5); c2.stroke();
    c2.strokeStyle = 'rgba(164,158,136,0.30)'; c2.lineWidth = 1.5;
    c2.beginPath(); c2.moveTo(FLt[0],FLt[1]); c2.lineTo(FRt[0],FRt[1]); c2.lineTo(FRb[0],FRb[1]); c2.stroke();
    c2.restore();
    c2.strokeStyle = 'rgba(160,154,132,0.38)'; c2.lineWidth = 2; c2.stroke(silPath(g, 0));
  },
  /* LETTUCE — the wobble stays, but it is no longer applied evenly: a leaf is SMOOTH where it leaves the heart
     and heavily FRILLED at its far margin, which is the single strongest cue in the reference. Every lobe knows
     its outward bearing (geom rot), so the pale midrib runs along it with veins branching off toward the frill,
     and the blade grades from a near-white base through green to a bright tip. Outer leaves are dark and blue-
     green, heart leaves small and yellow. */
  lettuce(c2, g){
    const OUT = [ ['#CFEA92','#4FB120','#1E7A12','#84DA33'], ['#C6E585','#43A518','#166B0C','#77D129'],
                  ['#D7EE9E','#5CBB2A','#25871A','#8FE23C'], ['#BFE07A','#3A9A14','#125E09','#6BC722'] ];
    const INN = [ ['#E9F8BE','#96D93E','#5FBB22','#BCEE60'], ['#F0FBD0','#A8E353','#71C733','#CBF375'] ];
    let i = 0;
    for(const L of g.leaves){
      const t = (L.inner ? INN : OUT)[i % (L.inner ? INN.length : OUT.length)], seed = i*2.399963 + 1; i++;
      c2.save(); c2.translate(g.cx+L.dx, g.cy+L.dy); c2.rotate(L.rot||0);
      const leaf = new Path2D(), N = 84;
      for(let k=0;k<=N;k++){
        const a = (k/N)*Math.PI*2;
        const out = (1 + Math.cos(a))/2;                          // 1 at the far margin, 0 where it meets the heart
        const w = 1 + (0.03 + 0.085*out)*Math.sin(5*a + seed)
                    + 0.045*out*Math.sin(9*a + seed*1.7);
        const x = Math.cos(a)*L.rx*w, y = Math.sin(a)*L.ry*w;
        k ? leaf.lineTo(x,y) : leaf.moveTo(x,y);
      }
      leaf.closePath();
      const bg = c2.createLinearGradient(-L.rx*0.95, -L.ry*0.35, L.rx*1.02, L.ry*0.30);
      bg.addColorStop(0, t[0]); bg.addColorStop(0.30, t[1]); bg.addColorStop(0.74, t[2]); bg.addColorStop(1, t[3]);
      c2.fillStyle = bg; c2.fill(leaf);
      c2.save(); c2.clip(leaf);
      const shade = c2.createLinearGradient(0, -L.ry, 0, L.ry);   // the leaf dishes: darker along its lower half
      shade.addColorStop(0,'rgba(255,255,236,0.14)'); shade.addColorStop(0.45,'rgba(255,255,236,0)');
      shade.addColorStop(1,'rgba(18,72,10,0.16)');
      c2.fillStyle = shade; c2.fill(leaf);
      c2.lineCap = 'round';
      const rib = new Path2D();                                    // midrib: a pale wedge, thick at the base
      const bw = L.ry*0.11;
      rib.moveTo(-L.rx*0.80, -bw); rib.quadraticCurveTo(0, -bw*0.44, L.rx*0.60, -1.0);
      rib.lineTo(L.rx*0.60, 1.0); rib.quadraticCurveTo(0, bw*0.44, -L.rx*0.80, bw);
      rib.closePath();
      const rg = c2.createLinearGradient(-L.rx*0.8, 0, L.rx*0.6, 0);
      rg.addColorStop(0,'rgba(244,251,216,0.62)'); rg.addColorStop(0.55,'rgba(232,246,196,0.40)');
      rg.addColorStop(1,'rgba(226,244,190,0.06)');
      c2.fillStyle = rg; c2.fill(rib);
      c2.strokeStyle = 'rgba(90,132,52,0.16)'; c2.lineWidth = 1; c2.stroke(rib);
      c2.strokeStyle = 'rgba(232,248,192,0.34)'; c2.lineWidth = 1.4;   // veins: off the rib, curving to the frill
      for(let v=0; v<6; v++){
        const bx = -L.rx*0.74 + v*(L.rx*0.30), reach = 0.72 + 0.30*Math.sin(v*1.3 + seed);
        for(const s of [-1,1]){
          c2.beginPath(); c2.moveTo(bx, s*1.5);
          c2.quadraticCurveTo(bx + L.rx*0.24, s*L.ry*0.38*reach, bx + L.rx*0.44, s*L.ry*0.92*reach);
          c2.stroke();
        }
      }
      c2.strokeStyle = 'rgba(28,62,18,0.12)'; c2.lineWidth = 2.4;      // the frill's own shadow, inside the margin
      c2.save(); c2.scale(0.92, 0.90); c2.stroke(leaf); c2.restore();
      const hl = c2.createRadialGradient(L.rx*0.34, -L.ry*0.32, 2, L.rx*0.30, -L.ry*0.28, L.rx*0.86);
      hl.addColorStop(0,'rgba(255,255,236,0.26)'); hl.addColorStop(1,'rgba(255,255,236,0)');
      c2.fillStyle = hl; c2.fill(leaf);
      c2.restore();
      c2.strokeStyle = L.inner ? 'rgba(70,132,32,0.40)' : 'rgba(20,70,12,0.48)'; c2.lineWidth = 1.4;
      c2.stroke(leaf);
      c2.restore();
    }
  },
    /* CABBAGE — a tight head, and its structure is WRAPPING, not radial: leaves spiral around the ball, so the
     lines that read as cabbage are long fold arcs following the sphere's curvature plus one dominant rib on the
     right where the outermost leaf turns under. The bottom-origin rib fan this had before is a lettuce/chard
     read — correct for a loose head, wrong for a tight one. Mottled green patches carry the form between folds;
     capillary vein nets appear only in a few places, the way they do on a real leaf face. */
  cabbage(c2, g){
    const P = (u,v) => [g.cx + u*g.rx, g.cy + v*g.ry];
    const sil = silPath(g, 0);
    const skin = c2.createRadialGradient(g.cx-g.rx*0.30, g.cy-g.ry*0.40, g.rx*0.06, g.cx+g.rx*0.06, g.cy+g.ry*0.06, g.rx*1.14);
    skin.addColorStop(0,'#F1FCCE'); skin.addColorStop(0.30,'#D9F49E'); skin.addColorStop(0.62,'#B4E268');
    skin.addColorStop(0.86,'#8FCA47'); skin.addColorStop(1,'#71AB36');
    c2.fillStyle = skin; c2.fill(sil);
    c2.save(); c2.clip(sil);
    c2.lineCap = 'round'; c2.lineJoin = 'round';

    /* The head is built from LOBES, not from lines on a ball: each wrapping leaf is a real filled shape with
       its own tone, lit edge and rib, drawn back-to-front and clipped by the silhouette so its far half
       disappears over the horizon. Fold lines then come for free — they are where one lobe overlaps the next. */
    const LOBES = [
      { u: 0.52, v: 0.42, rx:0.70, ry:0.60, rot: 0.6, lit:'#B9DC86', mid:'#93C263', dk:'#6E9F45', edge:0.26 },
      { u: 0.64, v:-0.10, rx:0.68, ry:0.60, rot:-0.2, lit:'#C4E390', mid:'#9CCA69', dk:'#75A54A', edge:0.28 },
      { u: 0.34, v:-0.56, rx:0.66, ry:0.58, rot:-0.7, lit:'#D2EA9E', mid:'#A9D474', dk:'#7EAD50', edge:0.32 },
      { u:-0.16, v: 0.62, rx:0.68, ry:0.56, rot: 0.2, lit:'#C0DF8C', mid:'#98C767', dk:'#71A247', edge:0.26 },
      { u:-0.58, v: 0.34, rx:0.68, ry:0.58, rot:-0.5, lit:'#D6ECA4', mid:'#ADD77A', dk:'#83B155', edge:0.30 },
      { u:-0.62, v:-0.22, rx:0.66, ry:0.58, rot: 0.3, lit:'#E2F4B6', mid:'#B9E088', dk:'#8EBC60', edge:0.34 },
      { u:-0.20, v:-0.62, rx:0.66, ry:0.56, rot: 0.8, lit:'#EBFAC6', mid:'#C5E894', dk:'#99C568', edge:0.38 },
      { u:-0.06, v:-0.04, rx:0.52, ry:0.46, rot: 0.1, lit:'#E8F8C0', mid:'#C0E58E', dk:'#95C265', edge:0.16 },
    ];
    let li = 0;
    for(const L of LOBES){
      const seed = li*2.399963 + 0.7; li++;
      const cxp = g.cx + L.u*g.rx, cyp = g.cy + L.v*g.ry;
      c2.save(); c2.translate(cxp, cyp); c2.rotate(L.rot);
      const RX = L.rx*g.rx, RY = L.ry*g.ry;
      const lobe = new Path2D(); const N = 64;
      for(let k=0;k<=N;k++){
        const t = (k/N)*Math.PI*2;
        const w = 1 + 0.035*Math.sin(3*t+seed) + 0.022*Math.sin(5*t+seed*1.6) + 0.014*Math.sin(8*t+seed*2.2);
        const x = Math.cos(t)*RX*w, y = Math.sin(t)*RY*w;
        k ? lobe.lineTo(x,y) : lobe.moveTo(x,y);
      }
      lobe.closePath();
      const lg = c2.createLinearGradient(-RX*0.6, -RY*0.8, RX*0.7, RY*0.9);
      lg.addColorStop(0, L.lit); lg.addColorStop(0.52, L.mid); lg.addColorStop(1, L.dk);
      c2.fillStyle = lg; c2.fill(lobe);
      c2.save(); c2.clip(lobe);
      const rib = new Path2D();                                      // the leaf's own rib, curving with the lobe
      rib.moveTo(-RX*0.90, RY*0.44);
      rib.quadraticCurveTo(-RX*0.20, RY*0.02, RX*0.72, -RY*0.46);
      c2.strokeStyle = 'rgba(250,255,226,0.34)'; c2.lineWidth = 2.4; c2.stroke(rib);
      c2.strokeStyle = 'rgba(78,116,36,0.13)'; c2.lineWidth = 1.8;
      c2.save(); c2.translate(0, 3); c2.stroke(rib); c2.restore();
      c2.strokeStyle = 'rgba(248,255,224,0.20)'; c2.lineWidth = 1.3;   // a few veins off it
      for(let v=0; v<5; v++){
        const bx = -RX*0.62 + v*(RX*0.32), by = RY*(0.16 - v*0.10);
        for(const s of [-1,1]){
          c2.beginPath(); c2.moveTo(bx, by);
          c2.quadraticCurveTo(bx + RX*0.14, by + s*RY*0.26, bx + RX*0.30, by + s*RY*0.52);
          c2.stroke();
        }
      }
      const shd = c2.createLinearGradient(0, -RY, 0, RY);
      shd.addColorStop(0,'rgba(255,255,235,0.16)'); shd.addColorStop(0.5,'rgba(255,255,235,0)');
      shd.addColorStop(1,'rgba(46,80,22,0.20)');
      c2.fillStyle = shd; c2.fill(lobe);
      c2.restore();
      /* Only the leaf's OUTWARD arc is a visible fold — the rest is tucked under the next leaf, and outlining
         the whole ellipse made every lobe read as a sticker. */
      const hx = (cxp - g.cx)/g.rx, hy = (cyp - g.cy)/g.ry, hl = Math.hypot(hx,hy) || 1e-3;

    c2.strokeStyle = 'rgba(120,158,66,0.34)'; c2.lineWidth = 1.2; c2.stroke();
    c2.strokeStyle = 'rgba(86,124,40,0.34)'; c2.lineWidth = 2; c2.stroke(sil);
  },
  /* CAULIFLOWER — broccoli's painter, verbatim, with two changes: a cream-white palette instead of green, and
     the whole head mirrored (stalk right, crown left) so the two never read as the same picture twice. Same
     wobbled floret path, same two-grade bud mat, same directional crevice shade — recoloured, not rebuilt. */
  cauliflower(c2, g){
    for(const L of g.leaves){                                              // stalk and branches, behind
      if(!L.stem) continue;
      c2.save(); c2.translate(g.cx+L.dx, g.cy+L.dy); c2.rotate(L.rot||0);
      const sg = c2.createLinearGradient(0, -L.ry, 0, L.ry);
      sg.addColorStop(0,'#E9F0C8'); sg.addColorStop(0.48,'#CBDDA0'); sg.addColorStop(1,'#A3BC78');
      c2.fillStyle = sg;
      c2.beginPath(); c2.ellipse(0, 0, L.rx, L.ry, 0, 0, Math.PI*2); c2.fill();
      c2.strokeStyle = 'rgba(140,164,104,0.34)'; c2.lineWidth = 1.2;       // fibre, along the stalk
      for(let i=-2;i<=2;i++){
        c2.beginPath(); c2.moveTo(-L.rx*0.82, L.ry*0.28*i);
        c2.quadraticCurveTo(0, L.ry*0.34*i, L.rx*0.84, L.ry*0.24*i); c2.stroke();

      c2.save(); c2.clip(head);

         beads with a few larger clumps sitting proud of it. Angles are HASHED, not stepped: `b*goldenAngle` with

         a pinwheel of same-handed arms — succulent rosettes, not curd. */
      for(let b=0;b<150;b++){

        const bx = Math.cos(a)*L.rx*0.96*r, by = Math.sin(a)*L.ry*0.96*r;

        c2.beginPath(); c2.arc(bx+br*0.30, by+br*0.30, br, 0, Math.PI*2); c2.fill();
        c2.fillStyle = 'rgba(255,253,244,0.42)';
        c2.beginPath(); c2.arc(bx-br*0.26, by-br*0.30, br*0.74, 0, Math.PI*2); c2.fill();
      }
      for(let b=0;b<9;b++){                                                // clumps: sub-floret lumps
        const a = (((b*36067 + seed*104729) % 1013)/1013)*Math.PI*2;       // own hash, or they trace the same arms
        const r = 0.30 + 0.52*(((b*7919 + seed*13) % 17)/17);
        const bx = Math.cos(a)*L.rx*r, by = Math.sin(a)*L.ry*r, br = L.rx*(0.17 + 0.10*((b % 5)/5));
        const cg = c2.createRadialGradient(bx-br*0.3, by-br*0.35, br*0.1, bx, by, br);
        cg.addColorStop(0,'rgba(255,252,240,0.30)'); cg.addColorStop(0.7,'rgba(214,204,176,0.10)');
        cg.addColorStop(1,'rgba(126,114,86,0.22)');                          // own shadow: the lump sits proud
        c2.fillStyle = cg; c2.beginPath(); c2.arc(bx, by, br, 0, Math.PI*2); c2.fill();
      }

         florets read as stacked coins instead of one dome. */
      const ix = -50 - L.dx, iy = -L.dy, im = Math.hypot(ix, iy) || 1;   // crown sits to the LEFT here
      const rim = c2.createRadialGradient(-ix/im*L.rx*0.55, -iy/im*L.ry*0.55, L.rx*0.30,

      c2.strokeStyle = 'rgba(150,138,108,0.20)'; c2.lineWidth = 1.2; c2.stroke(head); // whisper, not a coin edge

  },
  /* SPINACH — a BUNCH, not a loose scatter: long pale petioles fanning out of a tied butt on the left, each
     capped with a cut root nub, and broad spade blades fanning up and right off them. Still basil's blade
     machinery; the changes are the spade outline (widest a third up from the base, drawn to a point) and a
     herringbone vein set struck off a bold midrib, which is what identifies spinach in the reference. */
  spinach(c2, g){
    const TONES = [ ['#5FA548','#3E7A2C','#245018'], ['#6DB254','#4A8836','#2A5A1E'],
                    ['#549A3E','#376E27','#1F4714'], ['#77BC5C','#52913B','#2E6222'] ];
    let si = 0;
    for(const L of g.leaves){                                              // petioles, behind the blades
      if(!L.stem) continue;

      const bow = L.ry * (1.5 + (k%3)*0.6);                                // sag: dead-straight rods read as skewers
      const rod = new Path2D();                                            // tapered: thicker at the cut butt
      rod.moveTo(-L.rx, -L.ry*1.10);

      rod.lineTo(L.rx, L.ry*0.62);

      c2.strokeStyle = 'rgba(250,255,228,0.40)'; c2.lineWidth = 1.1;       // lit groove down the petiole
      c2.beginPath(); c2.moveTo(-L.rx*0.86, -L.ry*0.30);
      c2.quadraticCurveTo(0, bow - L.ry*0.26, L.rx*0.88, -L.ry*0.20); c2.stroke();
      const nub = c2.createRadialGradient(-L.rx, -L.ry*0.4, 0.5, -L.rx, 0, L.ry*1.7);
      nub.addColorStop(0, k%2 ? '#E0B08A' : '#CE9970'); nub.addColorStop(1,'#8A5C39');
      c2.fillStyle = nub;                                                  // cut root end, pinkish-brown

    for(const L of g.leaves){

      c2.save(); c2.translate(g.cx+L.dx, g.cy+L.dy); c2.rotate(L.rot||0);

      const blade = new Path2D();
      blade.moveTo(-rx, 0);
      blade.bezierCurveTo(-rx*0.86, -ry*0.78, -rx*0.30, -ry*1.06, rx*0.16, -ry*0.80);
      blade.bezierCurveTo(rx*0.58, -ry*0.58, rx*0.86, -ry*0.26, rx, 0);
      blade.bezierCurveTo(rx*0.86, ry*0.26, rx*0.58, ry*0.58, rx*0.16, ry*0.80);
      blade.bezierCurveTo(-rx*0.30, ry*1.06, -rx*0.86, ry*0.78, -rx, 0);
      blade.closePath();
      const bg = c2.createLinearGradient(-rx*0.3, -ry, rx*0.4, ry);
      bg.addColorStop(0, t[0]); bg.addColorStop(0.52, t[1]); bg.addColorStop(1, t[2]);
      c2.fillStyle = bg; c2.fill(blade);
      c2.save(); c2.clip(blade);
      c2.lineCap = 'round';
      c2.strokeStyle = 'rgba(236,250,210,0.55)'; c2.lineWidth = 3.0;                 // midrib, bold and tapering
      c2.beginPath(); c2.moveTo(-rx*0.92, 0); c2.quadraticCurveTo(rx*0.1, -ry*0.04, rx*0.94, 0); c2.stroke();
      c2.strokeStyle = 'rgba(232,246,206,0.30)'; c2.lineWidth = 1.5;                 // herringbone side veins

        for(const s of [-1,1]){
          c2.beginPath(); c2.moveTo(bx+rx*0.06, s*ry*0.30);
          c2.quadraticCurveTo(bx+rx*0.24, s*ry*0.48, bx+rx*0.30, s*ry*0.74); c2.stroke();
        }
      }
      const hl = c2.createRadialGradient(-rx*0.1, -ry*0.34, 2, -rx*0.1, -ry*0.34, rx*0.72);
      hl.addColorStop(0,'rgba(255,255,235,0.20)'); hl.addColorStop(1,'rgba(255,255,235,0)');
      c2.fillStyle = hl; c2.fill(blade);
