const C = { cream:'#F8F4EE', walnut:'#8A5A3C', steel:'#50545A', sage:'#8DAA6D', tomato:'#D94B45', golden:'#D8A03D' };

/* ---------- Storage module ---------- */
const Store = (() => {
  let mem = {}, mode = 'mem';
  try { const k='__kc_probe'; localStorage.setItem(k,'1'); if(localStorage.getItem(k)==='1'){ localStorage.removeItem(k); mode='local'; } } catch(e){}
  const api = {
    mode,
    set(k,v){ try{ if(mode==='local'){ localStorage.setItem('kc_'+k, JSON.stringify(v)); return true; } }catch(e){} mem[k]=JSON.stringify(v); return true; },
    get(k){ // a corrupt or absent value returns null — it must never throw into the game loop
      try{ if(mode==='local'){ const r=localStorage.getItem('kc_'+k); if(r!=null) return JSON.parse(r); } }catch(e){}
      try{ return mem[k]==null?null:JSON.parse(mem[k]); }catch(e){ return null; }
    },
  };
  api.set('selftest', {t:Date.now()});
  api.ok = api.get('selftest') != null;
  return api;
})();
const intOr = (v, d) => { const n = Number(v); return Number.isFinite(n) ? Math.round(n) : d; };
/* spirit accumulates in fractions of a point, so it cannot be rounded on the way in or a Learning run
   would grow it by nothing at all. A corrupt, absent or hostile value falls back — never throws. */
// Number(null) and Number('') are both 0, so an ABSENT value would read as a real zero and a fresh
// install would start at spirit 0 instead of the base. Nothing but a finite number counts.
const numOr = (v, d) => { const n = (v == null || v === '') ? NaN : Number(v); return Number.isFinite(n) ? n : d; };
/* ---------- Save: persisted progress (Phase 4 reads spirit + days; the schema is written now) ---------- */
const Save = {
  best(id){ const v = Store.get('best.'+id); return v==null ? null : intOr(v, null); },
  setBest(id, v){ Store.set('best.'+id, intOr(v, 0)); },
  played(){ return intOr(Store.get('recipesPlayed'), 0); },
  bumpPlayed(){ const n = Save.played()+1; Store.set('recipesPlayed', n); return n; },
  signatures(){ return intOr(Store.get('signatures'), 0); },
  bumpSignatures(){ const n = Save.signatures()+1; Store.set('signatures', n); return n; },
  spirit(){ const s = (Store.get('spirit') && typeof Store.get('spirit') === 'object') ? Store.get('spirit') : null;
    return { value: Math.max(0, Math.min(100, numOr(s && s.value, CONFIG.spirit.SPIRIT_BASE))),
             updated: (s && s.updated) || null }; },
  /* Spirit never decreases. That is enforced HERE, not by the callers: any write below the stored value is
     clamped up to it, so no future feature can quietly introduce decay (§24). */
  setSpirit(v){ const cur = Save.spirit().value;
    const next = Math.max(cur, Math.max(0, Math.min(100, numOr(v, cur))));
    Store.set('spirit', { value: +next.toFixed(3), updated: Date.now() }); },
  days(){ const d = Store.get('daysPlayed'); return { count: intOr(d && d.count, 0), last: (d && d.last) || null }; },
  touchDay(){
    const today = new Date().toISOString().slice(0,10), d = Save.days();
    if(d.last !== today) Store.set('daysPlayed', { count: d.count+1, last: today });
  },
};

/* ---------- Flow: the session arc (§16) ----------
   Flow drives ATMOSPHERE ONLY. It never touches a score, and it has no UI — no number, no meter, no bar,
   no text, not even in the debug overlay. A visible flow becomes a thing to protect, and protecting things
   creates stress. Losing a streak fades the room back gently; it never costs anything. */
const Flow = (() => {
  let v = 0, tween = null;
  return {
    level(){ return v; },
    // dev = distance from the nearest ideal division as a fraction of ideal spacing — the same reading the
    // grade takes, so the room agrees with the plate without flow ever entering the score.
    onCut(dev){ const F = CONFIG.flow; tween = null;
      v = clamp01(v + (dev <= F.FLOW_CLEAN_TOL_FRAC ? F.FLOW_RISE_PER_CLEAN : -F.FLOW_FALL_PER_SLOPPY)); },
    softReset(){ const F = CONFIG.flow;
      tween = { from: v, to: v*F.FLOW_RESET_TO, t: 0, dur: F.FLOW_RESET_LERP_MS }; },
    tick(dt){ if(!tween) return;
      tween.t += dt;
      const k = clamp01(tween.t/tween.dur);
      v = tween.from + (tween.to - tween.from)*easeOut(k);
      if(k >= 1) tween = null; },
    set(x){ v = clamp01(x); tween = null; },        // scripted runs only
  };
})();

/* ---------- Kitchen Spirit: the lifetime arc (§24) ----------
   Grows after every completed recipe, faster for a better grade, and never shrinks. Never announced: no
   toast, no banner, no milestone. The kitchen is simply warmer next session — invisible progression is
   the whole point, so the only way to notice it is to notice it. */
const Spirit = (() => {
  let cached = null;
  const read = () => (cached == null ? (cached = Save.spirit().value) : cached);
  return {
    value(){ return read(); },
    reload(){ cached = null; return read(); },
    warmth(){ const S = CONFIG.spirit;
      const t = clamp01((read() - S.SPIRIT_BASE) / Math.max(1, 100 - S.SPIRIT_BASE));
      return Math.pow(t, S.SPIRIT_WARMTH_CURVE); },
    grow(grade){ const S = CONFIG.spirit, before = read();
      const k = numOr(S.SPIRIT_GRADE_SCALE[grade], 1);
      Save.setSpirit(before + S.SPIRIT_PER_RECIPE*k);
      cached = null;
      Audio.maybeAmbient();                        // one ambience at the threshold, then permanently
      return { before, after: read() }; },
  };
})();
/* ONE lighting model. Spirit sets the warmth (cool early morning → golden), flow sets the brightness. The
   window in the background and the light on the board read the same two numbers, so the kitchen and the
   food can never disagree about the time of day. */
/* §6 adds ONE term: a long absence starts the light a little cooler and it warms back as they play. It is
   subtracted here, inside the one model, so the window and the board can still never disagree. */
const Light = { warmth(){ return clamp01(Spirit.warmth() - SceneMemory.cool()); }, bright(){ return Flow.level(); } };
function hexA(hex, a){   // 5A-2: the value grade is a colour plus an alpha, everywhere it is applied
  const p = parseInt(hex.slice(1),16);
  return 'rgba(' + ((p>>16)&255) + ',' + ((p>>8)&255) + ',' + (p&255) + ',' + (+a).toFixed(3) + ')';
}
function mixHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16), L = (s,o) => (s >> o) & 255;
  const r = Math.round(L(pa,16) + (L(pb,16)-L(pa,16))*t), g = Math.round(L(pa,8) + (L(pb,8)-L(pa,8))*t);
  return 'rgb(' + r + ',' + g + ',' + Math.round((pa&255) + ((pb&255)-(pa&255))*t) + ')';
}

/* ---------- Audio: layered WebAudio foley, zero asset files ---------- */
const Audio = (() => {
  let ctx = null, noiseBuf = null;
  const AJ = () => 1 + (Math.random()*2-1)*CONFIG.audio.AUDIO_JITTER;
  function ensure(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      ctx = new AC();
      const len = Math.floor(ctx.sampleRate * 0.6);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    // Nothing plays before the first touch. From the first gesture on, the bed never stops.
    if(ctx.state === 'suspended') ctx.resume().then(startCadence, () => {});
    startCadence();
  }
  function noise(){ const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
  /* ---------- Chef's Cadence (§31) ----------
     Three layers ALWAYS sound. Cut quality moves the MIX — layers come forward and recede — and no layer is
     ever muted: CADENCE_LAYER_FLOOR is the floor and it is not zero. The mix model is plain JS and ticks with
     or without a live AudioContext, so the floors stay measurable on a device that never unlocked audio. */
  const CAD = { on:false, t0:0, step:0, nextT:0, timer:0, nodes:null, ambient:false, events:0,
                mix:{bed:0,mel:0,tex:0}, applied:{}, minSeen:{}, shifts:[], chimeShifts:[] };
  const cadCfg = () => CONFIG.cadence;
  function startCadence(){
    if(CAD.on || !ctx || ctx.state !== 'running') return;
    const A = cadCfg(), t = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.linearRampToValueAtTime(1, t + A.CADENCE_FADE_IN_MS/1000);  // blooms beneath the first cut
    master.connect(ctx.destination);
    const mk = () => { const g = ctx.createGain(); g.gain.value = 0.0001; g.connect(master); return g; };
    const bed = mk(), mel = mk(), tex = mk();
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 520; lp.Q.value = 0.4;
    lp.connect(bed);
    // the bed is a sustained root + fifth, started once and never stopped: there is no silence to restart from
    const oscs = [0, 7].map((semi, i) => {
      const o = ctx.createOscillator(); o.type = i ? 'sine' : 'triangle';
      o.frequency.value = A.ROOTS[0]*Math.pow(2, semi/12)*(i ? 1.003 : 1);  // a hair of detune, never a beat
      const g = ctx.createGain(); g.gain.value = i ? 0.42 : 1;
      o.connect(g).connect(lp); o.start(t); return o;
    });
    const lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value = 0.07;  // a ~14s breath
    const lfoG = ctx.createGain(); lfoG.gain.value = 120;
    lfo.connect(lfoG).connect(lp.frequency); lfo.start(t);
    CAD.nodes = { master, bed, mel, tex, oscs, lp };
    CAD.on = true; CAD.t0 = t; CAD.step = 0; CAD.nextT = t + 0.06;
    mixCadence();
    if(!CAD.timer) CAD.timer = setInterval(() => {                          // frames stop when hidden; the bed does not
      if(isStale()){ clearInterval(CAD.timer); CAD.timer = 0; return; }
      schedCadence();
    }, 120);
    maybeAmbient();
  }
  function mixCadence(){ // the whole mix: bed always present, melody with flow, texture last
    const A = cadCfg(), f = Flow.level();
    const want = { bed: 1, mel: f, tex: Math.max(0, (f - 0.45)/0.55) };
    const t = ctx ? ctx.currentTime : 0, tc = A.CADENCE_LERP_MS/3000;       // ~95% of the move in LERP_MS
    for(const k of ['bed','mel','tex']){
      const lvl = A.CADENCE_LAYER_FLOOR + (1-A.CADENCE_LAYER_FLOOR)*clamp01(want[k]);
      CAD.mix[k] = lvl;
      if(CAD.minSeen[k] == null || lvl < CAD.minSeen[k]) CAD.minSeen[k] = lvl;
      const target = A.LAYER_GAINS[k]*lvl, n = CAD.nodes && CAD.nodes[k];
      if(n && ctx && Math.abs(numOr(CAD.applied[k], -1) - target) > 0.0004){
        n.gain.setTargetAtTime(target, t, tc); CAD.applied[k] = target;     // eased, never a step
      }
    }
  }
  function schedCadence(){ // a lookahead scheduler on the shared clock — the same grid the cuts quantize to
    if(!CAD.on || !ctx || ctx.state !== 'running') return;
    const A = cadCfg(), stepDur = (60/A.CADENCE_BPM)/2;
    let guard = 0;
    while(CAD.nextT < ctx.currentTime + 0.9 && guard++ < 64){
      const s = ((CAD.step % 16) + 16) % 16, t = CAD.nextT;
      if(s === 0 || s === 8){ const root = A.ROOTS[Math.floor(CAD.step/8) % A.ROOTS.length];
        CAD.nodes.oscs.forEach((o,i) => o.frequency.setTargetAtTime(root*Math.pow(2, i?7/12:0)*(i?1.003:1), t, 0.5)); }
      if(A.MEL_STEPS.indexOf(s) >= 0) pluck(t, A.LADDER[(CAD.step*3) % A.LADDER.length]);
      if(A.TEX_STEPS.indexOf(s) >= 0) tapVoice(t);
      CAD.step++; CAD.nextT += stepDur; CAD.events++;
    }
  }
  function pluck(t, f){
    const o = ctx.createOscillator(); o.type='triangle'; o.frequency.value = f*AJ();
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*1.6; bp.Q.value = 1.1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.9);
    o.connect(bp).connect(g).connect(CAD.nodes.mel); o.start(t); o.stop(t+0.95);
  }
  function tapVoice(t){
    const src = noise();
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 3400;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.075);
    src.connect(hp).connect(g).connect(CAD.nodes.tex); src.start(t); src.stop(t+0.09);
  }
  /* Quantization is an ASSIST, never a scheduler. A cut sound is only ever nudged FORWARD, and only when the
     next 1/8 is already within the cap — otherwise it plays dry, on the stroke. The cut never waits for the
     music. The Perfect Slice gets a one-frame cap of its own, so it can never drift inside the hitstop. */
  function quantShiftFor(rel, maxMs){
    const A = cadCfg(), grid = (60/A.CADENCE_BPM)*(4/A.QUANTIZE_DIVISION);
    const d = (Math.ceil(rel/grid)*grid - rel)*1000;
    const cap = maxMs == null ? A.QUANTIZE_MAX_SHIFT_MS : maxMs;
    return d <= cap ? d : 0;
  }
  function quantShift(maxMs){ return (CAD.on && ctx) ? quantShiftFor(ctx.currentTime - CAD.t0, maxMs) : 0; }
  function logShift(arr, v){ arr.push(+v.toFixed(2)); if(arr.length > 300) arr.shift(); return v; }
  function maybeAmbient(){ // §24: one soft room tone at the threshold. It fades in, and it never fades out
    const S = CONFIG.spirit;
    if(CAD.ambient || !ctx || ctx.state !== 'running' || Spirit.value() < S.SPIRIT_AMBIENT_AT) return;
    const t = ctx.currentTime, src = noise();
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 380; lp.Q.value = 0.3;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 60;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(S.SPIRIT_AMBIENT_GAIN, t + 3);          // no announcement, just the room
    src.connect(hp).connect(lp).connect(g).connect(ctx.destination); src.start(t);
    CAD.ambient = true;
  }
  function whoosh(vel){ // knife enters — input acknowledged on first move, never delayed
    ensure(); if(!ctx || ctx.state!=='running') return;
    const t = ctx.currentTime, src = noise();
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = (420+520*vel)*AJ(); bp.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05+0.06*vel, t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
    src.connect(bp).connect(g).connect(ctx.destination); src.start(t); src.stop(t+0.1);
  }
  /* One synthesis path, three voices (§32 — no asset files). The ingredient supplies every number: entry
     transient (centre/Q/attack/decay), body (filter type/band/peak/tail) and board contact (pitch/drop/gain).
     Tomato = wet and soft, cucumber = bright and dry, carrot = hard, dense and short. */
  function sliceCut(vel, durMs, delayMs, prof){
    ensure(); if(!ctx || ctx.state!=='running') return;
    const A = prof || ING.audio;
    const t0 = ctx.currentTime + ((delayMs||0) + logShift(CAD.shifts, quantShift()))/1000;
    { // the break: skin, snap or crack — brighter and sharper when fast
      const src = noise();
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = (A.filterMin + (A.filterMax-A.filterMin)*vel)*AJ(); bp.Q.value = A.transQ;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime((A.transPeak + A.transVel*vel)*AJ(), t0 + (vel>0.5?A.atkFast:A.atkSlow));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + A.transDecay);
      src.connect(bp).connect(g).connect(ctx.destination); src.start(t0); src.stop(t0 + A.transDecay + 0.02);
    }
    { // the body: a swell over the cut. lowpass reads wet, bandpass reads crisp; the tail carries the moisture
      const tail = (A.tailMs*(1.5 - A.tailVel*vel))/1000;
      const dur = durMs/1000 + tail;
      const src = noise();
      const f = ctx.createBiquadFilter(); f.type = A.glideType;
      f.frequency.value = (A.glideMin + A.glideSpan*vel)*AJ(); f.Q.value = A.glideQ;
      const g = ctx.createGain();
      const peak = (A.glidePeak + A.glideVel*(1-vel))*AJ();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0+0.02);
      g.gain.setValueAtTime(peak, t0+Math.max(0.02, durMs/1000*0.7));
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      src.connect(f).connect(g).connect(ctx.destination); src.start(t0); src.stop(t0+dur+0.02);
    }
    { // board contact at reveal completion: pitch + volume by impact speed, weight by ingredient
      const tb = t0 + durMs/1000;
      const o = ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(A.thunkHz*AJ()*(0.92+0.16*vel), tb);
      o.frequency.exponentialRampToValueAtTime(A.thunkDrop, tb+0.07);
      const g = ctx.createGain();
      g.gain.setValueAtTime(A.thunkGain*(0.45 + A.thunkVel*vel)*AJ(), tb);
      g.gain.exponentialRampToValueAtTime(0.001, tb+0.09);
      o.connect(g).connect(ctx.destination); o.start(tb); o.stop(tb+0.1);
    }
  }
  function chime(){ // glass-like, for the Perfect Slice only
    ensure(); if(!ctx || ctx.state!=='running') return;
    // the hero moment lands on the frame: at most one frame of nudge, never the full quantize cap
    const t = ctx.currentTime + logShift(CAD.chimeShifts, quantShift(cadCfg().CHIME_MAX_SHIFT_MS))/1000;
    const G = CONFIG.perfect.CHIME_GAIN;
    [[1661,1],[2493,0.45]].forEach(([f,m]) => {
      const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = f*AJ();
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(G*m, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.55);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.6);
    });
  }
  function plateSettle(i){ // soft ceramic contact, pitched up a pentatonic ladder so seven pieces sound musical
    ensure(); if(!ctx || ctx.state!=='running') return;
    const t = ctx.currentTime + logShift(CAD.shifts, quantShift())/1000, G = CONFIG.plating.PLATE_CHIME_GAIN;
    const ladder = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7];
    const f = ladder[Math.min(i, ladder.length-1)] * AJ();
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*1.4; bp.Q.value = 1.6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(G, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.26);
    o.connect(bp).connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.3);
    const src = noise(); // the ceramic itself: a whisper of contact under the note
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 2600;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(G*0.5, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
    src.connect(hp).connect(ng).connect(ctx.destination); src.start(t); src.stop(t+0.06);
  }
  function signature(){ // Chef's Signature: one soft, distinct mark — warmer and slower than the Perfect Slice chime
    ensure(); if(!ctx || ctx.state!=='running') return;
    const t = ctx.currentTime;
    [[783.99,1,0],[1174.7,0.5,0.05],[1567.98,0.28,0.1]].forEach(([f,m,d]) => {
      const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = f*AJ();
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t+d);
      g.gain.exponentialRampToValueAtTime(0.22*m, t+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+d+0.9);
      o.connect(g).connect(ctx.destination); o.start(t+d); o.stop(t+d+1);
    });
  }
  return { ensure, whoosh, sliceCut, chime, plateSettle, signature, maybeAmbient, quantShiftFor,
    cadenceTick(){ mixCadence(); },
    cadenceReset(){ CAD.minSeen = {}; CAD.shifts = []; CAD.chimeShifts = []; },
    cadenceState(){ const A = cadCfg(), gain = k => A.LAYER_GAINS[k]*CAD.mix[k];
      return { on: CAD.on, ambient: CAD.ambient, events: CAD.events, bpm: A.CADENCE_BPM,
        floor: A.CADENCE_LAYER_FLOOR, mix: Object.assign({}, CAD.mix), minSeen: Object.assign({}, CAD.minSeen),
        gains: { bed: gain('bed'), mel: gain('mel'), tex: gain('tex') },
        shiftMaxMs: CAD.shifts.length ? Math.max.apply(null, CAD.shifts) : 0,
        chimeShiftMaxMs: CAD.chimeShifts.length ? Math.max.apply(null, CAD.chimeShifts) : 0,
        nShifts: CAD.shifts.length, nChime: CAD.chimeShifts.length }; },
    get state(){ return ctx ? ctx.state : 'none'; } };
})();

/* ---------- canvas + view ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let view = { scale: 1, ox: 0, oy: 0, dpr: 1 };
/* ================================================================
   THE HOME KITCHEN (§53–58) — Phase 5A
   Not "the background": the room the player comes home to. The cutting board earns the player's attention;
   the kitchen earns their affection. Static this phase (motion and sound are 5C), so it has to read as
   hand-placed and warm while completely still.
   The five authored bands — window · far wall · shelves · table · station — composite into TWO layer
   canvases split at the table plane, which is exactly the split 5B needs: the wall parallaxes behind a
   still table without either being redrawn. Per frame the player pays for ONE blit; the layers are
   pre-rendered and flattened into a composite that rebuilds only when the light, the recipe or the
   save actually moves.
   ================================================================ */

/* ---------- SceneMemory (§6): tiny persistence, never announced, never a reward ----------
   Every value here changes PRESENTATION only. Corrupt or absent reads fall back silently through the same
   hardened helpers as the rest of the save (§4B), because a room that throws is worse than a plain one. */
const SceneMemory = (() => {
  const K = () => CONFIG.kitchen;
  let first = false, shownId = '', writeId = '', sessions = 1, cool0 = 0, cool = 0, cutsSeen = 0, sawCuts = 0;
  const validId = v => (CONFIG.recipes.RECIPES.some(r => r.id === v) ? v : CONFIG.recipes.RECIPES[0].id);
  function read(){
    first = Store.get('firstRecipeDone') === true;      // a strict true: any other value is "not yet"
    shownId = writeId = validId(Store.get('lastRecipeId'));
    sessions = Math.max(1, Math.min(1e6, intOr(Store.get('sessionCount'), 0)));
  }
  read();
  sessions = Math.min(1e6, sessions + 1);               // this load is a session; bumped exactly once, here
  Store.set('sessionCount', sessions);
  {                                                     // a long gap starts the light a little cooler (§6)
    const t = numOr(Store.get('lastPlayedAt'), 0), gapH = t > 0 ? (Date.now() - t)/3600000 : 0;
    cool0 = cool = (gapH >= K().COOL_GAP_HOURS && gapH < 24*400) ? K().COOL_MAX : 0;
    Store.set('lastPlayedAt', Date.now());
  }
  return {
    firstDone(){ return first; },
    completeFirst(){ if(!first){ first = true; Store.set('firstRecipeDone', true); } Store.set('lastPlayedAt', Date.now()); },
    /* What they usually prep is what was in the basket when they walked in — so it is frozen at load and
       the write is for NEXT time. Reading it live would just put today's ingredient in the basket twice. */
    basketRecipeId(){ return shownId; },
    noteRecipe(id){ writeId = validId(id); Store.set('lastRecipeId', writeId); },
    sessions(){ return sessions; },
    tier(){ return sessions >= K().LIVED_IN_2 ? 2 : sessions >= K().LIVED_IN_1 ? 1 : 0; },
    cool(){ return cool; },
    /* The light warms as they PLAY, not as the clock runs: pinned to the cut count, so two identical frames
       can never move it and the pre-render can never churn. */
    tick(){
      const n = cuts.length;
      if(n > sawCuts) cutsSeen += n - sawCuts;
      sawCuts = n;
      cool = cool0 <= 0 ? 0 : Math.max(0, cool0 * (1 - cutsSeen/Math.max(1, K().COOL_CUTS)));
    },
    reload(){ read(); cool = cool0 = 0; cutsSeen = 0; return this.report(); },   // follows a restored save
    report(){ return { firstRecipeDone: first, basketRecipeId: shownId, lastRecipeIdWritten: writeId,
      sessionCount: sessions, tier: this.tier(), coolStart: +cool0.toFixed(3), cool: +cool.toFixed(3),
      cutsSinceLoad: cutsSeen, storeMode: Store.mode }; },
  };
})();

/* ---------- IdleState (§7): the state and the trigger. The life itself is 5C ----------
   After ten seconds nothing asks the player to play: no prompt, no pulse, no "tap to start", no dimming.
   The room simply exists and can be looked at — the exposure comes up a hair so it reads as present.
   Very few games let players enjoy doing nothing; this is where that becomes part of the identity. */
const IdleState = (() => {
  const K = () => CONFIG.kitchen;
  let last = performance.now(), idle = false, lift = 0, entries = 0;
  const poke = () => { last = performance.now(); if(idle){ idle = false; lift = 0; } };  // exits instantly, no transition cost
  for(const ev of ['pointerdown','pointermove','pointerup','keydown','wheel'])
    window.addEventListener(ev, poke, { capture: true, passive: true });
  document.addEventListener('visibilitychange', () => { if(!document.hidden) poke(); });
  return {
    poke, idle(){ return idle; }, state(){ return idle ? 'idle' : 'active'; }, lift(){ return lift; },
    entries(){ return entries; }, sinceInput(){ return performance.now() - last; },
    tick(now, dt){
      if(phase === 'paused'){ last = now; return; }        // paused is a player decision, not idleness
      if(!idle && now - last >= K().IDLE_AFTER_MS){ idle = true; entries++; }
      const target = idle ? K().IDLE_EXPOSURE : 0;
      if(lift < target) lift = Math.min(target, lift + (dt/K().IDLE_EXPOSURE_MS)*K().IDLE_EXPOSURE);
      else if(lift > target) lift = target;
    },
    testAge(ms){ last = performance.now() - ms; },        // scripted runs only
  };
})();

/* ---------- Camera (§61): push, pull, tiny parallax. NEVER rotate ----------
   One transform over the already-layered 5A scene: { zoom, pan }. Rotation in a portrait frame reads as
   disorientation, so the matrix has no b or c term anywhere and `audit()` proves it. Board cut-space is
   camera-INDEPENDENT: every pointer sample is mapped through this same inverse once, in `toPointerCanvas`,
   so a cut lands in the same design place at any zoom. That is the single most dangerous thing in the phase. */
const Camera = (() => {
  const K = () => CONFIG.camera;
  const S = () => view.scale*view.dpr;
  let cur = { zoom: 1, panX: 0, panY: 0 };
  let from = null, to = null, t0 = 0, dur = 0, state = 'STATION';
  let driftAmt = 0, driftPh = 0, moves = 0;
  function target(st){
    const C = K();
    if(st === 'ROOM')    return { zoom: C.ZOOM_ROOM,    panX: C.PAN_ROOM.x,    panY: C.PAN_ROOM.y };
    if(st === 'PLATE')   return { zoom: C.ZOOM_PLATE,   panX: C.PAN_PLATE.x,   panY: C.PAN_PLATE.y };
    if(st === 'HANDOFF') return { zoom: C.ZOOM_HANDOFF, panX: C.PAN_HANDOFF.x, panY: C.PAN_HANDOFF.y };
    return { zoom: C.ZOOM_STATION, panX: C.PAN_STATION.x, panY: C.PAN_STATION.y };
  }
  /* The camera's effective values: the state tween PLUS idle drift. One function, read by the matrices AND by
     the inverse, so what the eye sees and what the finger means can never disagree by a frame. */
  function eff(){
    if(driftAmt <= 0.0001) return cur;
    const C = K();
    return { zoom: cur.zoom + C.IDLE_DRIFT_ZOOM*driftAmt*(0.5 - 0.5*Math.cos(driftPh)),
             panX: cur.panX + C.IDLE_DRIFT_PAN_PX*driftAmt*Math.sin(driftPh),
             panY: cur.panY + C.IDLE_DRIFT_PAN_PX*0.6*driftAmt*Math.sin(driftPh*0.5) };
  }
  return {
    state(){ return state; }, zoom(){ return eff().zoom; }, pan(){ const e = eff(); return { x: e.panX, y: e.panY }; },
    moving(){ return !!from; }, moves(){ return moves; }, drift(){ return +driftAmt.toFixed(4); },
    /* atRest is what keeps gameplay free: at STATION with no drift the room is ONE blit and the world matrix
       is bit-for-bit 5A's, so nothing about cutting knows a camera exists. */
    atRest(){ const e = eff();
      return !from && e.zoom === 1 && e.panX === 0 && e.panY === 0; },
    go(st, ms){
      const nxt = target(st), same = st === state;
      if(same && from) return false;                                    // already on the way there
      if(same && cur.zoom === nxt.zoom && cur.panX === nxt.panX && cur.panY === nxt.panY) return false;
      state = st; from = { ...eff() }; to = nxt; t0 = performance.now(); moves++;
      dur = ms != null ? ms : (nxt.zoom >= from.zoom ? K().CAM_PUSH_MS : K().CAM_PULL_MS);
      return true;
    },
    snap(st){ state = st; cur = target(st); from = to = null; return cur; },
    tick(now, dt){
      if(from){
        const k = dur <= 0 ? 1 : clamp01((now - t0)/dur), e = easeOut(k);
        cur = { zoom: from.zoom + (to.zoom - from.zoom)*e,
                panX: from.panX + (to.panX - from.panX)*e, panY: from.panY + (to.panY - from.panY)*e };
        if(k >= 1){ cur = { ...to }; from = null; }
      }
      /* Idle drift belongs to the ROOM only. The gameplay framing is stable, always — a board that breathes
         while you are aiming at it is a moving target, and this game never moves the target. */
      const C = K(), want = (IdleState.idle() && state === 'ROOM' && phase !== 'cutting' && !from) ? 1 : 0;
      if(want > driftAmt) driftAmt = Math.min(1, driftAmt + dt/C.IDLE_DRIFT_IN_MS);
      else if(want < driftAmt) driftAmt = Math.max(0, driftAmt - dt/C.IDLE_EXIT_MS);
      if(driftAmt > 0) driftPh = (driftPh + (dt/C.IDLE_DRIFT_MS)*Math.PI*2) % (Math.PI*2);
      else driftPh = 0;
    },
    /* design → device. No rotation term exists to get wrong: b and c are literal zeros. */
    world(){ const e = eff(), s = S(), F = K().FOCUS;
      return { a: s*e.zoom, b: 0, c: 0, d: s*e.zoom,
               e: view.ox*view.dpr + s*(F.x*(1 - e.zoom) + e.zoom*e.panX),
               f: view.oy*view.dpr + s*(F.y*(1 - e.zoom) + e.zoom*e.panY) }; },
    /* The same transform for a pre-rendered LAYER, whose pixels already sit in zoom-1 device space. `factor`
       is the layer's parallax rate: 1 moves with the station, 0.4 with the window. */
    blit(factor){ const e = eff(), s = S(), F = K().FOCUS;
      const z = 1 + (e.zoom - 1)*factor;
      const ax = view.ox*view.dpr + s*F.x, ay = view.oy*view.dpr + s*F.y;
      return { a: z, b: 0, c: 0, e: (1 - z)*ax + z*s*e.panX*factor, f: (1 - z)*ay + z*s*e.panY*factor }; },
    toDesign(cx, cy){ const e = eff(), F = K().FOCUS;      // the ONE inverse: cut space is camera-independent
      return { x: (cx/view.scale - F.x)/e.zoom + F.x - e.panX,
               y: (cy/view.scale - F.y)/e.zoom + F.y - e.panY }; },
    forwardView(x, y){ const e = eff(), F = K().FOCUS;     // design → CSS px within the canvas box
      return { x: view.ox + view.scale*(F.x + e.zoom*(x - F.x + e.panX)),
               y: view.oy + view.scale*(F.y + e.zoom*(y - F.y + e.panY)) }; },
    testProgress(k){ if(from){ t0 = performance.now() - dur*k; this.tick(performance.now(), 16); } return eff(); },
    testDrift(a){ driftAmt = a; driftPh = Math.PI; return eff(); },
    /* §9.9 the audit: the camera's own source may not contain a rotation, and its matrices may not carry one. */
    audit(){
      const src = [target, eff, this.world, this.blit, this.toDesign, this.forwardView, this.tick, this.go, this.snap]
        .map(f => f.toString()).join('\n');
      const w = this.world(), b = this.blit(K().PARALLAX.far);
      return { fns: 9, chars: src.length, rotateInSource: (src.match(/\brotate\b/g) || []).length,
        worldB: w.b, worldC: w.c, blitB: b.b, blitC: b.c }; },
    report(){ const e = eff(), w = this.world();
      return { state, moving: !!from, moves, zoom: +e.zoom.toFixed(4),
        pan: { x: +e.panX.toFixed(2), y: +e.panY.toFixed(2) }, drift: +driftAmt.toFixed(4),
        atRest: this.atRest(), parallax: K().PARALLAX,
        matrix: { a: +w.a.toFixed(4), b: w.b, c: w.c, e: +w.e.toFixed(3), f: +w.f.toFixed(3) } }; },
  };
})();

/* The story layer's two presentation flags (§20): while a story beat is on screen the room does not take
   input-driven camera pushes, and the board can be drawn BARE — a neglected kitchen has no food on it. */
let storyLock = false, storyBare = false;

/* ---------- SceneFlow (§62): two paths, ONE state machine ----------
   Same rule that made kitchenReveal a single value in 5A: no duplicate code path. A first-ever player starts
   AT the station and the room is revealed by the pull-back after their first plate. A returning player starts
   in the room and the camera pushes in. Input at any moment during the intro wins immediately. */
const SceneFlow = (() => {
  const S = () => CONFIG.sceneflow, C = () => CONFIG.camera;
  let mode = 'boot', at = 0, pushed = false, skipped = false;
  function reach(tag){ if(startupMarks.cuttableAt == null){ startupMarks.cuttableAt = +performance.now().toFixed(1);
      startupMarks.cuttableVia = tag; } }
  function toStation(ms, tag){ pushed = true; Camera.go('STATION', ms); mode = 'live'; reach(tag); }
  const skip = () => { if(storyLock) return; if(mode === 'intro'){ skipped = true; toStation(C().SKIP_PUSH_MS, 'input'); } };
  for(const ev of ['pointerdown','keydown'])              // never touches the cut path: the room yields, the game doesn't
    window.addEventListener(ev, skip, { capture: true, passive: true });
  return {
    mode(){ return mode; }, skipped(){ return skipped; },
    begin(){
      mode = 'intro'; at = performance.now(); pushed = false; skipped = false;
      if(SceneMemory.firstDone()){ Camera.snap('ROOM'); }                 // the room they already earned
      else { Camera.snap('STATION'); toStation(0, 'first-ever'); }        // board, tomato, ghost hand — nothing else
      return mode;
    },
    tick(now){
      if(storyLock) return;                      // the story owns the camera while it is on screen
      if(mode !== 'intro' || pushed) return;
      const hold = Math.min(S().INTRO_HOLD_MS, Math.max(0, S().INTRO_MAX_MS - C().CAM_PUSH_MS));
      if(now - at >= hold) toStation(null, 'intro');
    },
    /* The payoff states. Each is one call at one moment — there is no second camera path for a first player. */
    plating(){ Camera.go('PLATE', C().CAM_PUSH_MS); },
    handoff(){ Camera.go('HANDOFF', 220); },
    taken(){ Camera.go('ROOM', C().CAM_PULL_MS); },        // the pull-back IS the reveal, and the reward
    prep(){ Camera.go('STATION', C().CAM_PUSH_MS); },
    report(){ return { mode, skipped, cameraState: Camera.state(),
      introHoldMs: S().INTRO_HOLD_MS, introMaxMs: S().INTRO_MAX_MS,
      cuttableAt: startupMarks.cuttableAt, cuttableVia: startupMarks.cuttableVia || null }; },
    testBegin(){ startupMarks.cuttableAt = null; startupMarks.cuttableVia = null; return this.begin(); },
  };
})();

function rrp(c,x,y,w,h,r){    // rr() paints on the shared ctx; the layers need their own
  c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function softShadow(c, x, y, rx, ry, a){   // one light, upper-left: every object in the room drops the same way
  const R = Math.max(1, rx);
  c.save(); c.translate(x, y); c.scale(1, Math.max(0.05, ry/R));
  const g = c.createRadialGradient(0, 0, 1, 0, 0, R);
  g.addColorStop(0, 'rgba(58,40,26,' + a + ')'); g.addColorStop(1, 'rgba(58,40,26,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, Math.PI*2); c.fill(); c.restore();
}
/* Room objects use DESATURATED variants of the palette — only the food is fully saturated (§9). Food that
   is scenery (what is waiting in the basket) is one step back from the food that is being cut. */
const ROOM_FOOD = { tomato:['#C2564E','#A8403A'], cucumber:['#8AA267','#6E8A52'], carrot:['#C67E42','#A96430'] };

/* ---------- StationLayout (§3, §53d): the workspace, identical every session ----------
   Hand-placed and slightly imperfect — the towel not quite square, the oil bottle a little off-axis.
   NOTHING here is procedurally scattered: procedural placement is the fastest way to make a room feel
   generated rather than lived in.
   5A-2 SCALE AND DENSITY: every near object is roughly twice its 5A size and the near edge is ONE overlapping
   cluster — small, evenly spaced objects read as toys on a shelf. Pass 2 RAISED the whole cluster: with the
   drawn face ending at y720 there is real table between it and the frame bottom, so each object is now
   recognisable and sitting ON the table, cropped at most at one edge, instead of being a fragment falling off
   the frame. The keep-out is `faceKeepOut()` — the drawn face plus the plate rim (§53h) — not the cut rect.
   CONTROLS: no object sits under the pause chip (x 486..518) or under the new-ingredient control WITHIN the
   540x960 frame — that control is fixed to the window's bottom-right, so on a tall phone it lands in the
   vertical BLEED (design y~964+) and rests over the near cluster's tails. Deliberate and harmless: the
   button is opaque, the objects there are already cropped by the frame, and nothing readable is behind it. */
const StationLayout = {
  rack:    { x:296, y:38,  w:184 },
  pot:     { x:150, y:28,  w:58, h:86 },
  pot2:    { x:198, y:44,  w:50, h:70 },        // arrives at LIVED_IN_2 sessions (§6)
  basket:  { x:-40,  y:752, w:232, h:140 },     // large, and only lightly cropped by the left frame edge now
  loose:   { x:212,  y:816, r:28 },             // yesterday's ingredient, already sitting by the board
  towel:   { x:158,  y:822, w:178, h:76, rot:2.4 },
  oil:     { x:326,  y:750, w:58,  h:138, rot:1.6 },
  grinder: { x:392,  y:766, w:62,  h:118 },
  plate:   { x:288,  y:790, w:220, h:102 },
  draw(c, warm, tier, basketIng, detail){
    this.knifeRack(c, warm);
    this.herbPot(c, this.pot, warm, 5);
    if(tier >= 2) this.herbPot(c, this.pot2, warm, 4);
    /* Near cluster, back to front — the overlaps are the composition, so the order is not arbitrary. */
    this.ingBasket(c, warm, basketIng, detail);
    this.towelFolded(c, warm, tier);
    this.looseIngredient(c, warm, basketIng);
    this.servingPlate(c, warm);
    this.oilBottle(c, warm);
    this.saltGrinder(c, warm);
  },
  /* One produce routine for every piece of scenery food: the basket, the spill and the loose one (§9 —
     scenery food is one step back from the food being cut, so it is drawn from ROOM_FOOD, never from PAINT). */
  produce(c, kind, x, y, r, warm){
    const food = ROOM_FOOD[kind] || ROOM_FOOD.tomato, long = kind === 'cucumber' || kind === 'carrot';
    c.fillStyle = mixHex(food[0], food[1], 0.32);
    c.beginPath();
    if(kind === 'carrot'){
      c.ellipse(x, y, r*1.55, r*0.44, 0.16, 0, Math.PI*2); c.fill();
      c.strokeStyle = mixHex('#7C8E63','#87905C', warm); c.lineWidth = 2; c.lineCap = 'round';
      for(const a of [-0.5,-0.15,0.2]){
        c.beginPath(); c.moveTo(x - r*1.5, y - r*0.1);
        c.quadraticCurveTo(x - r*1.9, y - r*0.6 + a*6, x - r*2.2, y - r*1.0 + a*10); c.stroke(); }
    } else if(long){ c.ellipse(x, y, r*1.42, r*0.56, -0.12, 0, Math.PI*2); c.fill(); }
    else { c.ellipse(x, y, r, r*0.87, 0, 0, Math.PI*2); c.fill(); }
    c.fillStyle = 'rgba(255,246,232,0.20)';                 // one specular, from the window side
    c.beginPath(); c.ellipse(x - r*0.34, y - r*0.36, r*(long?0.52:0.40), r*0.22, -0.32, 0, Math.PI*2); c.fill();
  },
  knifeRack(c, warm){          // hung on the wall over the table: the tools of the verb, above the verb
    const R = this.rack, steel = mixHex('#8B9299','#96908A', warm), grip = mixHex('#6C5745','#77593F', warm);
    softShadow(c, R.x + R.w/2 + 5, R.y + 17, R.w*0.54, 10, 0.20);
    c.fillStyle = mixHex('#8A7562','#96795F', warm); rrp(c, R.x, R.y, R.w, 12, 4); c.fill();
    c.fillStyle = 'rgba(255,246,232,0.16)'; c.fillRect(R.x+3, R.y+1.5, R.w-6, 2.5);
    for(let i=0;i<4;i++){
      const x = R.x + 28 + i*43, len = 40 + i*4, w = 9 + i*1.5, y0 = R.y + 30;
      c.fillStyle = grip; rrp(c, x-4.5, R.y+10, 9, 23, 3.5); c.fill();
      c.beginPath();
      c.moveTo(x-w/2, y0); c.lineTo(x+w/2, y0); c.lineTo(x+w/2-1.4, y0+len*0.80); c.lineTo(x-w/2+0.6, y0+len);
      c.closePath(); c.fillStyle = steel; c.fill();
      c.fillStyle = 'rgba(255,252,246,0.30)'; c.fillRect(x-w/2, y0, 2, len*0.78);   // the window catches the flat
    }
  },
  herbPot(c, P, warm, n){      // herbs live by the window
    const by = P.y + P.h*0.42, bh = P.h*0.58;
    softShadow(c, P.x + P.w/2 + 3, P.y + P.h - 1, P.w*0.62, 6, 0.18);
    c.fillStyle = mixHex('#A8785F','#B4805E', warm);
    c.beginPath(); c.moveTo(P.x+2, by); c.lineTo(P.x+P.w-2, by);
    c.lineTo(P.x+P.w-7, P.y+P.h); c.lineTo(P.x+7, P.y+P.h); c.closePath(); c.fill();
    c.fillStyle = mixHex('#B78770','#C28D6A', warm); rrp(c, P.x, by-5, P.w, 6, 2); c.fill();
    c.fillStyle = 'rgba(255,244,230,0.13)'; c.fillRect(P.x+4, by, 3, bh-4);
    const stem = mixHex('#7C8E63','#87905C', warm), leaf = mixHex('#8DAA6D','#98A863', warm);
    c.lineCap = 'round'; c.lineWidth = 1.6;
    for(let i=0;i<n;i++){
      const t = n < 2 ? 0.5 : i/(n-1), x = P.x + P.w*(0.24 + 0.52*t), lean = (t-0.5)*11;
      c.strokeStyle = stem;
      c.beginPath(); c.moveTo(x, by-3); c.quadraticCurveTo(x+lean*0.5, P.y+P.h*0.20, x+lean, P.y+1); c.stroke();
      c.fillStyle = leaf;
      for(const k of [0.36,0.66,0.92]){
        const lx = x + lean*k*k, ly = by-3 - (by-3-(P.y+1))*k;
        c.beginPath(); c.ellipse(lx + (k>0.5?2:-2), ly, 3.4, 2.0, lean*0.06 + (k>0.5?0.5:-0.5), 0, Math.PI*2); c.fill();
      }
    }
  },
  ingBasket(c, warm, ing, detail){
    const B = this.basket, rim = B.y + 16;
    softShadow(c, B.x + B.w/2 + 6, B.y + B.h - 8, B.w*0.60, 14, 0.28);
    c.save();
    c.beginPath(); c.moveTo(B.x, rim); c.lineTo(B.x+B.w, rim);
    c.lineTo(B.x+B.w-24, B.y+B.h); c.lineTo(B.x+24, B.y+B.h); c.closePath();
    c.fillStyle = mixHex('#AE9268','#BC9663', warm); c.fill();
    if(detail){                                 // four courses, eight stakes: woven, not textured
      c.save(); c.clip();
      c.strokeStyle = 'rgba(92,70,44,0.22)'; c.lineWidth = 2;
      for(let i=1;i<=4;i++){ const y = rim + (B.h-16)*i/5;
        c.beginPath(); c.moveTo(B.x, y); c.lineTo(B.x+B.w, y); c.stroke(); }
      for(let i=1;i<8;i++){ const x = B.x + B.w*i/8;
        c.beginPath(); c.moveTo(x, rim); c.lineTo(x + (x-(B.x+B.w/2))*-0.12, B.y+B.h); c.stroke(); }
      c.restore();
    }
    c.restore();
    /* What they usually prep, waiting where they left it (§6) — heaped, overlapping, and spilling over the
       rim onto the table. All three ingredients are in the basket: the kitchen holds more than tonight's order. */
    c.save();
    c.beginPath(); c.rect(B.x-10, B.y-46, B.w+20, 62 + 16); c.clip();
    const others = ['tomato','cucumber','carrot'].filter(k => k !== ing);
    this.produce(c, others[0], B.x+B.w*0.24, rim-6, 26, warm);
    this.produce(c, ing,       B.x+B.w*0.56, rim-14, 32, warm);
    this.produce(c, others[1], B.x+B.w*0.84, rim-4, 24, warm);
    this.produce(c, ing,       B.x+B.w*0.38, rim-30, 27, warm);
    c.restore();
    c.fillStyle = mixHex('#8E7550','#9A784E', warm); rrp(c, B.x-4, B.y+8, B.w+8, 14, 6); c.fill();
    c.fillStyle = 'rgba(255,246,232,0.16)'; c.fillRect(B.x-1, B.y+10, B.w+2, 3);
  },
  looseIngredient(c, warm, ing){   // one that rolled out of the basket, on the table beside the board
    const L = this.loose;
    softShadow(c, L.x + 5, L.y + L.r*0.88, L.r*1.35, 8, 0.24);
    this.produce(c, ing, L.x, L.y, L.r, warm);
  },
  towelFolded(c, warm, tier){  // not quite square, and it moves a little once the kitchen knows them (§6)
    const W = this.towel, dx = tier >= 1 ? 7 : 0, dy = tier >= 1 ? -5 : 0;
    c.save();
    c.translate(W.x + dx, W.y + dy); c.rotate((W.rot + (tier >= 1 ? 1.9 : 0))*Math.PI/180);
    softShadow(c, W.w/2 + 3, W.h - 1, W.w*0.52, 5, 0.16);
    c.fillStyle = mixHex('#DED7C8','#EBDEC7', warm); rrp(c, 0, 0, W.w, W.h, 4); c.fill();
    c.fillStyle = mixHex('#E7E1D3','#F3E7D2', warm); rrp(c, 3, -3, W.w-6, W.h*0.56, 4); c.fill();
    c.fillStyle = 'rgba(120,104,84,0.12)'; c.fillRect(3, W.h*0.53, W.w-6, 1.3);
    c.globalAlpha = 0.5; c.fillStyle = mixHex('#93A97A','#9DAA6E', warm);
    c.fillRect(6, W.h*0.14, W.w-12, 3); c.fillRect(6, W.h*0.24, W.w-12, 1.5);
    c.globalAlpha = 1; c.fillStyle = 'rgba(255,250,240,0.30)'; rrp(c, 4, -2, W.w-8, 2.5, 1); c.fill();
    c.restore();
  },
  oilBottle(c, warm){          // a little off-axis, because a hand put it down
    const O = this.oil, cx = O.x + O.w/2;
    c.save(); c.translate(cx, O.y+O.h); c.rotate(O.rot*Math.PI/180); c.translate(-cx, -(O.y+O.h));
    softShadow(c, cx + 4, O.y + O.h - 1, O.w*0.95, 5, 0.18);
    c.fillStyle = mixHex('#5F6B52','#6D7150', warm);
    rrp(c, O.x, O.y+O.h*0.30, O.w, O.h*0.70, 6); c.fill();
    c.fillRect(O.x+O.w*0.34, O.y+O.h*0.09, O.w*0.32, O.h*0.25);
    c.fillStyle = 'rgba(196,168,86,0.26)'; rrp(c, O.x+2.5, O.y+O.h*0.50, O.w-5, O.h*0.46, 5); c.fill();
    c.fillStyle = mixHex('#93795C','#9E7C55', warm); rrp(c, O.x+O.w*0.29, O.y+O.h*0.01, O.w*0.42, O.h*0.10, 2); c.fill();
    c.fillStyle = 'rgba(240,234,212,0.22)'; c.fillRect(O.x+3.5, O.y+O.h*0.36, 2.4, O.h*0.50);
    c.restore();
  },
  saltGrinder(c, warm){
    const G = this.grinder;
    softShadow(c, G.x + G.w/2 + 3, G.y + G.h - 1, G.w*0.85, 5, 0.18);
    c.fillStyle = mixHex('#A18869','#AE8A63', warm); rrp(c, G.x, G.y+G.h*0.20, G.w, G.h*0.80, 4); c.fill();
    c.fillStyle = mixHex('#8B9299','#948F86', warm); rrp(c, G.x+G.w*0.17, G.y, G.w*0.66, G.h*0.25, 3); c.fill();
    c.fillStyle = 'rgba(255,248,236,0.16)'; c.fillRect(G.x+3, G.y+G.h*0.26, 2.4, G.h*0.60);
    c.fillStyle = 'rgba(92,70,44,0.14)'; c.fillRect(G.x+2, G.y+G.h*0.60, G.w-4, 1.3);
  },
  servingPlate(c, warm){       // where the finished prep goes. The plate on the board is the same ceramic
    const P = this.plate, cx = P.x+P.w/2, cy = P.y+P.h/2, rx = P.w/2, ry = P.h/2;
    softShadow(c, cx + 4, cy + ry*0.78, rx*0.96, ry*0.46, 0.16);
    const g = c.createLinearGradient(cx-rx, cy-ry, cx+rx, cy+ry);
    g.addColorStop(0, mixHex('#F4EEE2','#FAF0DC', warm)); g.addColorStop(1, mixHex('#DFD7C7','#E7D8BE', warm));
    c.fillStyle = g; c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = 'rgba(120,104,84,0.16)'; c.lineWidth = 1.2;
    c.beginPath(); c.ellipse(cx, cy, rx*0.80, ry*0.76, 0, 0, Math.PI*2); c.stroke();
  },
};

/* ---------- OrderBoard (§4): the order clipboard ----------
   A physical wooden clipboard standing against the wall beside the board, not a UI panel: no rounded-rect
   card, no dialog shadow. The recipe NAME and OBJECTIVE stay the existing DOM text in the cookbook serif +
   clean sans, and the objective pips stay exactly as built — they just live on the clipboard now.
   TYPE DECISION (§4, criterion 10): the paper is the handwritten object, not the letterforms. A script face
   at 13px on a 540-wide frame costs readability outright, and shipping one would cost an asset file (§11) —
   so the hand shows up as paper, a coffee ring, a fold, a crossed-out line and a slightly off-square pin. */
const OrderBoard = {
  board: { x:12, y:32, w:238, h:94, tilt:-1.1 },
  paper: { x:5, y:8, w:228, h:80 },            // relative to the board's own origin
  text:  { x:14, y:5 },                        // where the DOM block sits inside the paper. A two-row pip
                                               // recipe (dice 3×3) is the tall case, so the paper is sized for it
  hash(id){ let h = 0; for(let i=0;i<(id||'').length;i++) h = (h*31 + id.charCodeAt(i)) & 0x7fffffff; return h; },
  place(){                                     // the writing is pinned to the paper, so it tilts with it
    const B = this.board, P = this.paper, X = this.text, hud = document.getElementById('hud');
    if(!hud) return;
    const px = B.x + P.x + X.x, py = B.y + P.y + X.y;
    /* 5B: the clipboard is an object in the room, so the DOM text on it must move with the camera. One point is
       placed exactly — the clipboard's own origin — and the rest follows from scaling about that same origin. */
    const o = Camera.forwardView(B.x, B.y), z = Camera.zoom();
    hud.style.left = (o.x - (B.x - px)*view.scale) + 'px';
    hud.style.top  = (o.y - (B.y - py)*view.scale) + 'px';
    hud.style.transformOrigin = ((B.x - px)*view.scale) + 'px ' + ((B.y - py)*view.scale) + 'px';
    hud.style.transform = 'scale(' + z.toFixed(5) + ') rotate(' + B.tilt + 'deg)';
  },
  textRect(){ const B = this.board, P = this.paper, X = this.text;
    return { x: B.x + P.x + X.x, y: B.y + P.y + X.y, paper: { x: B.x+P.x, y: B.y+P.y, w: P.w, h: P.h } }; },
  draw(c, warm, recipeId){
    const B = this.board, P = this.paper, h = this.hash(recipeId);
    c.save();
    c.translate(B.x, B.y); c.rotate(B.tilt*Math.PI/180);
    softShadow(c, B.w/2 + 6, B.h + 1, B.w*0.50, 8, 0.22);
    c.fillStyle = mixHex('#8A7159','#96795C', warm); rrp(c, 0, 0, B.w, B.h, 5); c.fill();
    c.fillStyle = 'rgba(255,246,232,0.14)'; rrp(c, 2, 1, B.w-4, 2.5, 1); c.fill();
    c.fillStyle = 'rgba(58,38,20,0.16)'; rrp(c, 2, B.h-3.5, B.w-4, 2, 1); c.fill();
    c.save();
    c.shadowColor = 'rgba(60,42,26,0.20)'; c.shadowBlur = 5; c.shadowOffsetX = 1; c.shadowOffsetY = 2;
    c.fillStyle = mixHex('#F5F0E6','#FAF1DF', warm); rrp(c, P.x, P.y, P.w, P.h, 2); c.fill();
    c.restore();
    c.save(); rrp(c, P.x, P.y, P.w, P.h, 2); c.clip();
    /* Deterministic per recipe, never per frame: the same order always carries the same marks. */
    const fx = P.x + 46 + h % 92;                                         // a soft fold
    c.fillStyle = 'rgba(120,104,84,0.055)'; c.fillRect(fx, P.y, 2.2, P.h);
    c.fillStyle = 'rgba(255,255,255,0.45)'; c.fillRect(fx+2.2, P.y, 1.2, P.h);
    const rx = P.x + 168 + (h>>4)%14, ry = P.y + 26 + (h>>7)%8, rr0 = 15 + (h>>11)%5;   // a faint coffee ring
    c.strokeStyle = 'rgba(150,112,64,0.13)'; c.lineWidth = 2.4;
    c.beginPath(); c.arc(rx, ry, rr0, 0, Math.PI*2); c.stroke();
    c.strokeStyle = 'rgba(150,112,64,0.05)'; c.lineWidth = 5;
    c.beginPath(); c.arc(rx, ry, Math.max(3, rr0-2.6), 0.5, 4.3); c.stroke();
    const cy0 = P.y + 56 + (h>>13)%4, cw = 38 + (h>>17)%16;               // one line, written and struck out
    c.lineCap = 'round'; c.lineWidth = 1.4;
    c.strokeStyle = 'rgba(80,84,90,0.26)';
    c.beginPath(); c.moveTo(P.x+152, cy0); c.lineTo(P.x+152+cw, cy0); c.stroke();
    c.strokeStyle = 'rgba(80,84,90,0.42)';
    c.beginPath(); c.moveTo(P.x+149, cy0+2); c.lineTo(P.x+155+cw, cy0-2); c.stroke();
    c.restore();
    const clw = 34, clx = B.w/2 - clw/2;                                   // the clip, holding the paper down
    c.fillStyle = 'rgba(58,38,20,0.14)'; rrp(c, clx+1, P.y-2, clw, 12, 3); c.fill();
    const cg = c.createLinearGradient(clx, -4, clx, 14);
    cg.addColorStop(0, mixHex('#B9BEC2','#C6C1B4', warm)); cg.addColorStop(1, mixHex('#7E858B','#8A8479', warm));
    c.fillStyle = cg; rrp(c, clx, -4, clw, 16, 4); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.28)'; c.fillRect(clx+3, -2, clw-6, 1.6);
    c.fillStyle = 'rgba(50,54,58,0.28)'; c.fillRect(clx+4, 9, clw-8, 1.4);
    c.restore();
  },
};

/* ---------- KitchenScene (§2, §11): composition, layered pre-render, one blit per frame ---------- */
const KitchenScene = (() => {
  const MIN_GAP_MS = 220;               // however fast the light moves, the room re-renders at most this often
  const L = { far: null, near: null, flat: null };
  let farKey = '', nearKey = '', lastAt = 0, renders = 0, farRenders = 0, nearRenders = 0;
  let worstFar = 0, worstNear = 0, worstFlat = 0, slow = 0, detail = true;
  let reveal = SceneMemory.firstDone() ? 1 : 0;          // §5: ONE value, driving ONE renderer. No second path
  const layer = rs => { const cv = document.createElement('canvas'); return { cv, c2: cv.getContext('2d'), rs }; };
  /* 5B: each layer is pre-rendered OVERSCAN wider than the frame, because a pull-back that finds nothing at
     the edges is worse than no pull-back. The extra margin is remembered per layer so the blit can place it. */
  function fit(l, w, h){
    const ov = CONFIG.camera.OVERSCAN;
    const W = Math.max(2, Math.round(w*l.rs*ov)), H = Math.max(2, Math.round(h*l.rs*ov));
    if(l.cv.width !== W || l.cv.height !== H){ l.cv.width = W; l.cv.height = H; }
    l.ox = (W - w*l.rs)/2; l.oy = (H - h*l.rs)/2;
    l.c2.setTransform(1,0,0,1,0,0); l.c2.clearRect(0, 0, W, H);
    const s = view.scale*view.dpr*l.rs;                  // every layer paints in DESIGN coordinates
    l.c2.setTransform(s, 0, 0, s, view.ox*view.dpr*l.rs + l.ox, view.oy*view.dpr*l.rs + l.oy);
    l.c2.filter = 'none'; l.c2.globalAlpha = 1;
  }
  function blit(c, l, m){                                // a layer's pixels live in zoom-1 device space
    c.setTransform(m.a, 0, 0, m.a, m.e, m.f);
    c.drawImage(l.cv, -l.ox/l.rs, -l.oy/l.rs, l.cv.width/l.rs, l.cv.height/l.rs);
  }
  /* The padded area the layers cover, and (i*) the true viewport inside it. Gradients are built from the
     INNER bounds and the fills extend past them, so every pixel inside the frame is what 5A drew. */
  function bounds(){
    const cw = canvas.width/view.dpr, ch = canvas.height/view.dpr, ov = CONFIG.camera.OVERSCAN;
    const x0 = -view.ox/view.scale, y0 = -view.oy/view.scale;
    const x1 = (cw - view.ox)/view.scale, y1 = (ch - view.oy)/view.scale;
    const px = (x1-x0)*(ov-1)/2, py = (y1-y0)*(ov-1)/2;
    return { x0: x0-px, y0: y0-py, x1: x1+px, y1: y1+py, ix0: x0, iy0: y0, ix1: x1, iy1: y1 };
  }
  /* ---------- 5A-2 value tools (§53a) ----------
     The room is graded DOWN so the board can be the brightest surface in frame. The pool and the vignette are
     the same two shapes on both layers — far and near can never disagree about where the light is. On the near
     layer they are applied through `source-atop`, which respects the transparency the layer depends on. */
  function vignette(c, V, amt){
    const S = CONFIG.scene;
    const g = c.createRadialGradient(270, 520, 200, 270, 520, Math.hypot(300, 520)*S.VIGNETTE_R);
    g.addColorStop(0, hexA(S.ROOM_SHADE, 0));
    g.addColorStop(0.55, hexA(S.ROOM_SHADE, amt*0.14));
    g.addColorStop(0.82, hexA(S.ROOM_SHADE, amt*0.52));
    g.addColorStop(1, hexA(S.ROOM_SHADE, amt));
    c.fillStyle = g; c.fillRect(V.x0, V.y0, V.x1-V.x0, V.y1-V.y0);
  }
  /* One pool, one origin, shared by the room and the board. It starts at the WINDOW's centre line rather than
     on the board, and falls off over most of the frame — pass 1's 470px radius from the board's own centre
     read as a hard oval spotlight, which is the one thing a window is not. */
  function lightPool(c, V, warm, mul, rmul){
    const S = CONFIG.scene, a = S.POOL_WARM*(mul == null ? 1 : mul);
    const px = S.POOL_ORIGIN[0], py = S.POOL_ORIGIN[1];
    const g = c.createRadialGradient(px, py, 60, px, py, S.POOL_R*(rmul || 1));
    g.addColorStop(0, 'rgba(255,242,216,' + (a*(0.86+0.28*warm)).toFixed(3) + ')');
    g.addColorStop(0.34, 'rgba(255,240,212,' + (a*0.60).toFixed(3) + ')');
    g.addColorStop(0.66, 'rgba(255,236,204,' + (a*0.26).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,232,198,0)');
    c.fillStyle = g; c.fillRect(V.x0, V.y0, V.x1-V.x0, V.y1-V.y0);
  }
  /* WINDOW · FAR WALL · SHELVES · BACK COUNTER — everything behind the table. Lower contrast and softer focus
     than the board by construction: half resolution, flattened toward the wash, then graded down. The light
     is laid on AFTERWARDS, so the source still reads as a source (§53a). */
  function drawFar(c, V, warm, bright){
    const S = CONFIG.scene, TT = CONFIG.kitchen.TABLE_TOP;
    const wash = mixHex('#E4E8E9','#F2E5CF', warm), deep = mixHex('#CBD1D0','#DFC9A8', warm);
    const span = Math.max(1, V.y1 - V.y0), ispan = Math.max(1, V.iy1 - V.iy0);
    const g = c.createLinearGradient(0, V.iy0, 0, V.iy1);
    g.addColorStop(0, deep);
    g.addColorStop(clamp01((40 - V.iy0)/ispan), wash);
    g.addColorStop(clamp01((TT - V.iy0)/ispan), mixHex('#B9C0BF','#CDB491', warm));
    g.addColorStop(1, mixHex('#8E9695','#A2886A', warm));
    c.fillStyle = g; c.fillRect(V.x0, V.y0, V.x1-V.x0, span);
    const fall = c.createLinearGradient(140, 0, V.x1, 0);      // the wall falls away from the light
    fall.addColorStop(0,'rgba(74,66,54,0)'); fall.addColorStop(1,'rgba(74,66,54,0.16)');
    c.fillStyle = fall; c.fillRect(V.x0, V.y0, V.x1-V.x0, TT-V.y0);
    const win = { x:30, w:272, sill:58 }, top = Math.min(V.y0, 0) - 12;
    c.fillStyle = mixHex('#DFE4E4','#EDE1CB', warm);           // the reveal around the opening
    c.fillRect(win.x-10, top, win.w+20, win.sill-top+2);
    c.fillStyle = mixHex('#D4D9D8','#E7D8BC', warm);           // sill and apron: the light lands here first
    c.fillRect(win.x-16, win.sill, win.w+32, 9);
    c.fillStyle = 'rgba(70,62,50,0.12)'; c.fillRect(win.x-16, win.sill+9, win.w+32, 3);
    if(detail){                                               // shelf, copper, herbs drying — soft and quiet
      const sx = 330, sy = 6, sw = 186;
      c.fillStyle = mixHex('#9A8571','#A6866A', warm); c.fillRect(sx, sy, sw, 9);
      c.fillStyle = 'rgba(60,46,30,0.16)'; c.fillRect(sx, sy+9, sw, 3);
      for(const [px, r] of [[sx+36, 21],[sx+86, 16]]){
        const cop = mixHex('#A98A6B','#B78C60', warm);
        c.strokeStyle = cop; c.lineWidth = 3;
        c.beginPath(); c.moveTo(px, sy+9); c.lineTo(px, sy+14); c.stroke();
        c.fillStyle = cop; c.beginPath(); c.arc(px, sy+14+r, r, 0, Math.PI*2); c.fill();
        c.fillStyle = 'rgba(255,240,216,0.18)';
        c.beginPath(); c.arc(px - r*0.30, sy+14+r - r*0.32, r*0.42, 0, Math.PI*2); c.fill();
      }
      c.strokeStyle = mixHex('#7E8C66','#8A8F5E', warm); c.lineWidth = 1.5; c.lineCap = 'round';
      for(let i=0;i<5;i++){ const x = sx+150+i*3.6;
        c.beginPath(); c.moveTo(x, sy+10); c.quadraticCurveTo(x-3+i, sy+26, x-8+i*2.4, sy+41); c.stroke(); }
    }
    c.globalAlpha = 1 - S.BG_CONTRAST;                        // distance = LESS CONTRAST, not just more blur
    c.fillStyle = wash; c.fillRect(V.x0, V.y0, V.x1-V.x0, span);
    c.globalAlpha = 1;
    /* THE GRADE. One gradient, strongest at the top of the frame and easing off toward the table: the far
       wall drops away and everything closer keeps more of itself. Value structure, in one fill. */
    const grd = c.createLinearGradient(0, V.y0, 0, TT+10);
    grd.addColorStop(0, hexA(S.ROOM_SHADE, S.FAR_SHADE));
    grd.addColorStop(1, hexA(S.ROOM_SHADE, S.FAR_SHADE*0.62));
    c.fillStyle = grd; c.fillRect(V.x0, V.y0, V.x1-V.x0, (TT+10)-V.y0);
    c.fillStyle = hexA(S.ROOM_SHADE, S.FAR_SHADE*0.62);
    c.fillRect(V.x0, TT+10, V.x1-V.x0, V.y1-(TT+10));
    /* Below the table line the far layer is not "wall": it is the rest of the kitchen the table stands in,
       and on a wide device it is all the player sees past the table's sides. Warm and dark, so those wedges
       read as more room rather than as a void the composition falls into. */
    const low = c.createLinearGradient(0, TT, 0, V.y1);
    low.addColorStop(0, hexA('#3E332A', 0.62)); low.addColorStop(1, hexA('#2F2721', 0.78));
    c.fillStyle = low; c.fillRect(V.x0, TT, V.x1-V.x0, V.y1-TT);
    /* DAYLIGHT, outside the glass — painted after the grade AND after the room's own light, because a source
       is not a surface and nothing in here may wash it out. Cool green out there against the warm room in
       here: that contrast is the whole reason an interior reads as an interior (§53e). */
    const cxw = win.x + win.w/2;                              // first the interior light: bloom, then one shaft
    const bloom = c.createRadialGradient(cxw, win.sill-6, 20, cxw, win.sill-6, 460);
    bloom.addColorStop(0, 'rgba(255,247,228,' + (0.20 + 0.16*bright).toFixed(3) + ')');
    bloom.addColorStop(0.42, 'rgba(255,246,224,' + (0.10 + 0.10*bright).toFixed(3) + ')');
    bloom.addColorStop(1, 'rgba(255,246,222,0)');
    c.fillStyle = bloom; c.fillRect(V.x0, V.y0, V.x1-V.x0, (TT+10)-V.y0);
    const sh = c.createRadialGradient(cxw+40, win.sill+30, 30, cxw+40, win.sill+30, 300);
    sh.addColorStop(0,'rgba(255,248,230,0.16)'); sh.addColorStop(1,'rgba(255,248,230,0)');
    c.fillStyle = sh; c.fillRect(V.x0, win.sill-10, V.x1-V.x0, (TT+14)-(win.sill-10));
    const dg = c.createLinearGradient(0, top, 0, win.sill);
    dg.addColorStop(0, S.DAYLIGHT[1]); dg.addColorStop(0.62, S.DAYLIGHT[0]);
    dg.addColorStop(1, mixHex(S.DAYLIGHT[0], '#E8EBD8', 0.45));
    c.fillStyle = dg; c.fillRect(win.x, top, win.w, win.sill-top);
    c.save(); c.beginPath(); c.rect(win.x, top, win.w, win.sill-top); c.clip();
    c.fillStyle = 'rgba(110,142,102,0.38)';                   // a suggestion of green, never a landscape
    for(const [bx, by, br] of [[win.x+52, win.sill-8, 46],[win.x+150, win.sill-2, 62],[win.x+232, win.sill-12, 38]]){
      c.beginPath(); c.ellipse(bx, by, br, br*0.62, 0, 0, Math.PI*2); c.fill();
    }
    c.fillStyle = 'rgba(255,255,248,0.34)'; c.fillRect(win.x, top, win.w, 24);
    c.restore();
    c.fillStyle = hexA('#23282A', 0.52);                      // muntins, dark against the glass: backlight
    c.fillRect(win.x + win.w/2 - 3, top, 6, win.sill-top);
    c.fillRect(win.x, 10, win.w, 5);
    c.fillStyle = mixHex('#6E6A5E','#6B5A44', warm); c.fillRect(win.x-10, win.sill-5, win.w+20, 6);
    /* MID BAND (§53f): back counter, jars, a plant — closer than the wall, so it is relieved of part of the
       grade and drawn warmer. Contrast and warmth both rise with proximity, and this is the middle step. */
    c.save();
    c.beginPath(); c.rect(V.x0, 34, V.x1-V.x0, (TT+6)-34); c.clip();
    const cy0 = 88, cx0 = 300;
    c.fillStyle = mixHex('#8C7A66','#9C7E5E', warm); c.fillRect(cx0, cy0, V.x1-cx0, TT-cy0);
    c.fillStyle = mixHex('#A89684','#B8977A', warm); c.fillRect(cx0, cy0, V.x1-cx0, 6);
    c.fillStyle = 'rgba(255,244,226,0.18)'; c.fillRect(cx0, cy0, V.x1-cx0, 2);
    for(const [jx, jw, jh, tone] of [[318, 30, 40, 0],[356, 24, 30, 1],[386, 34, 46, 0],[430, 26, 34, 1]]){
      const jy = cy0 - jh;
      c.fillStyle = tone ? mixHex('#B6A98F','#C2A882', warm) : mixHex('#C8BCA4','#D2B892', warm);
      rrp(c, jx, jy, jw, jh, 4); c.fill();
      c.fillStyle = tone ? 'rgba(120,96,62,0.30)' : 'rgba(140,112,70,0.22)';   // what is in them, roughly
      c.fillRect(jx+2, jy + jh*0.34, jw-4, jh*0.66-3);
      c.fillStyle = mixHex('#8E8271','#9C8468', warm); rrp(c, jx+2, jy-4, jw-4, 6, 2); c.fill();
      c.fillStyle = 'rgba(255,248,232,0.34)'; c.fillRect(jx+1.5, jy+3, 2.4, jh-8);   // rim light, window side
    }
    const px2 = 470;                                          // a plant at the counter's far end
    c.fillStyle = mixHex('#A8785F','#B4805E', warm); rrp(c, px2, cy0-26, 34, 26, 3); c.fill();
    c.strokeStyle = mixHex('#77895E','#828C57', warm); c.lineWidth = 2; c.lineCap = 'round';
    for(let i=0;i<5;i++){ const x = px2+6+i*5.5;
      c.beginPath(); c.moveTo(x, cy0-26); c.quadraticCurveTo(x-6+i*3, cy0-46, x-12+i*6, cy0-62); c.stroke(); }
    c.fillStyle = hexA(S.ROOM_SHADE, S.FAR_SHADE*(1 - S.MID_RELIEF));
    c.fillRect(V.x0, 34, V.x1-V.x0, (TT+6)-34);
    c.restore();
    vignette(c, V, S.VIGNETTE*0.92);
  }
  /* TABLE · STATION — everything in front of the wall, and the plane the board sits on. §53b: the surface
     RECEDES. Its far edge is inset by PERSP_TOP_IN and its near edge runs off both sides of the frame, and
     the grain converges with it, so the table is a plane going away rather than a wall of wood. */
  function drawNear(c, V, warm, tier, basketIng, recipeId){
    const K = CONFIG.kitchen, S = CONFIG.scene, TT = K.TABLE_TOP, TIN = K.PERSP_TOP_IN, spread = K.PERSP_SPREAD;
    const front = Math.min(V.iy1 + 2, K.HATCH_Y);      // the table's near edge. Past it the room becomes the pass
    const nx0 = V.x0 - spread, nx1 = V.x1 + spread;
    c.save();
    c.beginPath();
    c.moveTo(TIN, TT); c.lineTo(540-TIN, TT);
    c.lineTo(nx1, front); c.lineTo(nx0, front); c.closePath();
    const tg = c.createLinearGradient(0, TT, 0, V.iy1);
    tg.addColorStop(0, mixHex('#CFC0AC','#DCC49B', warm));
    tg.addColorStop(0.45, mixHex('#C5B69F','#D3B98F', warm));
    tg.addColorStop(1, mixHex('#AEA08C','#BBA078', warm));
    c.fillStyle = tg; c.fill();
    c.save(); c.clip();
    c.fillStyle = 'rgba(255,246,230,0.24)'; c.fillRect(TIN, TT, 540-2*TIN, 2);   // the lit far edge
    const ws = c.createLinearGradient(0, TT, 0, TT+26);       // the wall's contact shadow on the surface
    ws.addColorStop(0,'rgba(62,44,28,0.26)'); ws.addColorStop(1,'rgba(62,44,28,0)');
    c.fillStyle = ws; c.fillRect(nx0, TT, nx1-nx0, 26);
    if(detail){
      c.strokeStyle = 'rgba(96,72,48,0.06)'; c.lineWidth = 1;
      for(let i=0;i<=14;i++){                                 // grain runs INTO the frame and converges
        const t = i/14, xt = TIN + (540-2*TIN)*t, xb = nx0 + (nx1-nx0)*t;
        c.beginPath(); c.moveTo(xt, TT); c.lineTo(xb, front); c.stroke();
      }
      c.strokeStyle = 'rgba(96,72,48,0.05)';                  // plank joints, compressing with distance
      for(const t of [0.30, 0.58, 0.84]){
        const y = TT + (front-TT)*t*t;
        c.beginPath(); c.moveTo(nx0, y); c.lineTo(nx1, y+1.5); c.stroke();
      }
    }
    const fe = c.createLinearGradient(0, front-52, 0, front);
    fe.addColorStop(0,'rgba(58,42,26,0)'); fe.addColorStop(1,'rgba(58,42,26,0.20)');
    c.fillStyle = fe; c.fillRect(nx0, front-52, nx1-nx0, 54);
    c.restore(); c.restore();
    /* §2 THE SERVING HATCH — where the finished plate leaves. A lip and a quiet opening, no life of any kind
       (waiters, the doorway and the dining room are 5D). It is the lowest-contrast thing in the frame on
       purpose: it sits at the far end of every sightline and may never pull the eye down off the board. */
    if(V.y1 > front){
      const w = nx1-nx0, x0 = nx0, H = K.HATCH_LIP;
      const pass = c.createLinearGradient(0, front + H, 0, Math.min(V.y1, front + 110));
      pass.addColorStop(0, mixHex('#9A9184','#A69279', warm));
      pass.addColorStop(1, mixHex('#ADA598','#B8A78C', warm));
      c.fillStyle = pass; c.fillRect(x0, front, w, (V.y1 - front) + 2);
      c.fillStyle = mixHex('#A2907A','#AE9270', warm); c.fillRect(x0, front, w, H);   // the lip: one plane, room-wide
      c.fillStyle = 'rgba(255,246,230,0.16)'; c.fillRect(x0, front, w, 2);
      const cs = c.createLinearGradient(0, front + H, 0, front + H + 22);             // its contact shadow, downward
      cs.addColorStop(0,'rgba(54,40,26,0.16)'); cs.addColorStop(1,'rgba(54,40,26,0)');
      c.fillStyle = cs; c.fillRect(x0, front + H, w, 22);
    }
    /* Grade the SURFACE, before the objects stand on it (§53a). The table is a receding plane and gives up
       most of its value; the objects on it keep theirs, which is what makes near read as near. */
    c.save(); c.globalCompositeOperation = 'source-atop';
    const tgd = c.createLinearGradient(0, TT, 0, front);
    tgd.addColorStop(0, hexA(S.ROOM_SHADE, S.NEAR_SHADE*0.92));
    tgd.addColorStop(0.46, hexA(S.ROOM_SHADE, S.NEAR_SHADE*0.86));
    tgd.addColorStop(1, hexA(S.ROOM_SHADE, S.NEAR_SHADE*1.16));   // the near lip falls away again: the pool is mid-table
    c.fillStyle = tgd; c.fillRect(V.x0, V.y0, V.x1-V.x0, V.y1-V.y0);
    c.restore();
    StationLayout.draw(c, warm, tier, basketIng, detail);
    c.save(); c.globalCompositeOperation = 'source-atop';    // the pool and the corners, over everything near
    lightPool(c, V, warm, 0.62, 1.0);
    vignette(c, V, S.VIGNETTE);
    c.restore();
    /* The order clipboard is drawn AFTER the grade, and that is deliberate (§55, §53a): it is the one
       always-on piece of reading in the game, it stands directly in the window's light, and legibility is not
       negotiable. Everything else in the room gives up value; the paper does not. */
    OrderBoard.draw(c, warm, recipeId);
  }
  const q = v => Math.round(v / CONFIG.scene.BG_REDRAW_THRESHOLD);
  function keysNow(){
    const size = canvas.width + 'x' + canvas.height, warm = q(Light.warmth()), bright = q(Light.bright());
    return { far: size+'|'+warm+'|'+bright,
             near: size+'|'+warm+'|'+bright+'|'+CONFIG.recipe.id+'|'+SceneMemory.basketRecipeId()+'|'+SceneMemory.tier(),
             warm: Light.warmth(), bright: Light.bright() };
  }
  function budget(ms){ if(ms > CONFIG.kitchen.SLOW_RENDER_MS){ if(++slow >= 2) detail = false; } else slow = 0; }
  function basketIng(){
    const rec = CONFIG.recipes.RECIPES.find(r => r.id === SceneMemory.basketRecipeId());
    const st = rec && rec.stages[0];
    return (st && (st.ing || (st.rotate && st.rotate[0]))) || 'tomato';
  }
  function ensure(force){
    const w = canvas.width, h = canvas.height, k = keysNow(), now = performance.now();
    /* A host whose first layout pass reports a zero-size canvas (iframes, deferred layout) would otherwise
       divide by a layer dimension here and hand non-finite numbers to setTransform/createLinearGradient —
       one throw, caught by the frame guard, and the room never paints again. Nothing to paint yet: wait. */
    if(!(w > 0 && h > 0)) return;
    const open = force || !renders || now - lastAt > MIN_GAP_MS;
    if(!open || (k.far === farKey && k.near === nearKey)) return;
    const V = bounds();
    if(!L.far){ L.far = layer(CONFIG.kitchen.FAR_RS); L.near = layer(CONFIG.kitchen.NEAR_RS); L.flat = layer(CONFIG.kitchen.NEAR_RS); }
    if(k.far !== farKey){
      const t0 = performance.now();
      fit(L.far, w, h); drawFar(L.far.c2, V, k.warm, k.bright);
      const ms = performance.now() - t0; if(ms > worstFar) worstFar = ms; budget(ms);
      farKey = k.far; farRenders++;
    }
    if(k.near !== nearKey){
      const t0 = performance.now();
      fit(L.near, w, h); drawNear(L.near.c2, V, k.warm, SceneMemory.tier(), basketIng(), CONFIG.recipe.id);
      const ms = performance.now() - t0; if(ms > worstNear) worstNear = ms; budget(ms);
      nearKey = k.near; nearRenders++;
    }
    const t1 = performance.now();                 // one composite, so the player only ever pays for one blit
    const F = L.flat; fit(F, w, h);
    F.c2.setTransform(1,0,0,1,0,0);
    F.c2.imageSmoothingQuality = 'high';
    F.c2.drawImage(L.far.cv, 0, 0, F.cv.width, F.cv.height);
    F.c2.drawImage(L.near.cv, 0, 0, F.cv.width, F.cv.height);
    const fms = performance.now() - t1; if(fms > worstFlat) worstFlat = fms;
    lastAt = now; renders++;
    if(startupMarks.kitchenAt == null) startupMarks.kitchenAt = +performance.now().toFixed(1);
  }
  return {
    invalidate(){ farKey = nearKey = ''; },
    renders(){ return renders; },
    reveal(){ return reveal; },
    syncReveal(){ reveal = SceneMemory.firstDone() ? 1 : 0; return reveal; },
    prewarm(){ if(reveal < 1) ensure(true); },    // pay for the room while the result card is up, never mid-cut
    refresh(){ farKey = nearKey = ''; ensure(true); },  // measurement only: re-render NOW, past the rate limit
    layers(){ return { far: L.far && L.far.cv, near: L.near && L.near.cv, flat: L.flat && L.flat.cv }; },
    /* §5: the reveal is not a second code path — the room is always rendered by the same renderer and this
       one value is its opacity. On a first-ever load it is 0, so the room costs nothing until it is earned. */
    tick(dt){
      SceneMemory.tick();
      const want = SceneMemory.firstDone() ? 1 : 0;
      if(want < reveal) reveal = want;
      else if(want > reveal && phase !== 'result') reveal = Math.min(1, reveal + dt/CONFIG.kitchen.REVEAL_MS);
    },
    paint(c){
      const w = canvas.width, h = canvas.height;
      c.setTransform(1,0,0,1,0,0); c.globalAlpha = 1;
      if(reveal < 0.999){ c.fillStyle = C.cream; c.fillRect(0, 0, w, h); }
      if(reveal <= 0.001) return;
      ensure(false);
      if(!L.flat) return;
      c.globalAlpha = reveal;
      /* At rest the room is ONE blit of the flat composite, exactly as 4B and 5A. Only a camera that is
         actually moving (or drifting) pays for two, because only then do the layers disagree. */
      const rest = Camera.atRest(), PX = CONFIG.camera.PARALLAX;
      const paint = () => { if(rest) blit(c, L.flat, Camera.blit(1));
        else { blit(c, L.far, Camera.blit(PX.far)); blit(c, L.near, Camera.blit(PX.near)); } };
      paint();
      const lift = IdleState.lift();               // §7: idle lifts the exposure of the room it already drew
      if(lift > 0.0005){
        c.globalCompositeOperation = 'lighter'; c.globalAlpha = reveal*lift;
        paint();
        c.globalCompositeOperation = 'source-over';
      }
      c.setTransform(1,0,0,1,0,0); c.globalAlpha = 1;
    },
    cost(){ return { renders, worstMs: +Math.max(worstFar, worstNear, worstFlat).toFixed(2), blur: detail,
      halfRes: CONFIG.kitchen.FAR_RS, minGapMs: MIN_GAP_MS }; },
    report(){ const c = L.flat && L.flat.cv;
      return { reveal: +reveal.toFixed(3), revealTarget: SceneMemory.firstDone() ? 1 : 0, renderers: 1,
        layers: ['far','near'], composites: renders, farRenders, nearRenders, detail,

function axisFull(axis){ return CONFIG.recipe.counts ? axisCount(axis) >= countFor(axis) : false; }
function stageComplete(){ const R = CONFIG.recipe;
  return R.counts ? (axisCount('h') >= R.counts.h && axisCount('v') >= R.counts.v) : cuts.length >= R.count; }
function tolFor(){ // per-recipe tolerance overrides — julienne widens rather than moving the global bands
  return CONFIG.recipe.tol ? Object.assign({}, CONFIG.scoring, CONFIG.recipe.tol) : CONFIG.scoring; }
function minGap(axis, slope){ // the gap that lets THIS direction hold the recipe (§49)
  const A = CONFIG.assist;
  const base = CONFIG.recipe.minGap != null ? CONFIG.recipe.minGap : A.MIN_GAP_PX;
  const d = axis ? { axis, slope: slope || 0 }
    : (cuts.length ? { axis: cuts[0].axis, slope: cuts[0].slope } : { axis: CONFIG.recipe.CUT_AXIS, slope: 0 });
  const ids = idealIntercepts(d.axis, d.slope);   // measured against where ideal play actually puts the cuts
  const room = ids.length > 1 ? Math.abs(ids[1]-ids[0]) * A.GAP_CAPACITY_FRAC : Infinity;
  /* The floor is a LEGIBILITY constant, so it belongs to the food's own scale. It was tuned when every
     ingredient was authored at its own size (a carrot 112px thick); after the global scale pass the roster is
     roughly half that, and a fixed 6px floor silently refused half a ten-cut julienne taken across the narrow

function updateHud(){

  const shape = rows.map(r => r[1]).join(',');

/* ---------- particles: pooled, capped, culled under load ---------- */
const pool = Array.from({length: CONFIG.particles.PARTICLE_POOL_SIZE}, () => ({on:false}));
function emitParticles(cut, vel){
  if(fpsEMA < CONFIG.particles.CULL_FPS) return;
  const P = CONFIG.particles, PR = ING.particles;
  const n = Math.round((P.PARTICLE_COUNT_MIN + (P.PARTICLE_COUNT_MAX-P.PARTICLE_COUNT_MIN)*vel) * PR.countScale);
  const sp = spanAt(cut.axis, cut.c) || { mid: cut.axis==='h' ? T.cx : T.cy, half: 40 };
  let placed = 0;
  for(const p of pool){
    if(placed >= n) break;
    if(p.on) continue;
    const s = Math.random()*2-1;
    let x,y,nx,ny;
    if(cut.axis==='h'){ x = sp.mid + s*sp.half*0.85; y = cut.c + cut.slope*(x-T.cx); nx=0; ny=Math.random()<0.5?-1:1; }
    else { y = sp.mid + s*sp.half*0.85; x = cut.c + cut.slope*(y-T.cy); ny=0; nx=Math.random()<0.5?-1:1; }
    p.on = true; p.type = Math.random() < PR.fragChance ? 'frag' : 'wet';
    p.x = x; p.y = y; p.pr = PR;
    p.vx = nx*(20+80*Math.random()*vel) + (Math.random()*2-1)*30;
    p.vy = ny*(20+80*Math.random()*vel) - 40*Math.random()*vel;
    p.born = gameNow(); p.life = P.PARTICLE_LIFE_MS*(0.7+0.6*Math.random());
    p.r = p.type==='frag' ? 2.2+Math.random()*1.2 : 1.6+Math.random()*1.6;
    p.floor = T.cy + T.ry*0.96;                 // fragments land on the board and hop; juice does not
    placed++;
  }
}

let stroke = null;
let scriptedOnly = false; // test hook: ignore the real pointer so scripted strokes are deterministic
let latencyEMA = null, pendingEventTs = null, lastPtype = '\u2014', lastPointer = null;
canvas.addEventListener('pointerdown', e => {

canvas.addEventListener('pointermove', e => {

function addPoints(e){
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const list = (evs && evs.length) ? evs : [e];
  const rect = canvas.getBoundingClientRect();
  for(const ev of list){
    const p = toPointerCanvas(ev, rect);
    p.t = ev.timeStamp || performance.now();
    const prev = stroke.pts[stroke.pts.length-1];
    if(prev){
      const dt = p.t - prev.t;
      if(dt > 0) velEMA = velEMA*0.7 + (Math.hypot(p.x-prev.x, p.y-prev.y)/dt)*0.3;
    }
    stroke.pts.push(p);
    stroke.maxMove = Math.max(stroke.maxMove, Math.hypot(p.x-stroke.pts[0].x, p.y-stroke.pts[0].y));
    if(stroke.rub && prev) peelRub(prev, p);
  }
  const raw = list[list.length-1], lp = stroke.pts[stroke.pts.length-1];
  lastPointer = { cx: Math.round(raw.clientX), cy: Math.round(raw.clientY), x: Math.round(lp.x), y: Math.round(lp.y),
                  t01: +(((lp.y - (T.cy - T.ry)) / (2*T.ry)).toFixed(2)) };
  if(stroke.rub){ pump(); return; }             // peeling: no blade, no ghost line, no cut on release
  // the knife enters the moment movement exceeds the tap threshold — input acknowledged instantly
  if(stroke.maxMove > CONFIG.input.TAP_MAX_MOVE_PX && (!knife || knife.phase==='exit' || knife.mode==='tap')){
    knife = { mode:'swipe', phase:'enter', enterT: performance.now(), x: lp.x, y: lp.y, rot: 0, targetRot: 0, dirSign: 1, rotInit: false, dirLatch: null, shineT: -1e9, trail: [] };
    Audio.whoosh(clamp01(velEMA/2.6));
  }
  if(knife && knife.mode==='swipe' && knife.phase!=='exit'){
    knife.x = lp.x; knife.y = lp.y;
    const K = CONFIG.knife;
    let base = null; // distance-based baseline: a 3-sample window is noise, and coalesced events make it worse
    for(let i = stroke.pts.length - 2; i >= 0; i--){
      const q = stroke.pts[i];
      if(Math.hypot(lp.x - q.x, lp.y - q.y) >= K.DIR_BASELINE_PX){ base = q; break; }
    }
    if(base){
      const dx = lp.x - base.x, dy = lp.y - base.y;
      let rot = Math.atan2(dy, dx);
      // The blade shows the line that will actually be CUT, not the finger's instantaneous direction: once the
      // stroke has shape, aim at the resolved (snapped) fit, so hand wobble no longer swings the knife off the line.
      const fs = stroke.pts.length >= K.FIT_AIM_MIN_PTS ? fitStroke(stroke.pts) : null;
      if(fs) rot = fs.axis==='h' ? Math.atan(fs.slope) : Math.atan2(1, fs.slope);

      while(rot - knife.rot > Math.PI/2) rot -= Math.PI;                            // then take the equivalent angle
      while(knife.rot - rot > Math.PI/2) rot += Math.PI;                            // nearest the current one — never the long way round
      knife.targetRot = rot;

      if(!knife.dirLatch){ knife.dirSign = travel; knife.dirLatch = { dx, dy }; }
      else if(knife.dirLatch.dx*dx + knife.dirLatch.dy*dy < K.DIR_REVERSE_DOT){ knife.dirSign = travel; knife.dirLatch = { dx, dy }; }

    }
