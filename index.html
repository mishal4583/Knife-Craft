      YouTube Playables SDK — MUST be the first executable script in the
      document, ahead of every other script tag (including the module
      bootstrap below). Nothing here creates or wraps `window.ytgame`;
      the SDK defines that global itself. Outside YouTube (local dev,
      `npm run preview`) this script 404s harmlessly and every call site
      in src/game/PlayablesSDK.ts falls back to a local no-op.
    -->
    <script src="https://www.youtube.com/game_api/v1"></script>
