<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>KnifeCraft — Cozy Café Prep Game</title>
    <meta
      name="description"
      content="A cozy arcade prep-chef game. Slice, plate and perfect your craft in a warm neighborhood café kitchen."
    />
    <meta name="author" content="KnifeCraft" />
    <meta property="og:title" content="KnifeCraft — Cozy Café Prep Game" />
    <meta
      property="og:description"
      content="Slice, plate and perfect your craft in a warm café kitchen."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />

    <!--
      Playgama Bridge SDK (v2) — loaded from Playgama's CDN before the game
      bundle; it reads ./playgama-bridge-config.json. The only external
      resource the game loads. See src/game/PlayablesSDK.ts.
    -->
    <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
    <!--
      The loading screen (developer 2026-11-18): painted by THIS file alone, before any script has arrived (a phone on a slow connection used to show a
      white page for several seconds). The small logo and the bar frame are fetched first; the big pictures follow at low priority so they never slow
      the game's own files. src/lib/bootSplash.ts fills the bar with real progress and removes it when the first screen's pictures are ready.
      Pictures: scripts/make-loading-assets.py -> public/loading/. Relative paths only (preflight).
    -->
    <link rel="preload" as="image" href="./loading/logo.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./loading/bar-frame.webp" fetchpriority="high" />
    <link
      rel="preload"
      as="image"
      href="./loading/wide.webp"
      fetchpriority="high"
      media="(min-aspect-ratio: 13/10)"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b1a0e;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #2b1a0e;
        pointer-events: auto; /* taps never reach the game under it (it may be mounted already) */
        transition: opacity 0.4s ease;
      }
      /* A wide window (developer 2026-11-22: "use this image as the loading screen"): the loading screen is ONE finished picture (loading/wide.webp, Codex: the chef cutting,
         the KnifeCraft plaque, the kitchen, the bar frame and its LOADING plaque), covering the window like a background-size: cover (a stage as wide as the window or as the
         picture's 16:9, whichever is bigger, centred, so a share of the picture is a share of the stage). The picture's own bar was painted out (scripts/make-loading-wide.py);
         the REAL, growing green fill (.bs-wfill, --p) is drawn over its empty track at the picture's track box. The upright layout below is not used. A phone held upright never asks for it. */
      .bs-wide {
        display: none;
      }
      @media (min-aspect-ratio: 13/10) {
        #boot-splash {
          background: #2b1a0e;
        }
        #boot-splash > div.bs-stage {
          display: none;
        }
        #boot-splash > div.bs-wide {
          display: block;
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .bs-wstage {
          position: absolute;
          left: 50%;
          /* Wider than 16:9 the crop comes off the top (70 %) more than the bottom (30 %): the title keeps its lettering and the bar and its LOADING plaque stay on screen. */
          top: calc((100dvh - max(100dvh, 56.25vw)) * 0.7);
          width: max(100vw, 177.78dvh);
          aspect-ratio: 16 / 9;
          transform: translateX(-50%);
          container-type: inline-size;
        }
        #boot-splash .bs-wpic {
          inset: 0;
          width: 100%;
          height: 100%;
        }
        /* The picture's track: x 537-1382, y 951-989 of 1920 x 1080. */
        .bs-wtrack {
          position: absolute;
          left: 27.97%;
          top: 88.06%;
          width: 44%;
          height: 3.5%;
          overflow: hidden;
          border-radius: 999px;
        }
        .bs-wfill {
          position: absolute;
          inset: 0 auto 0 0;
          width: calc(var(--p, 0.18) * 100%);
          overflow: hidden;
          border-radius: 999px;
          background: linear-gradient(180deg, #c8ff7a 0%, #5ed32f 45%, #2f9a1f 100%);
          box-shadow:
            inset 0 2px 0 rgba(255, 255, 255, 0.6),
            inset 0 -2px 0 rgba(0, 70, 0, 0.3);
          transition: width 0.35s ease-out;
        }
        .bs-wfill::after {
          content: "";
          position: absolute;
          inset: 0;
          width: 40%;
          background: linear-gradient(
            90deg,
            rgba(255, 255, 255, 0),
            rgba(255, 255, 255, 0.5),
            rgba(255, 255, 255, 0)
          );
          animation: bs-shine 1.4s ease-in-out infinite;
        }
        /* The picture already says LOADING...; this line is for the hint "tap for music" (above the bar) and for the 25 s "still loading" message (a pill). */
        #boot-splash .bs-wtext {
          position: absolute;
          left: 0;
          right: 0;
          top: 83.2%;
          text-align: center;
          font:
            800 0/1 Fraunces,
            Georgia,
            serif;
          color: #fff6dc;
        }
        #boot-splash .bs-wtext .bs-hint {
          font-size: 1.3cqw;
          letter-spacing: 0.08em;
          padding: 0.35cqw 1.2cqw;
          border-radius: 999px;
          background: rgba(43, 26, 14, 0.7);
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        #boot-splash.stuck .bs-wtext {
          font-size: 1.5cqw;
          top: 82.6%;
        }
        #boot-splash.stuck .bs-wtext span.bs-msg {
          display: inline-block;
          padding: 0.5cqw 1.6cqw;
          border-radius: 999px;
          background: rgba(43, 26, 14, 0.82);
        }
      }
      #boot-splash.leaving {
        pointer-events: none;
        opacity: 0;
      }
      #boot-splash .bs-stage {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: calc(100dvh * 9 / 16);
        overflow: hidden;
        background:
          url("data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAAAwBQCdASoSACAAPu1gqE2ppSOiMAgBMB2JbACdMoMh+nAUoAEQBxhCdP2FdWo44FumAAD+ooG54dMLiKvSnxEWm7kNhYdplO2OcAoJQoPzleMrCmuIWQhd3Im3mDsuB14H8+cw+5cnyT2PDOpSB/+sjlBZr3QLrML+ZMSHxv1Kc0O+L+joEY6lpjV3wUXcTedHuOqnwGBKbdy/bBfxstWGdY6ezbfcDDhRyiQZJ3jMPBaC5+ymmp438/VPLcyQHkjEsmL2zxIJQa9PwTse32g9yMvT1HXXz5ZXLrVsp+mYyZBmXnDBlPtVJ1UYW+sTmBoFgT38zFc4AA==")
            center / cover no-repeat,
          linear-gradient(180deg, #5f9a6a 0%, #c98a46 52%, #7a4420 100%);
      }
      #boot-splash img {
        position: absolute;
        display: block;
        opacity: 0;
        transition: opacity 0.5s ease;
        user-select: none;
        -webkit-user-drag: none;
      }
      #boot-splash img.in {
        opacity: 1;
      }
      #boot-splash .bs-bg {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #boot-splash .bs-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(30, 15, 5, 0.25) 0%,
          rgba(30, 15, 5, 0) 30%,
          rgba(30, 15, 5, 0) 62%,
          rgba(30, 15, 5, 0.55) 100%
        );
      }
      #boot-splash .bs-col {
        position: absolute;
        inset: 0;
      }
      #boot-splash .bs-chef {
        left: 50%;
        bottom: 11%;
        height: 56%;
        width: auto;
        transform: translateX(-50%);
      }
      #boot-splash .bs-board {
        left: -4%;
        bottom: 6%;
        width: 108%;
        height: auto;
      }
      #boot-splash .bs-logo {
        left: 5%;
        top: 4%;
        width: 90%;
        height: auto;
        animation: bs-float 3.2s ease-in-out infinite;
      }
      #boot-splash .bs-bar {
        position: absolute;
        left: 9%;
        width: 82%;
        bottom: calc(1.5% + env(safe-area-inset-bottom));
        aspect-ratio: 560 / 140;
      }
      #boot-splash .bs-frame {
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #boot-splash .bs-track {
        position: absolute;
        left: 7.32%;
        top: 21.43%;
        width: 85.54%;
        height: 27.86%;
        overflow: hidden;
        border-radius: 999px;
      }
      #boot-splash .bs-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: calc(var(--p, 0.18) * 100%);
        overflow: hidden;
        border-radius: 999px;
        background: linear-gradient(180deg, #b6f56a 0%, #55c42b 55%, #2f9a1f 100%);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.55),
          inset 0 -2px 0 rgba(0, 70, 0, 0.25);
        transition: width 0.35s ease-out;
      }
      #boot-splash .bs-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.5),
          rgba(255, 255, 255, 0)
        );
        animation: bs-shine 1.4s ease-in-out infinite;
      }
      #boot-splash .bs-text {
        position: absolute;
        left: 0;
        right: 0;
        top: 66%;
        text-align: center;
        font:
          800 15px/1 Fraunces,
          Georgia,
          "Times New Roman",
          serif;
        letter-spacing: 0.1em;
        color: #fff6dc;
        text-shadow:
          0 1px 0 #6b3a12,
          0 2px 3px rgba(60, 25, 5, 0.7);
      }
      #boot-splash .bs-hint {
        font-size: 11px;
        letter-spacing: 0.06em;
        opacity: 0.9;
      }
      @keyframes bs-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @keyframes bs-shine {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img,
        #boot-splash {
          transition: none;
        }
        #boot-splash .bs-logo,
        #boot-splash .bs-fill::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading KnifeCraft">
      <div class="bs-wide" aria-hidden="true">
        <div class="bs-wstage">
          <img
            class="bs-wpic"
            src="./loading/wide.webp"
            alt=""
            width="1920"
            height="1080"
            fetchpriority="high"
            onload="this.classList.add('in')"
          />
          <span class="bs-wtrack"><span class="bs-wfill"></span></span>
          <span class="bs-wtext"><span class="bs-hint" hidden>🎵 TAP FOR MUSIC</span></span>
        </div>
      </div>
      <div class="bs-stage">
        <img
          class="bs-bg"
          src="./loading/bg.webp"
          alt=""
          width="576"
          height="1024"
          fetchpriority="low"
          decoding="async"
          onload="this.classList.add('in')"
        />
        <div class="bs-shade"></div>
        <div class="bs-col">
          <img
            class="bs-chef"
            src="./loading/chef.webp"
            alt=""
            width="420"
            height="630"
            fetchpriority="low"
            decoding="async"
            onload="this.classList.add('in')"
          />
          <img
            class="bs-board"
            src="./loading/board.webp"
            alt=""
            width="640"
            height="332"
            fetchpriority="low"
            decoding="async"
            onload="this.classList.add('in')"
          />
          <img
            class="bs-logo"
            src="./loading/logo.webp"
            alt="KnifeCraft"
            width="520"
            height="243"
            fetchpriority="high"
            onload="this.classList.add('in')"
          />
          <div class="bs-bar">
            <img
              class="bs-frame"
              src="./loading/bar-frame.webp"
              alt=""
              width="560"
              height="140"
              fetchpriority="high"
              onload="this.classList.add('in')"
            />
            <span class="bs-track"><span class="bs-fill"></span></span>
            <span class="bs-text"
              >LOADING…<span class="bs-hint" hidden> · 🎵 TAP FOR MUSIC</span></span
            >
          </div>
        </div>
      </div>
    </div>
    <script>
      // Watchdog (audit 2026-11-18): if the game's own code never arrives (a lost connection, a missing file) the bar would sit still forever.
      // After 25 s the screen says so and a tap reloads. A normal start sets html[data-booted] long before this (src/lib/bootSplash.ts).
      setTimeout(function () {
        var el = document.getElementById("boot-splash");
        if (!el || document.documentElement.getAttribute("data-booted")) return;
        var t = el.querySelector(".bs-text");
        if (t) t.textContent = "STILL LOADING… TAP TO RELOAD";
        // The wide picture says LOADING... itself: its message is a pill above the bar.
        var w = el.querySelector(".bs-wtext");
        if (w) w.innerHTML = '<span class="bs-msg">STILL LOADING… TAP TO RELOAD</span>';
        el.classList.add("stuck");
        el.addEventListener("click", function () {
          location.reload();
        });
      }, 25000);
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
